# ==============================================================================
# ArgoCD Custom Health Checks - Extensión de `argocd-cm` (ADR-021)
# ==============================================================================
# GITOPS-001: ArgoCD carga los scripts `resource.customizations.health.*`
# ÚNICAMENTE desde el ConfigMap `argocd-cm` del namespace `argocd`. Un ConfigMap
# con otro nombre se aplica sin error pero ArgoCD lo IGNORA en silencio, lo que
# reportaba CRDs no sincronizados como Healthy por ausencia de condición.
#
# Por eso este manifiesto declara el MISMO objeto que extiende (`argocd-cm`) y
# no uno homónimo. Debe aplicarse como patch de tipo `merge` para preservar el
# resto de claves que ArgoCD ya administra (ver `task gitops:health-checks`).
# Un `kubectl apply` sobrescribiría el ConfigMap completo y borraría la
# configuración de ArgoCD administrada por su operator/Helm release.
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
    architecture.pokedex.io/tier: "health-monitoring"
data:
  resource.customizations.health.external-secrets.io_ExternalSecret: |
    hs = {}
    if obj.status ~= nil then
      if obj.status.conditions ~= nil then
        for i, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" and condition.status == "True" then
            hs.status = "Healthy"
            hs.message = condition.message or "ExternalSecret sincronizado y listo"
            return hs
          end
          if condition.type == "Ready" and condition.status == "False" then
            hs.status = "Degraded"
            hs.message = condition.message or "Fallo de sincronización en ExternalSecret"
            return hs
          end
        end
      end
    end
    hs.status = "Progressing"
    hs.message = "Esperando sincronización de ExternalSecret con el proveedor remoto"
    return hs

  resource.customizations.health.kyverno.io_ClusterPolicy: |
    hs = {}
    if obj.status ~= nil then
      if obj.status.ready == true then
        hs.status = "Healthy"
        hs.message = "ClusterPolicy activa y validando reglas de admisión"
        return hs
      end
      if obj.status.conditions ~= nil then
        for i, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" and condition.status == "True" then
            hs.status = "Healthy"
            hs.message = condition.message or "ClusterPolicy activa"
            return hs
          end
        end
      end
    end
    hs.status = "Progressing"
    hs.message = "ClusterPolicy inicializándose en el controlador Kyverno"
    return hs
