# ==============================================================================
# Sobrescritura de Values para Entorno Pre-producción (LXC 800 Proxmox VE)
# ==============================================================================
# Perfil: Pre-producción On-Premise / Staging K3s en LXC 800
# Formalizado bajo Opción A (ADR-003 / ADR-025): Entorno GitOps operacional real.
#
# Racional Arquitectónico:
# - Secrets: External Secrets Operator (ESO) conectado a 'vault-backend-preprod'
#   (autenticación con pokedex-preprod-role contra secret/data/pokedex/preprod/*).
# - Reloader: Desactivado (reloader.enabled: false). Perfil Lean en LXC.
# - Rollout Restart: Procedimiento progresivo oficial ante rotación de credenciales.
# - Capacidad: Dimensionamiento ajustado a contenedor LXC 800 (1 réplica por app).
# ==============================================================================

global:
  environment: onprem-proxmox-preprod
  namespace: pokemon-app
  imagePullSecrets: []

api:
  replicaCount: 1
  deploymentAnnotations:
    reloader.stakater.com/auto: null
  podAnnotations: {}
  image:
    repository: ghcr.io/rocapellino/pokedex-api
    digest: "sha256:b7ba05c1e431aea1db7acdfc78ae3181cc85abcb656aaa8634f21dbe13621160" # SHA256 digest pinning inmutable (SSOT)
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  autoscaling:
    enabled: false
  env:
    # AUD-SEC-CORS-001: un origen por host del ingress, con el esquema que usa el
    # navegador. Sin override se heredaba el ejemplo del chart y el backend
    # rechazaba toda mutación del backoffice. Ver tests/gitops/environment_http_contract.test.ts.
    corsOrigins: "https://pokedex.preprod.proxmox.internal.lan,https://k8s-preprod.internal.lan"

web:
  replicaCount: 1
  deploymentAnnotations:
    reloader.stakater.com/auto: null
  podAnnotations: {}
  image:
    repository: ghcr.io/rocapellino/pokedex-web
    digest: "sha256:0f040e6e27f324b5429dc83fe6279c0baf6faa6df212cc94bb9a7ef178b1bf80" # SHA256 digest pinning inmutable (SSOT)
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "250m"
      memory: "128Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"
  autoscaling:
    enabled: false

ingress:
  enabled: true
  className: "traefik"
  annotations:
    # AUD-SEC-TLS-001 (ADR-016): router solo en websecure. La redirección 308 de
    # web → websecure es global de Traefik (HelmChartConfig de setup_k3s.yaml).
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: pokedex.preprod.proxmox.internal.lan
      paths:
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /pokemons
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /
          pathType: Prefix
          backend:
            service:
              name: pokemon-web-svc
              port:
                number: 8080
    # GITOPS-002: acceso directo por IP para pruebas operativas. Antes esta
    # entrada era `host: ""`, que ingress.yaml renderiza como regla SIN `host:`
    # (catch-all): cualquier peticion con un Host arbitrario alcanzaba la
    # aplicacion, sin restringir el perimetro. Se restringe al host explicito
    # del cluster, de modo que el acceso por IP sigue funcionando pero deja de
    # existir el wildcard. Ver tests/security/network_policies_security.test.ts.
    - host: k8s-preprod.internal.lan
      paths:
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /pokemons
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /
          pathType: Prefix
          backend:
            service:
              name: pokemon-web-svc
              port:
                number: 8080
  # Certificado de la CA interna (la misma que firma vault.proxmox.internal.lan),
  # cargado en Vault como TLS_CRT / TLS_KEY de pokedex/preprod y sincronizado por ESO.
  tls:
    - hosts:
        - pokedex.preprod.proxmox.internal.lan
        - k8s-preprod.internal.lan
      secretName: pokedex-tls-cert
  tlsExternalSecret:
    enabled: true
    remoteRef:
      key: "pokedex/preprod"

secrets:
  existingSecret: "pokemon-secrets"

# ADR-030: pre-prod siembra el catálogo nacional completo con la imagen de la API.
# Sin FORCE_SEED solo inserta los IDs ausentes y no pisa ediciones del backoffice.
seedJob:
  enabled: true
  dataset: "full"
  forceSeed: false

pgbouncer:
  enabled: false

reloader:
  enabled: false

externalSecrets:
  enabled: true
  refreshInterval: "1h"
  targetSecretName: "pokemon-secrets"
  secretStoreRef:
    name: "vault-backend-preprod"
    kind: "ClusterSecretStore"
  remoteRef:
    key: "pokedex/preprod"

# Aislamiento de Red en LXC 800 (ADR-013, enmienda 2026-10-04).
# El K3s real corre Flannel: el CRD CiliumNetworkPolicy no existe y su render haría
# fallar el sync de ArgoCD. Mientras no se reinstale K3s con Cilium (setup_k3s.yaml),
# el egreso usa el fallback L4: 0.0.0.0/0:443 con exclusiones anti-SSRF (IMDS,
# RFC1918 y loopback). La allowlist FQDN se conserva para cuando vuelva Cilium.
networkPolicies:
  enabled: true
  egress:
    antiSsrf: true
    externalHttps: true
    allowedExternalCidrs: []

ciliumNetworkPolicy:
  enabled: false
  fqdnAllowlist:
    - matchName: "generativelanguage.googleapis.com"
    - matchPattern: "*.githubusercontent.com"
    - matchPattern: "*.pokeapi.co"

# ADR-030: pre-prod es el único entorno Proxmox con datos, así que hereda la
# política de backup de la antigua prod on-prem (PVC local + copia a Google Drive).
backup:
  enabled: true
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  offsite:
    enabled: false
    provider: "s3-compatible"
    bucket: "pokedex-backups-offsite"
    region: "us-east-1"
    prefix: "preprod/postgres"
    secretName: "backup-offsite-creds"
  # Requiere las credenciales de rclone en Vault (secret/data/pokedex/preprod), ver GDRIVE_BACKUP_GUIDE.md
  gdrive:
    enabled: true
    folder: "PokedexBackups/preprod"
