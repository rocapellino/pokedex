# ==============================================================================
# Sobrescritura de Values para Entorno Pre-producción (LXC 800 Proxmox VE)
# ==============================================================================
# Perfil: Pre-producción On-Premise / Staging K3s en LXC 800
# Formalizado bajo Opción A (ADR-021 / ADR-025): Entorno GitOps operacional real.
#
# Racional Arquitectónico:
# - Secrets: External Secrets Operator (ESO) conectado a 'vault-backend-preprod'
#   (autenticación con pokedex-preprod-role contra secret/data/pokedex/preprod/*).
# - Reloader: Desactivado (reloader.enabled: false). Perfil Lean en LXC.
# - Rollout Restart: Procedimiento progresivo oficial ante rotación de credenciales.
# - Capacidad: Dimensionamiento ajustado a contenedor LXC 800 (1 réplica por app).
# ==============================================================================

global:
  environment: onprem-proxmox-preprod
  namespace: pokemon-app
  imagePullSecrets: []

api:
  replicaCount: 1
  deploymentAnnotations:
    reloader.stakater.com/auto: null
  podAnnotations: {}
  image:
    repository: ghcr.io/rocapellino/pokedex-api
    digest: "sha256:4113ac3d61577bd4eef013e80ec8f05ffcfa4c079b51a1dcec9d884dacc4ddbd" # SHA256 digest pinning inmutable (SSOT)
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  autoscaling:
    enabled: false

web:
  replicaCount: 1
  deploymentAnnotations:
    reloader.stakater.com/auto: null
  podAnnotations: {}
  image:
    repository: ghcr.io/rocapellino/pokedex-web
    digest: "sha256:9cc9468cb10ed865e8182e4a2cf4fc0d0196d6fa6f88ac4cf921a70ca92b1b1c" # SHA256 digest pinning inmutable (SSOT)
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "250m"
      memory: "128Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"
  autoscaling:
    enabled: false

ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
  hosts:
    - host: pokedex.preprod.proxmox.internal.lan
      paths:
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /pokemons
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /
          pathType: Prefix
          backend:
            service:
              name: pokemon-web-svc
              port:
                number: 8080
    - host: ""
      paths:
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /pokemons
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /
          pathType: Prefix
          backend:
            service:
              name: pokemon-web-svc
              port:
                number: 8080
  tls: []

secrets:
  existingSecret: "pokemon-secrets"

pgbouncer:
  enabled: false

reloader:
  enabled: false

externalSecrets:
  enabled: true
  refreshInterval: "1h"
  targetSecretName: "pokemon-secrets"
  secretStoreRef:
    name: "vault-backend-preprod"
    kind: "ClusterSecretStore"
  remoteRef:
    key: "pokedex/preprod"

# Aislamiento de Red Zero-Trust en LXC 800 (Cilium eBPF L7 Egress)
networkPolicies:
  enabled: true
  egress:
    antiSsrf: true
    externalHttps: false
    allowedExternalCidrs: []

ciliumNetworkPolicy:
  enabled: true
  fqdnAllowlist:
    - matchName: "generativelanguage.googleapis.com"
    - matchPattern: "*.githubusercontent.com"
    - matchPattern: "*.pokeapi.co"

backup:
  enabled: false # Pre-prod no ejecuta backups persistentes en schedule nocturno para ahorrar I/O en LXC
