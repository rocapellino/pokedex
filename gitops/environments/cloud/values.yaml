# ==============================================================================
# Override del Entorno Prod Cloud (Blueprint Agnóstico e Inactivo, ADR-030)
# ==============================================================================
# Cadena de values de `pokedex-cloud` (gitops/apps/app-cloud.yaml):
#   values.yaml -> values.prod.yaml (perfil HA endurecido) -> este archivo
#
# Este archivo solo declara lo que depende del clúster y del proveedor de nube.
# No contiene recursos ni anotaciones de un proveedor concreto: al activar el
# entorno se completan los PUNTOS DE VARIACIÓN marcados abajo.
#
#   1. ingress.className y el emisor TLS (cert-manager ClusterIssuer).
#   2. externalSecrets.secretStoreRef.name: ClusterSecretStore del backend elegido
#      (Vault externo o el gestor de secretos del proveedor). La ruta lógica
#      `pokedex/prod` queda reservada para este entorno.
#   3. StorageClass de PostgreSQL, Redis y backups (vacío = la default del clúster).
#   4. Hosts públicos, TLS y orígenes CORS.
# ==============================================================================

global:
  environment: cloud
  namespace: pokemon-app

api:
  replicaCount: 3
  image:
    repository: ghcr.io/rocapellino/pokedex-api
    digest: "sha256:1d3b8f5ff8659229217a835d32517920194896d39c56649a19eacba9186f0afa" # SHA256 digest pinning inmutable (SSOT)
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "1500m"
      memory: "2Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    # PUNTO DE VARIACIÓN 4: un origen por host del ingress, con esquema https.
    corsOrigins: "https://pokedex.cloud.rodrigo.dev"

web:
  replicaCount: 3
  image:
    repository: ghcr.io/rocapellino/pokedex-web
    digest: "sha256:c510bc550b61a368fc0de7471edf171e4ff92eca921ccf13377119d4720a3c7b" # SHA256 digest pinning inmutable (SSOT)
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6

# PUNTO DE VARIACIÓN 3: "" usa la StorageClass por defecto del clúster.
postgresql:
  persistence:
    storageClass: ""

redis:
  persistence:
    storageClass: ""

backup:
  persistence:
    storageClass: ""

ingress:
  enabled: true
  # PUNTO DE VARIACIÓN 1: controlador de ingress instalado en el clúster. Con
  # className "nginx" aplican las cabeceras de seguridad de values.prod.yaml; con
  # otro controlador la plantilla las omite y deben declararse en ese controlador.
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: pokedex.cloud.rodrigo.dev
      paths:
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /pokemons
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /
          pathType: Prefix
          backend:
            service:
              name: pokemon-web-svc
              port:
                number: 8080
  tls:
    - secretName: pokedex-cloud-cert
      hosts:
        - pokedex.cloud.rodrigo.dev

secrets:
  existingSecret: "pokemon-secrets"

externalSecrets:
  enabled: true
  refreshInterval: "1h"
  targetSecretName: "pokemon-secrets"
  # PUNTO DE VARIACIÓN 2: nombre del ClusterSecretStore declarado al activar el entorno.
  secretStoreRef:
    name: "cloud-secret-store"
    kind: "ClusterSecretStore"
  remoteRef:
    key: "pokedex/prod"

# Stakater Reloader: ESO actualiza el Secret de forma asíncrona tras una rotación
# en el backend de secretos, y checksum/config no detecta ese cambio (ADR-005).
reloader:
  enabled: true
  auto: true

# Aislamiento Zero-Trust L7 Egress con Cilium eBPF FQDN
networkPolicies:
  enabled: true
  egress:
    antiSsrf: true
    externalHttps: false
    allowedExternalCidrs: []

ciliumNetworkPolicy:
  enabled: true
  fqdnAllowlist:
    - matchName: "generativelanguage.googleapis.com"
    - matchPattern: "*.githubusercontent.com"
    - matchPattern: "*.pokeapi.co"
