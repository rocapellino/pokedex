# ==============================================================================
# Sobrescritura de Values para Entorno de Nube Pública (AWS / GCP / Azure)
# ==============================================================================

global:
  environment: public-cloud
  namespace: pokemon-app

api:
  replicaCount: 3
  deploymentAnnotations:
    reloader.stakater.com/auto: "true"
  image:
    repository: ghcr.io/rocapellino/pokedex-api
    digest: "sha256:ada21b853cb6b6804954f45160aa9dd7b01fe81f307164c27187234a91e6d2b9" # SHA256 digest pinning inmutable (SSOT)
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "1500m"
      memory: "2Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

web:
  replicaCount: 3
  image:
    repository: ghcr.io/rocapellino/pokedex-web
    digest: "sha256:b2a97ef1c65c58bbce9f3ed408778a4929f28be5e6a7911166dd3db5440f5820" # SHA256 digest pinning inmutable (SSOT)
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6

ingress:
  enabled: true
  className: "alb" # o gce / traefik según el proveedor de nube
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
  hosts:
    - host: pokedex.cloud.rodrigo.dev
      paths:
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /pokemons
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /
          pathType: Prefix
          backend:
            service:
              name: pokemon-web-svc
              port:
                number: 8080
  tls:
    - secretName: pokedex-cloud-cert
      hosts:
        - pokedex.cloud.rodrigo.dev

secrets:
  existingSecret: "pokemon-secrets"

externalSecrets:
  enabled: true
  refreshInterval: "1h"
  targetSecretName: "pokemon-secrets"
  secretStoreRef:
    name: "aws-secrets-manager"
    kind: "ClusterSecretStore"
  remoteRef:
    key: "pokedex/prod"

# Stakater Reloader habilitado en Cloud para detectar mutaciones asíncronas de v1/Secret
# generadas por ESO tras rotaciones en AWS Secrets Manager (checksum/config no cubre este caso):
reloader:
  enabled: true
  auto: true

# Aislamiento Zero-Trust L7 Egress con Cilium eBPF FQDN
networkPolicies:
  enabled: true
  egress:
    antiSsrf: true
    externalHttps: false
    allowedExternalCidrs: []

ciliumNetworkPolicy:
  enabled: true
  fqdnAllowlist:
    - matchName: "generativelanguage.googleapis.com"
    - matchPattern: "*.githubusercontent.com"
    - matchPattern: "*.pokeapi.co"


