# ==============================================================================
# Sobrescritura de Values para Entorno On-Premise (Proxmox VE / K8s Interno)
# Perfil: Minimal Viable Platform (MVP) / Lean On-Premise
# Racional de Consolidación Arquitectónica:
# - Secrets: External Secrets Operator (ESO) canónico -> HashiCorp Vault (vault-backend)
# - Reloader: Desactivado. Sustituido por anotación nativa Helm checksum/config en Pod template.
# - PgBouncer: Desactivado. Sustituido por pool nativo pg.Pool en Node.js (20 conns/pod = 40 total).
# - Beyla (eBPF): Desactivado. Sustituido por instrumentación W3C nativa + Prometheus /metrics.
# - Node Exporter: Desactivado. Sustituido por telemetría RRD nativa del hipervisor Proxmox VE.
# - Observabilidad: Grafana Alloy con OTLP (:4317/:4318) + recolección de logs en /var/log/pods.
# ==============================================================================

global:
  environment: onprem-proxmox
  namespace: pokemon-app
  imagePullSecrets: []

api:
  replicaCount: 2
  deploymentAnnotations:
    reloader.stakater.com/auto: null
  podAnnotations: {}
  image:
    repository: ghcr.io/rocapellino/pokedex-api
    digest: "sha256:4113ac3d61577bd4eef013e80ec8f05ffcfa4c079b51a1dcec9d884dacc4ddbd" # SHA256 digest pinning inmutable (SSOT)
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "200m"
      memory: "256Mi"
  autoscaling:
    enabled: false  # En Proxmox mantenemos capacidad fija garantizada

web:
  replicaCount: 2
  deploymentAnnotations:
    reloader.stakater.com/auto: null
  podAnnotations: {}
  image:
    repository: ghcr.io/rocapellino/pokedex-web
    digest: "sha256:9cc9468cb10ed865e8182e4a2cf4fc0d0196d6fa6f88ac4cf921a70ca92b1b1c" # SHA256 digest pinning inmutable (SSOT)
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "500m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "64Mi"
  autoscaling:
    enabled: false

ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web"

  hosts:
    - host: pokedex.proxmox.internal.lan
      paths:
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /pokemons
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /
          pathType: Prefix
          backend:
            service:
              name: pokemon-web-svc
              port:
                number: 8080
    - host: ""
      paths:
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /pokemons
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /
          pathType: Prefix
          backend:
            service:
              name: pokemon-web-svc
              port:
                number: 8080
  tls: []

secrets:
  existingSecret: "pokemon-secrets"

pgbouncer:
  enabled: false

reloader:
  enabled: false

externalSecrets:
  enabled: true
  refreshInterval: "1h"
  targetSecretName: "pokemon-secrets"
  secretStoreRef:
    name: "vault-backend"
    kind: "ClusterSecretStore"
  remoteRef:
    key: "pokedex/prod"

# ------------------------------------------------------------------------------
# Aislamiento de Red Zero-Trust en Proxmox VE (Cilium eBPF L7 Egress)
# ------------------------------------------------------------------------------
# Para garantizar la política Anti-SSRF y Anti-Exfiltración donde dominios no
# autorizados (ej. https://example.com) y redes privadas (RFC1918 / IMDS) sean
# bloqueados, se activa CiliumNetworkPolicy L7 FQDN y se desactiva externalHttps L4.
networkPolicies:
  enabled: true
  egress:
    antiSsrf: true
    externalHttps: false
    allowedExternalCidrs: []

ciliumNetworkPolicy:
  enabled: true
  fqdnAllowlist:
    - matchName: "generativelanguage.googleapis.com"
    - matchPattern: "*.githubusercontent.com"
    - matchPattern: "*.pokeapi.co"

# ------------------------------------------------------------------------------
# Disaster Recovery & Off-Site Backup (Estado Operativo Proxmox)
# ------------------------------------------------------------------------------
# - Backup local: activo (cifrado AES-256 + SHA256 + restore drill semanal en PVC)
# - Google Drive off-site: activo cuando credentials (GDRIVE_TOKEN) están provisionadas
# - S3-compatible offsite: inactivo (esqueleto blueprint agnóstico)
backup:
  enabled: true
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  offsite:
    enabled: false
    provider: "s3-compatible"
    bucket: "pokedex-backups-offsite"
    region: "us-east-1"
    prefix: "proxmox/postgres"
    secretName: "backup-offsite-creds"
  # Sincronización Off-Site Nativa a Google Drive (Puente K8s-Native Rclone)
  # Sincroniza directamente desde pokedex-backup-pvc hacia Google Drive sin tocar el host
  gdrive:
    enabled: true
    folder: "PokedexBackups/proxmox"

