# ==============================================================================
# ArgoCD Application - Pre-producción (LXC 800 Proxmox VE, único target activo, ADR-030)
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pokedex-preprod
  namespace: argocd
  labels:
    app.kubernetes.io/name: pokedex
    environment: onprem-proxmox-preprod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rocapellino/pokedex.git
    targetRevision: v1.110.2
    path: infra/helm/pokedex
    helm:
      releaseName: pokedex-preprod
      valueFiles:
        - values.yaml
        - ../../../gitops/environments/proxmox-preprod/values.yaml
  destination:
    # ArgoCD corre dentro del mismo clúster K3s del LXC 800 (10.10.13.100), por eso
    # el destino es el API server in-cluster y no un clúster externo registrado.
    server: https://kubernetes.default.svc
    namespace: pokemon-app
  # Kubernetes completa apiVersion, kind, status y volumeMode en los
  # volumeClaimTemplates del StatefulSet; sin esto ArgoCD lo marca OutOfSync
  # para siempre aunque el spec coincida (observado en pre-prod, 2026-10-04).
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.volumeClaimTemplates[]?.kind
        - .spec.volumeClaimTemplates[]?.status
        - .spec.volumeClaimTemplates[]?.spec.volumeMode
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  # syncWindows: Omitido intencionalmente en pre-producción para permitir Continuous Delivery
  # y validación automatizada de pruebas 24/7 sin ventanas de bloqueo.
