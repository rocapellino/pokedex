# ==============================================================================
# ArgoCD Application - Plantilla de Referencia para Nube Pública (AWS EKS)
# ==============================================================================
# NOTA DE ARQUITECTURA:
# Este manifiesto es una plantilla de referencia para despliegue en nube pública.
# Proxmox VE es el único target productivo GA del proyecto. Activar y sincronizar
# esta aplicación únicamente si la organización decide adoptar AWS/EKS como target.
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pokedex-cloud
  namespace: argocd
  labels:
    app.kubernetes.io/name: pokedex
    environment: reference-cloud
  annotations:
    argocd.argoproj.io/manifest-generate-paths: "infra/helm/pokedex;gitops/environments/aws"
    architecture.pokedex.io/tier: "reference-template"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rocapellino/pokedex.git
    targetRevision: v1.75.10
    path: infra/helm/pokedex
    helm:
      releaseName: pokedex-cloud
      valueFiles:
        - values.yaml
        - ../../../gitops/environments/aws/values.yaml
  destination:
    # Endpoint o nombre del clúster de Kubernetes en Nube registrado en ArgoCD
    server: https://k8s-cloud-cluster.privatelink.us-east-1.eks.amazonaws.com
    namespace: pokemon-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  syncWindows:
    - kind: allow
      schedule: "* * * * *"
      duration: 1h
      applications:
        - pokedex-cloud

