# ==============================================================================
# ArgoCD Application - Prod Cloud (BLUEPRINT AGNÓSTICO E INACTIVO, ADR-030)
# ==============================================================================
# ESTADO DECLARADO: INACTIVA / BLUEPRINT (GITOPS-001)
#
# Prod se declara en la nube, sin proveedor fijado, y todavía no se despliega.
# Pre-prod (Proxmox, pokedex-preprod) es el target activo de la plataforma.
#
# Este manifiesto NO forma parte del App-of-Apps: `root-application.yaml` lo
# excluye de su descubrimiento de forma explicita (ver `directory.exclude`) y no
# declara `syncPolicy.automated`. La promocion de releases mantiene su
# `targetRevision` y sus digests alineados con pre-prod.
#
# Cadena de values: values.yaml -> values.prod.yaml (perfil HA endurecido) ->
# gitops/environments/cloud/values.yaml (puntos de variacion del proveedor).
#
# Para ACTIVAR prod cloud (requiere un ADR que fije el proveedor):
#   1. Completar los puntos de variacion de gitops/environments/cloud/values.yaml.
#   2. Aprovisionar el cluster (infra/opentofu/environments/cloud-template) y
#      registrarlo en ArgoCD; reemplazar `destination.server`.
#   3. Declarar el ClusterSecretStore del backend de secretos elegido.
#   4. Quitar `app-cloud.yaml` del `exclude` de `root-application.yaml` y
#      habilitar `automated: { prune: true, selfHeal: true }`.
#   5. Actualizar CLOUD_INFRASTRUCTURE_DESIGN.md y APPLICATION_LIFECYCLE.md.
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pokedex-cloud
  namespace: argocd
  labels:
    app.kubernetes.io/name: pokedex
    environment: prod-cloud-blueprint
  annotations:
    argocd.argoproj.io/manifest-generate-paths: "infra/helm/pokedex;gitops/environments/cloud"
    architecture.pokedex.io/tier: "reference-template"
    architecture.pokedex.io/status: "inactive"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rocapellino/pokedex.git
    targetRevision: v1.94.2
    path: infra/helm/pokedex
    helm:
      releaseName: pokedex-cloud
      valueFiles:
        - values.yaml
        - values.prod.yaml
        - ../../../gitops/environments/cloud/values.yaml
  destination:
    # Marcador: el TLD reservado `.invalid` (RFC 2606) garantiza que no resuelve
    # hasta que se registre el cluster real en ArgoCD (paso 2 de la activacion).
    server: https://kubernetes.prod-cloud.invalid
    namespace: pokemon-app
  # GITOPS-001: syncPolicy configurada sin bloque `automated` activo para
  # evitar sincronización ni podas accidentales durante pruebas de blueprint.
  # Al activar prod cloud, habilitar `automated: { prune: true, selfHeal: true }`.
  # Kubernetes completa apiVersion, kind, status y volumeMode en los
  # volumeClaimTemplates del StatefulSet; sin esto ArgoCD lo marca OutOfSync
  # para siempre aunque el spec coincida (observado en pre-prod, 2026-10-04).
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.volumeClaimTemplates[]?.kind
        - .spec.volumeClaimTemplates[]?.status
        - .spec.volumeClaimTemplates[]?.spec.volumeMode
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  # GITOPS-001: sin `syncWindows` de produccion. Declarar una ventana de freeze
  # de 62h en un manifiesto que no se despliega es contradictorio: si el freeze
  # se aplicara, el estado de la Application quedaria bloqueado sin despliegue
  # que proteger. Las Applications ACTIVAS (app-proxmox) si declaran syncWindows.
