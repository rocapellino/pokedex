# ==============================================================================
# ArgoCD Application - REFERENCIA INACTIVA para Nube Pública (AWS EKS)
# ==============================================================================
# ESTADO DECLARADO: INACTIVA / BLUEPRINT (GITOPS-001)
#
# AWS/EKS NO es un target desplegado. Proxmox (produccion) y Proxmox-preprod son
# los unicos targets activos de la plataforma.
#
# Este manifiesto NO forma parte del App-of-Apps: `root-application.yaml` lo
# excluye de su descubrimiento de forma explicita (ver `directory.exclude`).
# Por tanto, aunque conserve `syncPolicy.automated`, ArgoCD NUNCA lo sincroniza
# mientras siga excluido: esas directivas solo tomarian efecto si alguien lo
# aplicara manualmente con `task gitops:bootstrap:cloud`.
#
# Para ACTIVAR AWS como target real (fuera de alcance actual):
#   1. Registrar el endpoint EKS en ArgoCD como cluster secret.
#   2. Eliminar `app-cloud.yaml` del `exclude` de `root-application.yaml`.
#   3. Actualizar el estado declarado en CLOUD_INFRASTRUCTURE_DESIGN.md y
#      APPLICATION_LIFECYCLE.md, que hoy lo describen como referencia.
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pokedex-cloud
  namespace: argocd
  labels:
    app.kubernetes.io/name: pokedex
    environment: reference-cloud
  annotations:
    argocd.argoproj.io/manifest-generate-paths: "infra/helm/pokedex;gitops/environments/aws"
    architecture.pokedex.io/tier: "reference-template"
    architecture.pokedex.io/status: "inactive"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rocapellino/pokedex.git
    targetRevision: v1.89.5
    path: infra/helm/pokedex
    helm:
      releaseName: pokedex-cloud
      valueFiles:
        - values.yaml
        - ../../../gitops/environments/aws/values.yaml
  destination:
    # Endpoint o nombre del clúster de Kubernetes en Nube registrado en ArgoCD
    server: https://k8s-cloud-cluster.privatelink.us-east-1.eks.amazonaws.com
    namespace: pokemon-app
  # GITOPS-001: syncPolicy configurada sin bloque `automated` activo para
  # evitar sincronización ni podas accidentales durante pruebas de blueprint.
  # Si el clúster AWS se activa formalmente, habilitar `automated: { prune: true, selfHeal: true }`.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  # GITOPS-001: sin `syncWindows` de produccion. Declarar una ventana de freeze
  # de 62h en un manifiesto que no se despliega es contradictorio: si el freeze
  # se aplicara, el estado de la Application quedaria bloqueado sin despliegue
  # que proteger. Las Applications ACTIVAS (app-proxmox) si declaran syncWindows.


