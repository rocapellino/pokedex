# ==============================================================================
# ArgoCD Application - Despliegue en Nube Pública (EKS / GKE / AKS)
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pokedex-cloud
  namespace: argocd
  labels:
    app.kubernetes.io/name: pokedex
    environment: public-cloud
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rocapellino/pokedex.git
    targetRevision: main
    path: infra/helm/pokedex
    helm:
      releaseName: pokedex-cloud
      valueFiles:
        - values.yaml
        - ../../../gitops/environments/aws/values.yaml
  destination:
    # Endpoint o nombre del clúster de Kubernetes en Nube registrado en ArgoCD
    server: https://k8s-cloud-cluster.privatelink.us-east-1.eks.amazonaws.com
    namespace: pokemon-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
