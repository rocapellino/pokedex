# ==============================================================================
# ArgoCD Application - Despliegue On-Premise (Clúster Proxmox VE)
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pokedex-proxmox
  namespace: argocd
  labels:
    app.kubernetes.io/name: pokedex
    environment: onprem-proxmox
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rocapellino/pokedex.git
    targetRevision: v1.79.1
    path: infra/helm/pokedex
    helm:
      releaseName: pokedex-proxmox
      valueFiles:
        - values.yaml
        - ../../../gitops/environments/proxmox/values.yaml
  destination:
    # URL o nombre del clúster de Kubernetes en Proxmox registrado en ArgoCD
    server: https://k8s-proxmox.internal.lan:6443
    namespace: pokemon-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  syncWindows:
    # Ventana de protección (freeze) en fines de semana para producción:
    # Bloquea sincronizaciones automáticas desde el viernes 18:00 UTC hasta el lunes 08:00 UTC (62h).
    # manualSync: true permite sincronización manual de emergencia en caso de hotfix.
    - kind: deny
      schedule: "0 18 * * 5"
      duration: 62h
      manualSync: true
      applications:
        - pokedex-proxmox


