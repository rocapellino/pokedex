# ==============================================================================
# ArgoCD Root Application - Patrón App-of-Apps Canónico
# ==============================================================================
# Este manifiesto gobierna la totalidad de las aplicaciones del monorepo Pokédex
# en Kubernetes, coordinando los entornos on-premise (Proxmox) y cloud (AWS EKS).
# Formalizado bajo ADR-021 (Advanced GitOps Orchestration & Sync Waves).
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pokedex-root
  namespace: argocd
  labels:
    app.kubernetes.io/name: pokedex-root
    app.kubernetes.io/part-of: pokedex-platform
    architecture.pokedex.io/tier: "root-orchestrator"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rocapellino/pokedex.git
    targetRevision: v1.79.1
    path: gitops/apps
    directory:
      recurse: false
      exclude: "root-application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
