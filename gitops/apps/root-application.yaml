# ==============================================================================
# ArgoCD Root Application - Patrón App-of-Apps Canónico
# ==============================================================================
# Este manifiesto gobierna la totalidad de las aplicaciones del monorepo Pokédex
# en Kubernetes: pre-prod on-premise (Proxmox) y el blueprint prod cloud (ADR-030).
# Formalizado bajo ADR-003 (Advanced GitOps Orchestration & Sync Waves).
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pokedex-root
  namespace: argocd
  labels:
    app.kubernetes.io/name: pokedex-root
    app.kubernetes.io/part-of: pokedex-platform
    architecture.pokedex.io/tier: "root-orchestrator"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rocapellino/pokedex.git
    targetRevision: v1.91.1
    path: gitops/apps
    directory:
      recurse: false
      # GITOPS-001: la Application raiz gobierna UNICAMENTE entornos activos.
      #
      # - `root-application.yaml` se excluye para que el root no se gestione a si mismo.
      # - `app-cloud.yaml` se excluye porque prod cloud es un BLUEPRINT INACTIVO
      #   (ADR-030). Sin esta exclusion, ArgoCD descubriria el manifiesto y lo
      #   sincronizaria contra un cluster que todavia no existe.
      #
      # Prod cloud se activa de forma explicita (fuera del App-of-Apps) con
      # `task gitops:bootstrap:cloud`. Para declararlo activo, eliminar la entrada
      # de este exclude y actualizar el estado en CLOUD_INFRASTRUCTURE_DESIGN.md.
      exclude: |
        root-application.yaml
        app-cloud.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
