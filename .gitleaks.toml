# ==============================================================================
# Configuración de Gitleaks para Detección de Fuga de Secretos
# ==============================================================================

title = "Gitleaks Config - Pokémon DevOps Platform"

[extend]
useDefault = true

[allowlist]
description = "Permitir archivos de ejemplo, documentación, plantillas y mocks de pruebas"
paths = [
  '''^\.env\.example$''',
  '''^docs/.*''',
  '''^apps/api/tests/.*''',
  '''^infra/proxmox/.*''',
  '''^infra/terraform/.*''',
  '''^infra/ansible/.*''',
  '''^infra/k8s/.*''',
  '''^scripts/.*''',
  '''^docker-compose.*''',
]
