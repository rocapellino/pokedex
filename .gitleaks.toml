# ==============================================================================
# Configuración de Gitleaks para Detección de Fuga de Secretos
# ==============================================================================

title = "Gitleaks Config - Pokémon DevOps Platform"

[extend]
useDefault = true

[allowlist]
description = "Permitir archivos de plantilla y placeholders de prueba conocidos"
paths = [
  # Variables de entorno de ejemplo documentadas
  '''(?i)(^|/)\.env\.example$''',
  # Terraform y OpenTofu — declaración de variables e infraestructura de ejemplo
  '''(?i)^infra/terraform/.*/(variables|outputs)\.tf$''',
  '''(?i)^infra/opentofu/.*/(variables|outputs)\.tf$''',
  # K8s / Helm — SealedSecrets cifrados con clave pública del controlador (actual e histórico)
  '''(?i)^infra/helm/pokedex/templates/sealed-secrets\.ya?ml$''',
  '''(?i)^infra/k8s/01-sealed-secrets\.ya?ml$''',
  # Ansible — inventario de ejemplo
  '''(?i)^infra/ansible/inventory/hosts\.ini$''',
]
commits = [
  # Commit histórico de SealedSecret cifrado en clúster
  "5d8c13701df243f209de41388cdc1a5d77f536d2",
  "5b1d60f7eae4d0c6ef57ef69e5a8a4ed6862a8fb",
]
regexes = [
  # Placeholders de CI/CD, desarrollo local y pruebas documentadas
  '''(?i)a-very-long-secret-key-that-is-at-least-32-chars-long''',
  '''(?i)pokedex-super-admin-entropy-key-change-me''',
  '''(?i)pokedex-ai-service-entropy-key-change-me''',
  '''(?i)pokedex-internal-hmac-session-secret-entropy''',
  '''(?i)redis_secure_password_k8s''',
  '''(?i)redis_dev_secret_password''',
  '''(?i)minioadmin_secure_password''',
  '''(?i)ci-validation-dummy-pass''',
  '''(?i)ci-key''',
  '''(?i)ci-pass''',
  '''(?i)dummy-pass''',
  '''(?i)mock-key''',
]
fingerprints = [
  # Commit histórico de SealedSecret cifrado en el clúster
  "5d8c13701df243f209de41388cdc1a5d77f536d2:infra/k8s/01-sealed-secrets.yaml:generic-api-key:10",
]

