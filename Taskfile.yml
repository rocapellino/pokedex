# https://taskfile.dev
version: '3'

tasks:
  default:
    desc: "Muestra la lista de tareas disponibles"
    cmds:
      - task --list

  install:
    desc: "Instala dependencias del monorepo de forma limpia y reproducible con npm ci"
    cmds:
      - npm ci

  dev:
    desc: "Inicia el servidor Pokédex Full-Stack en modo desarrollo con recarga automática"
    cmds:
      - npm run dev

  build:
    desc: "Compila y empaqueta el servidor TypeScript con esbuild y el frontend con Vite"
    cmds:
      - npm run build

  turbo:build:
    desc: "Compila el monorepo con aceleración y caché declarativo de Turborepo"
    cmds:
      - npx turbo run build

  turbo:lint:
    desc: "Ejecuta linting en todos los paquetes del monorepo mediante Turborepo"
    cmds:
      - npx turbo run lint

  turbo:typecheck:
    desc: "Ejecuta verificación de tipos en todos los paquetes del monorepo mediante Turborepo"
    cmds:
      - npx turbo run typecheck

  turbo:clean:
    desc: "Limpia la caché local de Turborepo y artefactos de compilación"
    cmds:
      - node -e "fs.rmSync('.turbo', { recursive: true, force: true }); fs.rmSync('apps/backend/dist', { recursive: true, force: true }); fs.rmSync('apps/frontend/dist', { recursive: true, force: true });"

  typecheck:
    desc: "Ejecuta únicamente la verificación estricta de tipos de TypeScript (tsc --noEmit)"
    cmds:
      - npm run typecheck

  lint:
    desc: "Ejecuta linting y validación de tipos en backend, frontend y raíz"
    cmds:
      - npm run lint

  validate:
    desc: "Ejecuta todas las validaciones obligatorias del proyecto (lint, typecheck, build, test, fuzzing)"
    cmds:
      - npm run validate

  test:
    desc: "Ejecuta las pruebas unitarias y validaciones de tipos"
    cmds:
      - npm run lint
      - npm test

  test:e2e:
    desc: "Ejecuta las pruebas E2E multi-dispositivo con Playwright"
    cmds:
      - npm run test:e2e

  test:a11y:
    desc: "Ejecuta la auditoría automatizada de accesibilidad WCAG con Axe-core"
    cmds:
      - npm run test:a11y

  test:coverage:
    desc: "Ejecuta la suite de pruebas unitarias y genera reporte de cobertura LCOV"
    cmds:
      - npm run test:coverage

  perf:lighthouse:
    desc: "Ejecuta la auditoría de rendimiento y Web Vitals con Lighthouse CI"
    cmds:
      - npx @lhci/cli autorun

  lint:mega:
    desc: "Ejecuta MegaLinter localmente mediante Docker"
    cmds:
      - docker run --rm -v "${PWD}:/tmp/lint:ro" -e MEGALINTER_CONFIG=.mega-linter.yml oxsecurity/megalinter-cupcake:v8.4.2

  sonar:
    desc: "Ejecuta SonarScanner localmente mediante contenedor Docker"
    cmds:
      - docker run --rm -v "${PWD}:/usr/src" -e SONAR_TOKEN="${SONAR_TOKEN}" sonarsource/sonar-scanner-cli:11.2.0


  audit:
    desc: "Auditoría de calidad, duplicación de código y deuda técnica con SonarQube"
    cmds:
      - task: sonar

  governance:audit-scripts:
    desc: "Audita la gobernanza de scripts de despliegue y valida la lista blanca de scripts autorizados (ADR-020)"
    cmds:
      - node -e "const fs=require('fs'), path=require('path'); const allowed=['scripts/dr_verify_restore.sh']; const findSh=(dir)=>{ let r=[]; for(const f of fs.readdirSync(dir)){ const p=path.join(dir,f); if(['node_modules','.git','dist','coverage','.turbo'].includes(f)) continue; if(fs.statSync(p).isDirectory()) r=r.concat(findSh(p)); else if(f.endsWith('.sh')) r.push(p.replace(/\\\\/g,'/')); } return r; }; const found=findSh('.'); const unauth=found.filter(s=>!allowed.some(a=>s.endsWith(a))); if(unauth.length>0){ console.error('❌ Scripts no autorizados detectados:', unauth); process.exit(1); } console.log('✔ Gobernanza de scripts validada: solo scripts autorizados presentes:', allowed);"


  security:
    desc: "Ejecuta análisis de vulnerabilidades en dependencias (npm audit)"
    cmds:
      - npm audit --audit-level=high

  perf:
    desc: "Ejecuta pruebas de rendimiento y estrés con k6"
    cmds:
      - k6 run tests/performance/k6_stress_test.js

  network:
    desc: "Asegura la existencia de la red compartida monitoring-net"
    cmds:
      - docker network create monitoring-net 2>nul || docker network create monitoring-net 2>/dev/null || true

  # ----------------------------------------------------------------------------
  # Perfiles de Desarrollo Local (Dual-Profile DX)
  # ----------------------------------------------------------------------------
  dev:compose:
    desc: "Perfil Rápido: Levanta stack de desarrollo interactivo con Docker Compose"
    deps: [network]
    cmds:
      - docker compose up -d --build

  dev:compose:down:
    desc: "Perfil Rápido: Detiene stack interactivo de Docker Compose"
    cmds:
      - docker compose down

  dev:verify:
    desc: "Valida la disponibilidad de los servicios locales (healthz, readyz y frontend Web)"
    cmds:
      - curl --fail -s http://localhost:3000/healthz || echo "Backend liveness no responde"
      - curl --fail -s http://localhost:3000/readyz || echo "Backend readiness no responde"
      - curl --fail -s http://localhost:8080 || echo "Frontend Web Nginx no responde"

  dev:k8s:up:
    desc: "Perfil Kubernetes: Crea clúster Kind local y despliega Helm chart idéntico a producción"
    cmds:
      - kind create cluster --config infra/k8s/kind-cluster.yaml || echo "El cluster kind ya existe."
      - docker build -t pokedex-api:local -f apps/backend/Dockerfile .
      - docker build -t pokedex-web:local -f apps/frontend/Dockerfile .
      - kind load docker-image pokedex-api:local --name pokedex-local
      - kind load docker-image pokedex-web:local --name pokedex-local
      - helm upgrade --install pokedex infra/helm/pokedex -n pokemon-app --create-namespace -f infra/helm/pokedex/values.yaml --set api.image.repository=pokedex-api --set api.image.tag=local --set web.image.repository=pokedex-web --set web.image.tag=local

  dev:k8s:down:
    desc: "Perfil Kubernetes: Destruye el clúster Kind local"
    cmds:
      - kind delete cluster --name pokedex-local

  dev:k8s:status:
    desc: "Perfil Kubernetes: Consulta estado de pods, servicios e ingress en pokemon-app"
    cmds:
      - kubectl get pods,svc,ingress -n pokemon-app -o wide

  dev:k8s:calico:
    desc: "Perfil Kubernetes: Instala Calico CNI en Kind para validación local de plano de datos de NetworkPolicies"
    cmds:
      - kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml
      - kubectl -n kube-system set env daemonset/calico-node FELIX_IGNORELOOSERPF=true

  docker:up:
    desc: "[Alias compatibilidad] Levanta stack de desarrollo interactivo (usa dev:compose)"
    deps: [network]
    cmds:
      - task: dev:compose

  docker:down:
    desc: "[Alias compatibilidad] Detiene stack interactivo de Docker Compose (usa dev:compose:down)"
    cmds:
      - task: dev:compose:down

  # ----------------------------------------------------------------------------
  # Observabilidad & Telemetría (Grafana Cloud & Local Dev)
  # ----------------------------------------------------------------------------
  monitoring:grafana-cloud:install:
    desc: "Despliega el stack de telemetría de Grafana Cloud (Alloy, Beyla eBPF, Node Exporter, KSM) en Kubernetes"
    cmds:
      - powershell -ExecutionPolicy Bypass -File infra/monitoring/deploy-grafana-cloud.ps1

  monitoring:grafana-cloud:status:
    desc: "Muestra el estado de los pods y DaemonSets de Grafana Cloud en el namespace monitoring"
    cmds:
      - kubectl get pods,daemonset,deployment -n monitoring -o wide

  monitoring:grafana-cloud:uninstall:
    desc: "Desinstala el release de Grafana Cloud k8s-monitoring"
    cmds:
      - helm uninstall grafana-cloud -n monitoring --ignore-not-found

  monitoring:dev:status:
    desc: "Muestra el estado de salud de los recolectores locales de observabilidad (Alloy, cAdvisor)"
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.dev.yml ps alloy cadvisor

  monitoring:dev:logs:
    desc: "Muestra los registros en tiempo real del agente Grafana Alloy"
    cmds:
      - docker logs pokemon-alloy --tail 50 -f

  # ----------------------------------------------------------------------------
  # Disaster Recovery & Resiliencia de Datos (DR)
  # ----------------------------------------------------------------------------
  dr:drill:
    desc: "Ejecuta un simulacro automatizado de Disaster Recovery y restauración en seco (Dry-Run)"
    cmds:
      - bash scripts/dr_verify_restore.sh --dry-run

  dr:verify:
    desc: "Verifica criptográficamente el último backup real (.sql.gz.enc) y su restauración"
    cmds:
      - bash scripts/dr_verify_restore.sh

  # ----------------------------------------------------------------------------
  # GitOps & CD (ArgoCD & Kubernetes)
  # ----------------------------------------------------------------------------
  gitops:apps:
    desc: "Aplica las aplicaciones declarativas de ArgoCD (Proxmox y Cloud)"
    cmds:
      - kubectl apply -f gitops/apps/app-proxmox.yaml
      - kubectl apply -f gitops/apps/app-cloud.yaml

  gitops:apps:root:
    desc: "Aplica la aplicación raíz de ArgoCD según el patrón canónico App-of-Apps (ADR-021)"
    cmds:
      - kubectl apply -f gitops/apps/root-application.yaml

  gitops:health-checks:
    desc: "Aplica los Custom Health Checks de ArgoCD para evaluación de CRDs (ADR-021)"
    cmds:
      - kubectl apply -f gitops/health-checks/argocd-cm-healthchecks.yaml

  gitops:sync:proxmox:
    desc: "Sincroniza la aplicación ArgoCD para el entorno on-premise Proxmox"
    cmds:
      - argocd app sync pokedex-proxmox

  gitops:bootstrap:proxmox:
    desc: "[Bootstrap/Emergencia] Aplica directamente el manifiesto de Application de ArgoCD en Proxmox"
    cmds:
      - kubectl apply -f gitops/apps/app-proxmox.yaml

  gitops:sync:cloud:
    desc: "Sincroniza la aplicación ArgoCD para el entorno público Cloud (AWS EKS)"
    cmds:
      - argocd app sync pokedex-cloud

  gitops:bootstrap:cloud:
    desc: "[Bootstrap/Emergencia] Aplica directamente el manifiesto de Application de ArgoCD en Cloud"
    cmds:
      - kubectl apply -f gitops/apps/app-cloud.yaml

  gitops:status:
    desc: "Consulta el estado de sincronización y salud de las aplicaciones ArgoCD"
    cmds:
      - kubectl get applications -n argocd




  k8s:up:
    desc: "Despliega o actualiza la plataforma en Kubernetes mediante Helm 3"
    cmds:
      - helm upgrade --install pokedex infra/helm/pokedex --namespace pokemon-app --create-namespace

  k8s:down:
    desc: "Desinstala el release de Helm pokedex del namespace pokemon-app"
    cmds:
      - helm uninstall pokedex -n pokemon-app --ignore-not-found

  k8s:status:
    desc: "Muestra el estado de Pods, Servicios, HPA e Ingress en Kubernetes"
    cmds:
      - kubectl get pods,svc,hpa,ingress -n pokemon-app

  k8s:seed:
    desc: "[Dev/Bootstrap] Ejecuta el Job idempotente de siembra masiva de Pokémon en Kubernetes"
    cmds:
      - kubectl delete job pokedex-db-seed -n pokemon-app --ignore-not-found
      - docker run --rm -v "${PWD}:/apps" alpine/helm:3.17.0 template pokedex /apps/infra/helm/pokedex -s templates/seed-job.yaml | kubectl apply -n pokemon-app -f -
      - kubectl wait --for=condition=complete --timeout=300s job/pokedex-db-seed -n pokemon-app

  k8s:test:
    desc: "Ejecuta pruebas de salud e integración sobre los pods y servicios de Kubernetes"
    cmds:
      - kubectl exec -n pokemon-app deploy/pokemon-api -- wget -qO- http://127.0.0.1:3000/readyz
      - kubectl exec -n pokemon-app deploy/pokedex-web -- wget -qO- http://127.0.0.1:8080/api/readyz

  k8s:port-forward:web:
    desc: "Inicia port-forwarding local hacia el frontend Web (http://localhost:8080)"
    cmds:
      - kubectl port-forward -n pokemon-app svc/pokemon-web-svc 8080:8080

  k8s:port-forward:api:
    desc: "Inicia port-forwarding local hacia la API backend (http://localhost:3000)"
    cmds:
      - kubectl port-forward -n pokemon-app svc/pokemon-api-svc 3000:3000

  k8s:logs:api:
    desc: "Muestra y sigue los logs en tiempo real del pod backend API"
    cmds:
      - kubectl logs -n pokemon-app deploy/pokemon-api -f

  k8s:logs:web:
    desc: "Muestra y sigue los logs en tiempo real del pod frontend Web (Nginx)"
    cmds:
      - kubectl logs -n pokemon-app deploy/pokedex-web -f

  k8s:logs:db:
    desc: "Muestra y sigue los logs en tiempo real del pod PostgreSQL"
    cmds:
      - kubectl logs -n pokemon-app postgres-0 -f

  secrets:scan:
    desc: "Escanea el repositorio en busca de secretos expuestos con Gitleaks"
    cmds:
      - gitleaks detect --verbose --no-git

  secrets:seal:
    desc: "[Legacy/Deprecado] Sella credenciales con Bitnami Sealed Secrets (preferir ESO con Secret Manager)"
    cmds:
      - npx tsx scripts/seal-secret.ts

  secrets:audit-rotation:
    desc: "Audita la configuración de rotación de credenciales, refreshInterval y Stakater Reloader (ADR-022)"
    cmds:
      - npx tsx scripts/verify-secret-rotation.ts

  gitops:verify-parity:
    desc: "Valida la paridad de digest criptográfico entre entornos GitOps (AWS, Proxmox, Prod)"
    cmds:
      - node --experimental-strip-types scripts/verify-image-digest-parity.ts

  gitops:verify-parity:strict:
    desc: "Valida la paridad mediante renderizado obligatorio con 'helm template' (modo estricto sin fallback para CI)"
    cmds:
      - node --experimental-strip-types scripts/verify-image-digest-parity.ts --strict

  # ----------------------------------------------------------------------------
  # Gestión y Configuración de Hosts con Ansible (Capa 2)
  # ----------------------------------------------------------------------------
  ansible:syntax:
    desc: "Valida la sintaxis de todos los playbooks y roles de Ansible"
    cmds:
      - ansible-playbook -i infra/ansible/inventory/hosts.ini infra/ansible/playbooks/host_baseline.yml --syntax-check
      - ansible-playbook -i infra/ansible/inventory/hosts.ini infra/ansible/playbooks/security_hardening.yml --syntax-check
      - ansible-playbook -i infra/ansible/inventory/hosts.ini infra/ansible/playbooks/prepare_hosts.yml --syntax-check
      - ansible-playbook -i infra/ansible/inventory/hosts.ini infra/ansible/playbooks/validate_hosts.yml --syntax-check

  ansible:prepare:
    desc: "Aprovisiona la configuración base, runtime de contenedores y tuning en hosts"
    cmds:
      - ansible-playbook -i infra/ansible/inventory/hosts.ini infra/ansible/playbooks/prepare_hosts.yml {{.CLI_ARGS}}

  ansible:harden:
    desc: "Aplica el hardening de seguridad y reglas de firewall UFW en hosts"
    cmds:
      - ansible-playbook -i infra/ansible/inventory/hosts.ini infra/ansible/playbooks/security_hardening.yml {{.CLI_ARGS}}

  ansible:validate:
    desc: "Ejecuta comprobaciones de auditoría y compliance de hosts sin alterar estado"
    cmds:
      - ansible-playbook -i infra/ansible/inventory/hosts.ini infra/ansible/playbooks/validate_hosts.yml {{.CLI_ARGS}}

  deploy:proxmox:
    desc: "[Alias compatibilidad] Aprovisiona el baseline y hardening en Proxmox (usa ansible:prepare)"
    cmds:
      - ansible-playbook -i infra/ansible/inventory/hosts.ini infra/ansible/playbooks/host_baseline.yml {{.CLI_ARGS}}


  # ----------------------------------------------------------------------------
  # Infraestructura como Código (IaC) Híbrida con OpenTofu (Capa 1)
  # ----------------------------------------------------------------------------
  infra:fmt:
    desc: "Verifica el formato canónico en todos los entornos y módulos de OpenTofu"
    cmds:
      - tofu fmt -check -recursive infra/opentofu

  infra:validate:
    desc: "Valida la sintaxis de todos los entornos de OpenTofu (Proxmox + AWS + Lab)"
    cmds:
      - tofu -chdir=infra/opentofu/environments/proxmox init -backend=false
      - tofu -chdir=infra/opentofu/environments/proxmox validate
      - tofu -chdir=infra/opentofu/environments/aws init -backend=false
      - tofu -chdir=infra/opentofu/environments/aws validate
      - tofu -chdir=infra/opentofu/environments/lab init -backend=false
      - tofu -chdir=infra/opentofu/environments/lab validate

  infra:plan:proxmox:
    desc: "Ejecuta tofu plan para el entorno on-premise Proxmox VE"
    dir: infra/opentofu/environments/proxmox
    cmds:
      - tofu plan

  infra:apply:proxmox:
    desc: "Aplica la infraestructura en Proxmox VE con OpenTofu"
    dir: infra/opentofu/environments/proxmox
    cmds:
      - tofu apply

  infra:plan:aws:
    desc: "Ejecuta tofu plan para el clúster AWS EKS en la nube"
    dir: infra/opentofu/environments/aws
    cmds:
      - tofu plan

  infra:apply:aws:
    desc: "Aplica la infraestructura AWS EKS con OpenTofu"
    dir: infra/opentofu/environments/aws
    cmds:
      - tofu apply

  infra:plan:lab:
    desc: "Ejecuta tofu plan para el entorno de pruebas y laboratorio (Lab)"
    dir: infra/opentofu/environments/lab
    cmds:
      - tofu plan

  infra:apply:lab:
    desc: "Aplica la infraestructura en el entorno de laboratorio (Lab)"
    dir: infra/opentofu/environments/lab
    cmds:
      - tofu apply

  tofu:init:proxmox:
    desc: "[Alias compatibilidad] Inicializa el entorno OpenTofu para Proxmox VE"
    dir: infra/opentofu/environments/proxmox
    cmds:
      - tofu init

  tofu:plan:proxmox:
    desc: "[Alias compatibilidad] Ejecuta tofu plan para Proxmox VE"
    cmds:
      - task: infra:plan:proxmox

  tofu:apply:proxmox:
    desc: "[Alias compatibilidad] Aplica la infraestructura en Proxmox VE"
    cmds:
      - task: infra:apply:proxmox

  tofu:init:aws:
    desc: "[Alias compatibilidad] Inicializa el entorno OpenTofu para AWS EKS"
    dir: infra/opentofu/environments/aws
    cmds:
      - tofu init

  tofu:plan:aws:
    desc: "[Alias compatibilidad] Ejecuta tofu plan para AWS EKS"
    cmds:
      - task: infra:plan:aws

  tofu:apply:aws:
    desc: "[Alias compatibilidad] Aplica la infraestructura en AWS EKS"
    cmds:
      - task: infra:apply:aws

  tofu:init:cloud:
    desc: "[Alias compatibilidad] Alias de tofu:init:aws"
    cmds:
      - task: tofu:init:aws

  tofu:plan:cloud:
    desc: "[Alias compatibilidad] Alias de tofu:plan:aws"
    cmds:
      - task: tofu:plan:aws

  tofu:apply:cloud:
    desc: "[Alias compatibilidad] Alias de tofu:apply:aws"
    cmds:
      - task: tofu:apply:aws

  tofu:validate:
    desc: "[Alias compatibilidad] Valida la sintaxis de los entornos de OpenTofu"
    cmds:
      - task: infra:validate

  # ----------------------------------------------------------------------------
  # Stack TypeScript & Node.js (Servidor Unificado + Gemini SDK - Aliases de Compatibilidad)
  # ----------------------------------------------------------------------------
  ts:install:
    desc: "[Alias compatibilidad] Instala dependencias con npm ci (usa install)"
    cmds:
      - npm ci

  ts:dev:
    desc: "[Alias compatibilidad] Inicia el servidor Express con recarga rápida (usa dev)"
    cmds:
      - npm run dev

  ts:build:
    desc: "[Alias compatibilidad] Compila el bundle de producción (usa build)"
    cmds:
      - npm run build

  ts:start:
    desc: "[Alias compatibilidad] Ejecuta el bundle de producción compilado"
    cmds:
      - npm start

  ts:lint:
    desc: "[Alias compatibilidad] Verifica tipos y linting (usa lint)"
    cmds:
      - npm run lint

  # ----------------------------------------------------------------------------
  # Gestión de Empaquetado y Despliegue con Helm
  # ----------------------------------------------------------------------------
  helm:lint:
    desc: "Valida la sintaxis y buenas prácticas del Chart de Helm con linter"
    cmds:
      - docker run --rm -v "${PWD}:/apps" alpine/helm:3.17.0 lint /apps/infra/helm/pokedex

  helm:template:
    desc: "Renderiza los manifiestos de Kubernetes generados por el Chart de Helm"
    cmds:
      - docker run --rm -v "${PWD}:/apps" alpine/helm:3.17.0 template pokedex /apps/infra/helm/pokedex {{.CLI_ARGS}}

  helm:template:prod:
    desc: "Renderiza los manifiestos de Kubernetes con el perfil de producción (values.prod.yaml)"
    cmds:
      - docker run --rm -v "${PWD}:/apps" alpine/helm:3.17.0 template pokedex /apps/infra/helm/pokedex -f /apps/infra/helm/pokedex/values.prod.yaml --set postgresql.auth.password=secret,secrets.adminApiKey=secret,secrets.adminSessionSecret=secret,secrets.backupEncryptionKey=secret,redis.auth.password=secret

  helm:template:dev:
    desc: "Renderiza los manifiestos de Kubernetes con el perfil de desarrollo local (values.dev.yaml)"
    cmds:
      - docker run --rm -v "${PWD}:/apps" alpine/helm:3.17.0 template pokedex /apps/infra/helm/pokedex -f /apps/infra/helm/pokedex/values.dev.yaml --set postgresql.auth.password=secret,secrets.adminApiKey=secret,secrets.adminSessionSecret=secret,secrets.backupEncryptionKey=secret,redis.auth.password=secret

  helm:template:proxmox:
    desc: "Renderiza los manifiestos de Kubernetes para el entorno GitOps On-Premise Proxmox"
    cmds:
      - docker run --rm -v "${PWD}:/apps" alpine/helm:3.17.0 template pokedex /apps/infra/helm/pokedex -f /apps/infra/helm/pokedex/values.yaml -f /apps/gitops/environments/proxmox/values.yaml --set postgresql.auth.password=secret,secrets.adminApiKey=secret,secrets.adminSessionSecret=secret,secrets.backupEncryptionKey=secret,redis.auth.password=secret

  helm:template:aws:
    desc: "Renderiza los manifiestos de Kubernetes para el entorno GitOps Cloud AWS"
    cmds:
      - docker run --rm -v "${PWD}:/apps" alpine/helm:3.17.0 template pokedex /apps/infra/helm/pokedex -f /apps/infra/helm/pokedex/values.yaml -f /apps/gitops/environments/aws/values.yaml --set postgresql.auth.password=secret,secrets.adminApiKey=secret,secrets.adminSessionSecret=secret,secrets.backupEncryptionKey=secret,redis.auth.password=secret

  helm:package:
    desc: "Empaqueta el Chart de Helm en un archivo .tgz listo para distribución"
    cmds:
      - docker run --rm -v "${PWD}:/apps" alpine/helm:3.17.0 package /apps/infra/helm/pokedex -d /apps/dist

  linear:sonar-sync:
    desc: "Sincroniza el estado de SonarCloud y genera tickets en Linear ante Quality Gate fallido o vulnerabilidades"
    cmds:
      - npx tsx scripts/sonar-linear-sync.ts

  k8s:rollout-restart:
    desc: "Aplica un reinicio progresivo (rollout restart) a los pods de la app para cargar secretos de Vault"
    cmds:
      - npm run k8s:rollout-restart -- {{.CLI_ARGS}}

  vault:setup:proxmox:
    desc: "Ejecuta el playbook de Ansible para provisionar e inicializar Vault CE en Proxmox"
    cmds:
      - ansible-playbook -i infra/ansible/inventory/hosts.ini infra/ansible/playbooks/setup_vault.yml



