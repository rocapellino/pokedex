# ==============================================================================
# Values por Defecto para el Helm Chart de Pokédex
# ==============================================================================

global:
  nameOverride: ""
  fullnameOverride: ""
  namespace: pokemon-app

# ------------------------------------------------------------------------------
# 1. Backend Microservice (FastAPI ASGI)
# ------------------------------------------------------------------------------
api:
  replicaCount: 1
  image:
    repository: pokedex-server
    tag: "latest"
    pullPolicy: IfNotPresent
  port: 3000
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  env:
    corsOrigins: "http://localhost:3000,http://localhost:8080,http://127.0.0.1:8080,http://localhost:5000"
    otelEndpoint: "http://tempo:4317"

# ------------------------------------------------------------------------------
# 2. Frontend Web (Nginx + Reverse Proxy)
# ------------------------------------------------------------------------------
web:
  replicaCount: 1
  image:
    repository: pokemon-web
    tag: "1.2.0"
    pullPolicy: IfNotPresent
  port: 80
  service:
    type: ClusterIP
    port: 8080
    targetPort: 80
  resources:
    limits:
      cpu: "250m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

# ------------------------------------------------------------------------------
# 3. Base de Datos Relacional (PostgreSQL 16 StatefulSet)
# ------------------------------------------------------------------------------
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  port: 5432
  auth:
    database: pokedex_db
    username: postgres
    password: postgres_secure_password_k8s
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"

# ------------------------------------------------------------------------------
# 4. Connection Pooler (PgBouncer)
# ------------------------------------------------------------------------------
pgbouncer:
  enabled: true
  replicaCount: 1
  image:
    repository: edoburu/pgbouncer
    tag: "1.22.0"
    pullPolicy: IfNotPresent
  port: 5432
  poolMode: transaction
  maxClientConn: 100
  defaultPoolSize: 20
  resources:
    limits:
      cpu: "250m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"

# ------------------------------------------------------------------------------
# 5. Caché en Memoria (Redis 7)
# ------------------------------------------------------------------------------
redis:
  enabled: true
  replicaCount: 1
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  port: 6379
  service:
    port: 6379
  resources:
    limits:
      cpu: "250m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"

# ------------------------------------------------------------------------------
# 6. Ingress Controller (Nginx Path Routing)
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Bloqueo explícito de métricas en Ingress público (solo scraping interno de Prometheus)
    nginx.ingress.kubernetes.io/server-snippet: |
      location /metrics {
        deny all;
        return 403;
      }
  hosts:
    - host: pokedex.local
      paths:
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /pokemons
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /
          pathType: Prefix
          backend:
            service:
              name: pokemon-web-svc
              port:
                number: 8080
  tls: []

# ------------------------------------------------------------------------------
# 7. Credenciales y Secretos de Aplicación
# ------------------------------------------------------------------------------
secrets:
  # Claves por defecto para entorno local (SOBRESESCRIBIR EN PRODUCCIÓN)
  adminApiKey: "pokedex-super-admin-entropy-key-change-me"
  aiApiKey: "pokedex-ai-service-entropy-key-change-me"
  geminiApiKey: ""
  minioRootUser: "minioadmin"
  minioRootPassword: "minioadmin_secure_password"

# ------------------------------------------------------------------------------
# 8. Políticas de Seguridad Zero-Trust y Resiliencia
# ------------------------------------------------------------------------------
networkPolicies:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ------------------------------------------------------------------------------
# 9. Job de Siembra Masiva de Datos
# ------------------------------------------------------------------------------
seedJob:
  enabled: false
  image:
    repository: pokemon-db-seed
    tag: "1.0.0"
    pullPolicy: IfNotPresent
