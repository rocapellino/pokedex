# ==============================================================================
# Values por Defecto para el Helm Chart de Pokédex
# ==============================================================================

global:
  nameOverride: ""
  fullnameOverride: ""
  namespace: pokemon-app

# ------------------------------------------------------------------------------
# 1. Backend Microservice (FastAPI / Express Node.js)
# ------------------------------------------------------------------------------
api:
  replicaCount: 1
  image:
    repository: pokedex-api
    tag: "1.9.5"
    digest: ""
    pullPolicy: IfNotPresent
  port: 3000
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
      ephemeral-storage: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
      ephemeral-storage: "128Mi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  env:
    nodeEnv: "production"
    corsOrigins: "https://pokedex.example.com"
    # OTLP collector endpoint (Grafana Alloy en namespace monitoring o Tempo local)
    otelEndpoint: "http://grafana-cloud-alloy.monitoring.svc.cluster.local:4317"
    otelServiceName: "pokedex-api"
  terminationGracePeriodSeconds: 30
  # Margen de arranque antes de que la livenessProbe pueda reiniciar el pod.
  # Necesario porque el backend aplica las migraciones Drizzle al iniciar
  # (ADR-011): una migracion lenta debe ser tolerable, no reiniciar el pod.
  # Poner en {} o null para desactivarlo.
  startupProbe:
    failureThreshold: 30
    periodSeconds: 5
    timeoutSeconds: 3
  deploymentAnnotations:
    reloader.stakater.com/auto: "true"
  podAnnotations: {}

# ------------------------------------------------------------------------------
# 2. Frontend Web (Nginx + Reverse Proxy)
# ------------------------------------------------------------------------------
web:
  replicaCount: 1
  image:
    repository: pokedex-web
    tag: "1.9.5"
    digest: ""
    pullPolicy: IfNotPresent
  port: 8080
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  resources:
    limits:
      cpu: "250m"
      memory: "256Mi"
      ephemeral-storage: "256Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"
      ephemeral-storage: "64Mi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 30
  # Margen de arranque antes de que la livenessProbe pueda reiniciar el pod
  # mientras Nginx termina de cargar su configuracion renderizada.
  # Poner en {} o null para desactivarlo.
  startupProbe:
    failureThreshold: 12
    periodSeconds: 5
    timeoutSeconds: 3
  deploymentAnnotations:
    reloader.stakater.com/auto: "true"
  podAnnotations: {}

# ------------------------------------------------------------------------------
# 3. Base de Datos Relacional (PostgreSQL 16 StatefulSet)
# ------------------------------------------------------------------------------
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    # INFRA-005: digest en campo dedicado (antes incrustado en `tag`).
    digest: "sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685"
    pullPolicy: IfNotPresent
  port: 5432
  auth:
    database: pokedex_db
    username: pokedex_app
    password: ""
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
      ephemeral-storage: "1Gi"
    requests:
      cpu: "100m"
      memory: "128Mi"
      ephemeral-storage: "256Mi"

# ------------------------------------------------------------------------------
# 4. Connection Pooler (PgBouncer)
# ------------------------------------------------------------------------------
pgbouncer:
  enabled: false
  replicaCount: 1
  image:
    repository: pgbouncer/pgbouncer
    tag: "1.22.0"
    # INFRA-005: digest en campo dedicado (antes incrustado en `tag`).
    digest: "sha256:aa8a38b7b33e5fe70c679053f97a8e55c74d52b00c195f0880845e52b50ce516"
    pullPolicy: IfNotPresent
  port: 5432
  poolMode: transaction
  maxClientConn: 100
  defaultPoolSize: 20
  resources:
    limits:
      cpu: "250m"
      memory: "256Mi"
      ephemeral-storage: "256Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"
      ephemeral-storage: "64Mi"

# ------------------------------------------------------------------------------
# 5. Caché en Memoria (Redis 7)
# ------------------------------------------------------------------------------
redis:
  enabled: true
  replicaCount: 1
  image:
    repository: redis
    tag: "7-alpine"
    # INFRA-005: digest en campo dedicado. Antes viajaba incrustado en `tag`
    # ("7-alpine@sha256:..."), lo que impedía migrar a un campo `digest`
    # explícito sin reescribir la etiqueta completa.
    digest: "sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf"
    pullPolicy: IfNotPresent
  port: 6379
  auth:
    password: ""
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  service:
    port: 6379
  resources:
    limits:
      cpu: "250m"
      memory: "256Mi"
      ephemeral-storage: "256Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"
      ephemeral-storage: "64Mi"

# ------------------------------------------------------------------------------
# 6. Ingress Controller — Terminación TLS y Hardening HTTP L7 (ADR-016)
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    # --- Timeouts y tamaño de cuerpo ---
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # --- TLS: redirección forzada HTTP→HTTPS (308) por defecto seguro (ADR-016) ---
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # --- cert-manager: emisor de certificado TLS ---
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # --- Rate Limiting L7: protección contra ráfagas y DDoS volumétrico (ADR-016) ---
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    # --- Cabeceras de seguridad HTTP inyectadas en todas las respuestas (ADR-016) ---
    # Nota: HSTS (Strict-Transport-Security) se configura exclusivamente en values.prod.yaml con TLS activo.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=()";
      more_set_headers "Cross-Origin-Opener-Policy: same-origin";
      more_set_headers "Cross-Origin-Resource-Policy: same-origin";
      more_set_headers "Cross-Origin-Embedder-Policy: require-corp";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://raw.githubusercontent.com data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'";
    # --- Bloqueo de endpoints internos desde el exterior (ADR-016) ---
    nginx.ingress.kubernetes.io/server-snippet: |
      location /metrics {
        deny all;
        return 403;
      }
      location /healthz {
        deny all;
        return 403;
      }
      location /readyz {
        deny all;
        return 403;
      }
  hosts:
    - host: pokedex.example.com
      paths:
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /pokemons
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /
          pathType: Prefix
          backend:
            service:
              name: pokemon-web-svc
              port:
                number: 8080
  # --- TLS: Habilitado por defecto seguro (ADR-016) ---
  # En desarrollo local (Kind/Minikube) sobrescribir en values.dev.yaml con tls: [] y ssl-redirect: "false"
  tls:
    - hosts:
        - pokedex.example.com
      secretName: pokedex-tls-cert
  # Certificado TLS sincronizado por ESO desde Vault para entornos sin cert-manager
  # (Proxmox, CA interna). Crea un Secret kubernetes.io/tls con el nombre del primer
  # bloque de `tls` a partir de dos propiedades PEM de `remoteRef.key`.
  tlsExternalSecret:
    enabled: false
    remoteRef:
      key: ""
      certProperty: TLS_CRT
      keyProperty: TLS_KEY

# ------------------------------------------------------------------------------
# 7. Credenciales y Secretos de Aplicación
# ------------------------------------------------------------------------------
secrets:
  # Nombre de un Secret preexistente en el clúster (Recomendado en Producción para desacoplar Helm de secretos)
  # Si se define, Helm NO creará el recurso Secret y los Pods consumirán este Secret existente.
  existingSecret: ""
  secretName: "pokemon-secrets"
  # Credenciales para desarrollo local (si existingSecret no está definido)
  adminApiKey: ""
  adminSessionSecret: ""
  aiApiKey: ""
  geminiApiKey: ""
  minioRootUser: ""
  minioRootPassword: ""
  backupEncryptionKey: ""

# ------------------------------------------------------------------------------
# 7b. External Secrets Operator (ESO - Sincronización automática con Vault o el backend cloud)
# ------------------------------------------------------------------------------
externalSecrets:
  enabled: false
  refreshInterval: "1h"
  targetSecretName: "pokemon-secrets"
  annotations: {}
  # Convención de Nomenclatura según Proveedor:
  # - Prod cloud (blueprint, ADR-030): key: "pokedex/prod" (sin prefijo secret/data)
  # - HashiCorp Vault (KV v2): key: "secret/data/pokedex/prod" (prefijo API requerido por Vault KV engine v2)
  secretStoreRef:
    name: "vault-backend"
    kind: "ClusterSecretStore"
  remoteRef:
    key: "secret/data/pokedex/prod"
  # data: []       # Lista explícita de campos (opcional, por defecto usa las credenciales estándar)
  # dataFrom: []   # Extracción masiva (ej. - extract: { key: "secret/data/pokedex/prod" })
  secretStore:
    create: false
    kind: "SecretStore" # "SecretStore" o "ClusterSecretStore"
    name: ""
    annotations: {}
    provider: {}

# ------------------------------------------------------------------------------
# 8. Políticas de Seguridad Zero-Trust y Resiliencia
# ------------------------------------------------------------------------------
networkPolicies:
  enabled: true
  egress:
    antiSsrf: true
    externalHttps: false
    allowedExternalCidrs: []

# Aislamiento de Capa 7 (L7 Egress) mediante Cilium eBPF FQDN NetworkPolicy (Zero-Trust por defecto)
ciliumNetworkPolicy:
  enabled: true
  fqdnAllowlist:
    - matchName: "generativelanguage.googleapis.com"
    - matchPattern: "*.githubusercontent.com"
    - matchPattern: "*.pokeapi.co"


podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ------------------------------------------------------------------------------
# 9. Job de Siembra Masiva de Datos
# ------------------------------------------------------------------------------
seedJob:
  enabled: false
  forceSeed: false
  # Dataset de seed.ts (ADR-030): "sample" (35 Pokémon) o "full" (catálogo nacional).
  dataset: "sample"
  image:
    # Vacío = misma imagen y digest que api.image (`dist/seed.cjs` forma parte de su
    # build y el digest ya está firmado con Cosign). Declarar solo para otra imagen.
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent

# ------------------------------------------------------------------------------
# 10. Gobernanza de Recursos del Namespace (ResourceQuota & LimitRange)
# ------------------------------------------------------------------------------
resourceQuota:
  enabled: true
  hard:
    requestsCpu: "4"
    requestsMemory: "4Gi"
    limitsCpu: "8"
    limitsMemory: "8Gi"
    pods: "30"
    services: "10"

limitRange:
  enabled: true
  default:
    cpu: "500m"
    memory: "512Mi"
  defaultRequest:
    cpu: "100m"
    memory: "128Mi"
  max:
    cpu: "2"
    memory: "2Gi"
  min:
    cpu: "50m"
    memory: "64Mi"

# ------------------------------------------------------------------------------
# 11. Disaster Recovery & Backup Automatizado (PostgreSQL)
# ------------------------------------------------------------------------------
backup:
  enabled: true
  schedule: "0 2 * * *"
  # Imagen de los CronJobs de backup y DR Verify. Es independiente de
  # `postgresql.image`: `postgres:16-alpine` trae pg_dump pero NO el CLI openssl
  # que cifra (AES-256-CBC) y descifra los volcados; el backup fallaba con
  # "openssl: not found" (pre-prod, 2026-10-04). La variante Debian trae ambos.
  # Debe mantener la misma major que el servidor (pg_dump 16).
  image:
    repository: postgres
    tag: "16-bookworm"
    digest: "sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67"
    pullPolicy: IfNotPresent
  retentionDays: 7
  # Autenticación de los backups (Encrypt-then-MAC). El cifrado AES-256-CBC no autentica y el .sha256 solo
  # detecta corrupción (quien altera el backup lo recalcula), así que cada .enc lleva un .enc.hmac con un
  # HMAC-SHA256 calculado con una clave derivada de BACKUP_ENCRYPTION_KEY. El .enc no cambia y sigue siendo
  # legible con `openssl enc -d`.
  hmac:
    # Los backups creados desde esta fecha (YYYYMMDD en UTC, la del nombre pokedex_YYYYMMDD_HHMMSS) DEBEN llevar
    # .hmac; la verificación los rechaza si falta. Los anteriores nacieron antes de la autenticación y se aceptan
    # sin él con un aviso. Sin esta fecha, quien tuviera acceso de escritura podría borrar el .hmac y degradar la
    # verificación. Debe ser posterior al despliegue de este cambio y anterior al primer backup que ya lo incluya.
    requiredFrom: "20261008"
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  # ----------------------------------------------------------------------------
  # Arquitectura 3-2-1: Copia off-site remota a Object Storage (Cloud-Ready Agnóstico)
  # ESTADO: Esqueleto preparado (INACTIVO: enabled: false) hasta la provisión de credenciales.
  # Compatible con: AWS S3, Cloudflare R2, Backblaze B2, MinIO remoto, Google Cloud Storage.
  # ----------------------------------------------------------------------------
  offsite:
    enabled: false
    provider: "s3-compatible" # "s3-compatible" | "aws-s3" | "cloudflare-r2" | "backblaze-b2" | "minio"
    endpoint: ""              # Requerido para proveedores no-AWS (ej: https://<id>.r2.cloudflarestorage.com)
    bucket: "pokedex-backups-offsite"
    region: "us-east-1"
    prefix: "database/postgres"
    secretName: ""            # Nombre del K8s Secret con credenciales inyectadas vía Vault / ExternalSecrets
    objectLock: false         # Inmutabilidad WORM del proveedor contra ransomware
  # Verificación Periódica Automatizada de DR (Restore Drill)
  restoreVerification:
    enabled: true
    schedule: "0 4 * * 0" # Semanal los domingos a las 04:00 UTC (posterior al snapshot diario)
  # Sincronización Off-Site a Google Drive (Puente K8s-Native Rclone)
  # Sincroniza directamente desde pokedex-backup-pvc hacia Google Drive (Costo $0 USD)
  gdrive:
    enabled: false
    schedule: "0 3 * * *" # Diario a las 03:00 UTC (1 hora tras el snapshot diario de las 02:00)
    folder: "PokedexBackups/proxmox"
    secretName: "" # Default: pokemon-secrets
    tokenKey: "GDRIVE_TOKEN"
    image:
      repository: rclone/rclone
      tag: "1.68.2" # rclone 1.68.2
      digest: "sha256:74c51b8817e5431bd6d7ed27cb2a50d8ee78d77f6807b72a41ef6f898845942b" # rclone 1.68.2
      pullPolicy: IfNotPresent
    # Aislamiento de Red L7 Egress (CiliumNetworkPolicy FQDN Allowlist)
    fqdnAllowlist:
      - matchPattern: "*.googleapis.com"
      - matchName: "accounts.google.com"
    resources:
      limits:
        cpu: "300m"
        memory: "256Mi"
        ephemeral-storage: "512Mi"
      requests:
        cpu: "50m"
        memory: "64Mi"
        ephemeral-storage: "128Mi"

# ------------------------------------------------------------------------------
# 12. Monitoreo & Observabilidad (Prometheus Operator / ServiceMonitor)
# ------------------------------------------------------------------------------
monitoring:
  serviceMonitor:
    enabled: false
    interval: "15s"
    scrapeTimeout: "10s"
    additionalLabels: {}

# ------------------------------------------------------------------------------
# 13. Stakater Reloader (Rotación Dinámica Zero-Downtime - ADR-005)
# ------------------------------------------------------------------------------
# Desactivado por defecto seguro (evita asumir que el operador esté instalado en el clúster)
reloader:
  enabled: false
  auto: false
