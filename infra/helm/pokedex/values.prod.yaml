# ==============================================================================
# Overrides para Entorno de Producción (Alta Disponibilidad & Endurecimiento)
# ==============================================================================

api:
  replicaCount: 2
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "256Mi"
  autoscaling:
    minReplicas: 2
    maxReplicas: 10
  env:
    corsOrigins: "https://pokedex.example.com"

web:
  replicaCount: 2
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"

postgresql:
  auth:
    username: pokedex_app
  persistence:
    size: 10Gi
    storageClass: "standard"
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"

pgbouncer:
  replicaCount: 2
  maxClientConn: 500
  defaultPoolSize: 50

ingress:
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: pokedex.example.com
      paths:
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /pokemons
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /
          pathType: Prefix
          backend:
            service:
              name: pokemon-web-svc
              port:
                number: 8080
  tls:
    - secretName: pokedex-tls
      hosts:
        - pokedex.example.com

# ------------------------------------------------------------------------------
# Secretos de Producción: Se exige inyección segura mediante SealedSecrets o --set
# ------------------------------------------------------------------------------
secrets:
  adminApiKey: "" # Forzar inyección obligatoria en producción mediante --set o sealed-secrets
  adminSessionSecret: ""
