# ==============================================================================
# Overrides para Entorno de Producción (Alta Disponibilidad & Endurecimiento)
# ==============================================================================

api:
  replicaCount: 2
  image:
    repository: ghcr.io/rocapellino/pokedex-api
    tag: "1.30.1"
    digest: "sha256:4113ac3d61577bd4eef013e80ec8f05ffcfa4c079b51a1dcec9d884dacc4ddbd" # Pinning OCI SHA-256 inmutable alineado con Cosign
    pullPolicy: IfNotPresent
  deploymentAnnotations:
    reloader.stakater.com/auto: "true"
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: pokemon-api
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
      ephemeral-storage: "1Gi"
    requests:
      cpu: "250m"
      memory: "256Mi"
      ephemeral-storage: "256Mi"
  autoscaling:
    minReplicas: 2
    maxReplicas: 10
  env:
    nodeEnv: "production"
    corsOrigins: "https://pokedex.example.com"

web:
  replicaCount: 2
  image:
    repository: ghcr.io/rocapellino/pokedex-web
    tag: "1.30.1"
    digest: "sha256:9cc9468cb10ed865e8182e4a2cf4fc0d0196d6fa6f88ac4cf921a70ca92b1b1c" # Pinning OCI SHA-256 inmutable alineado con Cosign
    pullPolicy: IfNotPresent
  deploymentAnnotations:
    reloader.stakater.com/auto: "true"
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: pokemon-web
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
      ephemeral-storage: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
      ephemeral-storage: "128Mi"

postgresql:
  auth:
    username: pokedex_app
  persistence:
    size: 10Gi
    storageClass: "standard"
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
      ephemeral-storage: "2Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"
      ephemeral-storage: "512Mi"

pgbouncer:
  enabled: true
  replicaCount: 2
  maxClientConn: 500
  defaultPoolSize: 50

redis:
  persistence:
    enabled: true
    size: 8Gi
    storageClass: "standard"

ingress:
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=()";
      more_set_headers "Cross-Origin-Opener-Policy: same-origin";
      more_set_headers "Cross-Origin-Resource-Policy: same-origin";
      more_set_headers "Cross-Origin-Embedder-Policy: require-corp";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; img-src 'self' https://raw.githubusercontent.com data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'";
  hosts:
    - host: pokedex.example.com
      paths:
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /pokemons
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /
          pathType: Prefix
          backend:
            service:
              name: pokemon-web-svc
              port:
                number: 8080
  tls:
    - secretName: pokedex-tls
      hosts:
        - pokedex.example.com

# ------------------------------------------------------------------------------
# Gestión de Secretos en Producción (Zero-Trust & Desacoplamiento de Helm)
# ------------------------------------------------------------------------------
# Arquitectura y Jerarquía Canónica:
# 1. MODELO OFICIAL (GitOps / Entornos Multi-Cloud & On-Prem):
#    External Secrets Operator (ESO) con recarga automática vía Stakater Reloader.
#    Habilitado por environment en gitops/environments/{proxmox,aws}/values.yaml
#    consumiendo HashiCorp Vault (on-prem) o AWS Secrets Manager (cloud).
# 2. MODELO DE RESPALDO / AIR-GAPPED (CI / Standalone):
#    Secret preexistente (existingSecret: "pokedex-prod-secrets") inyectado de forma
#    independiente a Helm, evitando secretos planos o el uso de --set en pipelines.
secrets:
  existingSecret: "pokedex-prod-secrets"

externalSecrets:
  enabled: false # En values.prod.yaml base permanece false; los entornos GitOps (proxmox/aws) lo activan como SSOT
  refreshInterval: "1h"
  secretStoreRef:
    name: "vault-backend"
    kind: "ClusterSecretStore"
  remoteRef:
    key: "pokedex/production"

reloader:
  enabled: true
  auto: true

resourceQuota:
  enabled: true
  hard:
    requestsCpu: "8"
    requestsMemory: "8Gi"
    limitsCpu: "16"
    limitsMemory: "16Gi"
    pods: "50"
    services: "15"

limitRange:
  enabled: true
  default:
    cpu: "500m"
    memory: "512Mi"
  defaultRequest:
    cpu: "100m"
    memory: "128Mi"
  max:
    cpu: "2"
    memory: "2Gi"
  min:
    cpu: "50m"
    memory: "64Mi"

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ------------------------------------------------------------------------------
# Aislamiento de Red Zero-Trust en Producción (L7 Egress)
# ------------------------------------------------------------------------------
# En producción, se exige Zero-Trust a nivel L7 mediante Cilium eBPF (FQDN Allowlist)
# o mediante un Egress Gateway perimetral. Se deshabilita el fallback permisivo de
# 0.0.0.0/0 (externalHttps: false) para prevenir exfiltración arbitraria y cumplir
# con la directriz de menor privilegio.
networkPolicies:
  enabled: true
  egress:
    antiSsrf: true
    externalHttps: false
    allowedExternalCidrs: []
    useEgressGateway: false

ciliumNetworkPolicy:
  enabled: true
  fqdnAllowlist:
    - matchName: "generativelanguage.googleapis.com"
    - matchPattern: "*.githubusercontent.com"
    - matchPattern: "*.pokeapi.co"

monitoring:
  serviceMonitor:
    enabled: true
    interval: "15s"
    scrapeTimeout: "10s"
    additionalLabels:
      release: prometheus-stack



