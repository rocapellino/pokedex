# ==============================================================================
# BASE DEL BLUEPRINT PROD CLOUD — Endurecimiento de producción (Alta Disponibilidad)
# ==============================================================================
# INFRA-011 / ADR-030: este archivo es la capa intermedia del blueprint prod cloud,
# hoy INACTIVO. Ningún entorno desplegado lo consume.
#
# Cadena de values por Application:
#   - pokedex-preprod (activa)   -> values.yaml + gitops/environments/proxmox-preprod/values.yaml
#   - pokedex-cloud (blueprint)  -> values.yaml + values.prod.yaml (este archivo)
#                                   + gitops/environments/cloud/values.yaml
#
# Aquí vive la postura endurecida independiente del proveedor (HA, PgBouncer,
# Reloader, Zero-Trust L7, digest pinning, ResourceQuota, backups). El override
# `gitops/environments/cloud/` solo declara los puntos de variación del proveedor.
# CI renderiza la cadena completa y los tests verifican su configuración, pero
# ninguna de esas aserciones describe un entorno desplegado hasta que prod cloud
# se active.
# ==============================================================================

api:
  replicaCount: 2
  image:
    repository: ghcr.io/rocapellino/pokedex-api
    digest: "sha256:2ed7f38684e36dd4f7b82f865f9ae48e09c8e606f9c7ef6db9ff6fc398306d48" # Pinning OCI SHA-256 inmutable (SSOT alineado con Cosign)
    pullPolicy: IfNotPresent
  deploymentAnnotations:
    reloader.stakater.com/auto: "true"
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: pokemon-api
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
      ephemeral-storage: "1Gi"
    requests:
      cpu: "250m"
      memory: "256Mi"
      ephemeral-storage: "256Mi"
  autoscaling:
    minReplicas: 2
    maxReplicas: 10
  env:
    nodeEnv: "production"
    corsOrigins: "https://pokedex.example.com"

web:
  replicaCount: 2
  image:
    repository: ghcr.io/rocapellino/pokedex-web
    digest: "sha256:fd5b28b66b1ac7a0a4badd2ac2ff422b7dcf6bab2181d47cd4c83f561a22201e" # Pinning OCI SHA-256 inmutable (SSOT alineado con Cosign)
    pullPolicy: IfNotPresent
  deploymentAnnotations:
    reloader.stakater.com/auto: "true"
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: pokemon-web
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
      ephemeral-storage: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
      ephemeral-storage: "128Mi"

postgresql:
  auth:
    username: pokedex_app
  persistence:
    size: 10Gi
    storageClass: "standard"
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
      ephemeral-storage: "2Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"
      ephemeral-storage: "512Mi"

pgbouncer:
  enabled: true
  replicaCount: 2
  maxClientConn: 500
  defaultPoolSize: 50

redis:
  persistence:
    enabled: true
    size: 8Gi
    storageClass: "standard"

ingress:
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=()";
      more_set_headers "Cross-Origin-Opener-Policy: same-origin";
      more_set_headers "Cross-Origin-Resource-Policy: same-origin";
      more_set_headers "Cross-Origin-Embedder-Policy: require-corp";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://raw.githubusercontent.com data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'";
  hosts:
    - host: pokedex.example.com
      paths:
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /pokemons
          pathType: Prefix
          backend:
            service:
              name: pokemon-api-svc
              port:
                number: 3000
        - path: /
          pathType: Prefix
          backend:
            service:
              name: pokemon-web-svc
              port:
                number: 8080
  tls:
    - secretName: pokedex-tls
      hosts:
        - pokedex.example.com

# ------------------------------------------------------------------------------
# Gestión de Secretos en Producción (Zero-Trust & Desacoplamiento de Helm)
# ------------------------------------------------------------------------------
# Arquitectura y Jerarquía Canónica:
# 1. MODELO OFICIAL (GitOps / Entornos Multi-Cloud & On-Prem):
#    External Secrets Operator (ESO) con recarga automática vía Stakater Reloader.
#    Habilitado por environment en gitops/environments/{proxmox-preprod,cloud}/values.yaml
#    consumiendo HashiCorp Vault (on-prem) o el backend elegido al activar prod cloud.
# 2. MODELO DE RESPALDO / AIR-GAPPED (CI / Standalone):
#    Secret preexistente (existingSecret: "pokedex-prod-secrets") inyectado de forma
#    independiente a Helm, evitando secretos planos o el uso de --set en pipelines.
secrets:
  existingSecret: "pokedex-prod-secrets"

externalSecrets:
  enabled: false # En values.prod.yaml base permanece false; los overrides GitOps (proxmox-preprod/cloud) lo activan como SSOT
  refreshInterval: "1h"
  # Especificidad de Nomenclatura por Proveedor (ADR-011 / SECRETS_MANAGEMENT.md):
  # - HashiCorp Vault KV v2 (Proxmox On-Prem): name: "vault-backend" | key: "secret/data/pokedex/prod"
  # - Prod cloud (blueprint, ADR-030):         name: parámetro del override cloud | key: "pokedex/prod"
  secretStoreRef:
    name: "vault-backend"
    kind: "ClusterSecretStore"
  remoteRef:
    key: "secret/data/pokedex/prod"

# ------------------------------------------------------------------------------
# Recarga Dinámica de Cargas de Trabajo (Stakater Reloader vs checksum/config)
# ------------------------------------------------------------------------------
# Justificación de la Dualidad Arquitectónica Multi-Entorno (ADR-005):
# - ENTORNO PROD CLOUD (blueprint / values.prod.yaml base):
#   reloader.enabled: true | reloader.auto: true.
#   Imprescindible porque los Secrets son gestionados de forma asíncrona por ESO
#   desde el backend de secretos en runtime. Cuando una credencial rota fuera del ciclo
#   de vida de Helm, la anotación checksum/config NO varía (el Secret no forma parte
#   del render estático de Helm). Stakater Reloader observa la API de Kubernetes y
#   dispara el RollingUpdate autónomo de forma zero-touch.
# - ENTORNO ON-PREMISE (Proxmox VE - Perfil Lean / gitops/environments/proxmox-preprod):
#   reloader.enabled: false.
#   Desactivado deliberadamente para reducir la huella de memoria (< 1 GB RAM) y evitar
#   controladores RBAC cluster-wide en un laboratorio/MVP. La recarga de cambios en
#   ConfigMap se realiza con Helm checksum/config nativo, mientras que la rotación
#   de secretos en Vault se delega a reinicios controlados (kubectl rollout restart).
reloader:
  enabled: true
  auto: true


resourceQuota:
  enabled: true
  hard:
    requestsCpu: "8"
    requestsMemory: "8Gi"
    limitsCpu: "16"
    limitsMemory: "16Gi"
    pods: "50"
    services: "15"

limitRange:
  enabled: true
  default:
    cpu: "500m"
    memory: "512Mi"
  defaultRequest:
    cpu: "100m"
    memory: "128Mi"
  max:
    cpu: "2"
    memory: "2Gi"
  min:
    cpu: "50m"
    memory: "64Mi"

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ------------------------------------------------------------------------------
# Aislamiento de Red Zero-Trust en Producción (L7 Egress)
# ------------------------------------------------------------------------------
# En producción, se exige Zero-Trust a nivel L7 mediante Cilium eBPF (FQDN Allowlist)
# o mediante un Egress Gateway perimetral. Se deshabilita el fallback permisivo de
# 0.0.0.0/0 (externalHttps: false) para prevenir exfiltración arbitraria y cumplir
# con la directriz de menor privilegio.
networkPolicies:
  enabled: true
  egress:
    antiSsrf: true
    externalHttps: false
    allowedExternalCidrs: []

ciliumNetworkPolicy:
  enabled: true
  fqdnAllowlist:
    - matchName: "generativelanguage.googleapis.com"
    - matchPattern: "*.githubusercontent.com"
    - matchPattern: "*.pokeapi.co"

monitoring:
  serviceMonitor:
    enabled: true
    interval: "15s"
    scrapeTimeout: "10s"
    additionalLabels:
      release: prometheus-stack

# ------------------------------------------------------------------------------
# Disaster Recovery & Respaldo Persistente (PostgreSQL)
# ------------------------------------------------------------------------------
backup:
  enabled: true
  schedule: "0 2 * * *"
  retentionDays: 7
  persistence:
    enabled: true
    size: 5Gi
    storageClass: "standard"
  gdrive:
    enabled: true
    folder: "PokedexBackups/prod"
