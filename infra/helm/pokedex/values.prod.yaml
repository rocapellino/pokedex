# ==============================================================================
# Overrides para Entorno de Producción (Alta Disponibilidad & Endurecimiento)
# ==============================================================================

api:
  replicaCount: 2
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "256Mi"
  autoscaling:
    minReplicas: 2
    maxReplicas: 10

web:
  replicaCount: 2
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"

postgresql:
  persistence:
    size: 10Gi
    storageClass: "standard"
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"

pgbouncer:
  replicaCount: 2
  maxClientConn: 500
  defaultPoolSize: 50

ingress:
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  host: pokedex.example.com
  tls:
    - secretName: pokedex-tls
      hosts:
        - pokedex.example.com

# ------------------------------------------------------------------------------
# Secretos de Producción: Se exige inyección segura mediante SealedSecrets o --set
# ------------------------------------------------------------------------------
secrets:
  adminApiKey: "" # Forzar inyección obligatoria en producción mediante --set o sealed-secrets
