{{- if or (and .Values.networkPolicies .Values.networkPolicies.enabled) (and .Values.networkPolicy .Values.networkPolicy.enabled) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pokedex.fullname" . }}-default-deny-all-ingress
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pokedex.fullname" . }}-allow-web-ingress
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: []
      ports:
        - protocol: TCP
          port: 80
  egress:
    # Permitir resolución DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Permitir proxy inverso hacia el backend API
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pokedex.fullname" . }}-allow-api-ingress
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: web
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
  egress:
    # Permitir resolución DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Permitir tráfico hacia base de datos (PostgreSQL directo o PgBouncer)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: database
        {{- if .Values.pgbouncer.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: pgbouncer
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
    # Permitir tráfico hacia Redis
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: 6379
    # Permitir tráfico HTTPS saliente para servicios externos (ej. Gemini AI, PokeAPI)
    - ports:
        - protocol: TCP
          port: 443
---
{{- if .Values.pgbouncer.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pokedex.fullname" . }}-allow-pgbouncer-ingress
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: pgbouncer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: db-seeder
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: database
      ports:
        - protocol: TCP
          port: 5432
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pokedex.fullname" . }}-allow-postgres-ingress
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: pgbouncer
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: db-seeder
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pokedex.fullname" . }}-allow-redis-ingress
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: db-seeder
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
