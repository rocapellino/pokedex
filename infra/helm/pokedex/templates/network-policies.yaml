{{- if or (and .Values.networkPolicies .Values.networkPolicies.enabled) (and .Values.networkPolicy .Values.networkPolicy.enabled) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pokedex.fullname" . }}-default-deny-all-ingress
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pokedex.fullname" . }}-allow-web-ingress
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Permitir tráfico HTTP al frontend web (Ingress Controller, LoadBalancer o servicios perimetrales)
    - ports:
        - protocol: TCP
          port: {{ .Values.web.port }}
  egress:
    # Permitir resolución DNS interna únicamente
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Permitir proxy inverso hacia el backend API únicamente
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pokedex.fullname" . }}-allow-api-ingress
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: web
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
  egress:
    # Permitir resolución DNS interna únicamente
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Permitir tráfico hacia base de datos:
    # Si PgBouncer está habilitado, la API SOLO puede comunicarse con PgBouncer (Zero Trust isolation)
    {{- if .Values.pgbouncer.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: pgbouncer
      ports:
        - protocol: TCP
          port: 5432
    {{- else }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: database
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    # Permitir tráfico hacia Redis únicamente
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: 6379
    # Permitir tráfico HTTPS saliente para servicios externos (ej. Gemini AI, PokeAPI)
    # Si Egress Gateway está habilitado, la API canaliza todo tráfico externo a través del proxy perimetral (puerto 10000)
    {{- if and .Values.networkPolicies.egress .Values.networkPolicies.egress.useEgressGateway }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: egress-gateway
      ports:
        - protocol: TCP
          port: {{ .Values.egressGateway.port | default 10000 }}
    {{- else if and .Values.networkPolicies.egress (or .Values.networkPolicies.egress.externalHttps .Values.networkPolicies.egress.antiSsrf) }}
    # Endurecido con Anti-SSRF: Bloquea endpoints de metadatos de nube y redes privadas RFC1918
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32 # AWS/GCP/Azure IMDS Metadata Endpoint (Anti-SSRF)
              - 10.0.0.0/8         # RFC1918 Red Privada
              - 172.16.0.0/12      # RFC1918 Red Privada / K8s internal subnets
              - 192.168.0.0/16     # RFC1918 Red Privada
              - 127.0.0.0/8        # Loopback
        {{- if .Values.networkPolicies.egress.allowedExternalCidrs }}
        {{- range .Values.networkPolicies.egress.allowedExternalCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
---
{{- if .Values.pgbouncer.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pokedex.fullname" . }}-allow-pgbouncer-ingress
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: pgbouncer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: db-seeder
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: database
      ports:
        - protocol: TCP
          port: 5432
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pokedex.fullname" . }}-allow-postgres-ingress
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- if .Values.pgbouncer.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: pgbouncer
        {{- else }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
        {{- end }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: db-seeder
      ports:
        - protocol: TCP
          port: 5432
  # Zero-Trust: La base de datos es puramente pasiva; no inicia conexiones de salida
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pokedex.fullname" . }}-allow-redis-ingress
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: db-seeder
      ports:
        - protocol: TCP
          port: 6379
  # Zero-Trust: El motor de caché no requiere peticiones de salida
  egress: []
{{- end }}
