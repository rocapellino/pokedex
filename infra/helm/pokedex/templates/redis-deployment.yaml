{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: pokemon-redis-svc
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
    app: redis
spec:
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: {{ .Values.redis.port }}
      name: redis
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
    app: redis
spec:
  replicas: {{ .Values.redis.replicaCount }}
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/component: redis
        {{- include "pokedex.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          command:
            - "sh"
            - "-c"
            - "printf 'port %s\\nrequirepass %s\\n' '{{ .Values.redis.port }}' \"$REDIS_PASSWORD\" > /tmp/redis.conf && exec redis-server /tmp/redis.conf"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pokedex.secretName" . }}
                  key: REDIS_PASSWORD
          ports:
            - containerPort: {{ .Values.redis.port }}
              name: redis
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
{{- end }}
