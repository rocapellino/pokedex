{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
    app: postgres
spec:
  ports:
    - port: {{ .Values.postgresql.port }}
      targetPort: {{ .Values.postgresql.port }}
      name: postgres
  clusterIP: None
  selector:
    app: postgres
{{- end }}
