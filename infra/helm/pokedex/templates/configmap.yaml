apiVersion: v1
kind: ConfigMap
metadata:
  name: pokemon-config
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.api.env.nodeEnv | quote }}
  SECURE_COOKIES: {{ ternary "true" "false" (eq .Values.api.env.nodeEnv "production") | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_HOST: {{ if .Values.pgbouncer.enabled }}"pgbouncer-service"{{ else }}"postgres-service"{{ end }}
  POSTGRES_PORT: {{ if .Values.pgbouncer.enabled }}"6432"{{ else }}{{ .Values.postgresql.port | quote }}{{ end }}
  REDIS_HOST: "pokemon-redis-svc"
  REDIS_PORT: {{ .Values.redis.port | quote }}
  PORT: {{ .Values.api.port | quote }}
  WEB_PORT: {{ .Values.web.service.port | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.api.env.otelEndpoint | quote }}
  OTEL_SERVICE_NAME: {{ .Values.api.env.otelServiceName | default "pokedex-api" | quote }}
  CORS_ORIGINS: {{ .Values.api.env.corsOrigins | quote }}
  DB_SSL: {{ .Values.postgresql.ssl | default "false" | quote }}
