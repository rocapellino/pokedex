{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
data:
  init.sql: |
    -- ==============================================================================
    -- Schema Initialization: Pokédex Database (PostgreSQL 16)
    -- Modelo unificado y sincronizado con el backend Node.js / TypeScript
    -- ==============================================================================
    CREATE TABLE IF NOT EXISTS pokedex_entries (
        id INT PRIMARY KEY,
        nombre VARCHAR(100) NOT NULL,
        tipo VARCHAR(50) NOT NULL,
        data JSONB NOT NULL,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_pokedex_tipo ON pokedex_entries(tipo);
    CREATE INDEX IF NOT EXISTS idx_pokedex_nombre ON pokedex_entries(nombre);
    CREATE SEQUENCE IF NOT EXISTS pokedex_id_seq START WITH 1009;
{{- end }}

