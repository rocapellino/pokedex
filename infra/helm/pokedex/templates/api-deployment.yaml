apiVersion: v1
kind: Service
metadata:
  name: pokemon-api-svc
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
    app: pokemon-api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.port }}
      name: http
  selector:
    app: pokemon-api
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
    app: pokemon-api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.port }}
      name: http
  selector:
    app: pokemon-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokemon-api
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
    app: pokemon-api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: pokemon-api
  template:
    metadata:
      labels:
        app: pokemon-api
        app.kubernetes.io/component: api
        {{- include "pokedex.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: {{ .Values.api.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.api.securityContext.runAsUser }}
        runAsGroup: {{ .Values.api.securityContext.runAsGroup }}
        seccompProfile:
          {{- toYaml .Values.api.securityContext.seccompProfile | nindent 10 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.api.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.api.securityContext.readOnlyRootFilesystem }}
            capabilities:
              {{- toYaml .Values.api.securityContext.capabilities | nindent 14 }}
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
          envFrom:
            - configMapRef:
                name: pokemon-config
            - secretRef:
                name: {{ include "pokedex.secretName" . }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.api.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: tmp-volume
          emptyDir: {}
