apiVersion: v1
kind: Service
metadata:
  name: pokemon-api-svc
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
    app: pokemon-api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.port }}
      name: http
  selector:
    app: pokemon-api
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
    app: pokemon-api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.port }}
      name: http
  selector:
    app: pokemon-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokemon-api
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
    app: pokemon-api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: pokemon-api
  template:
    metadata:
      labels:
        app: pokemon-api
        {{- include "pokedex.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.api.securityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
          envFrom:
            - configMapRef:
                name: pokemon-config
            - secretRef:
                name: pokemon-secrets
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.api.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
