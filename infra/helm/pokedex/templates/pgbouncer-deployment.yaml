{{- if .Values.pgbouncer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer-service
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
    app: pgbouncer
spec:
  ports:
    - port: 6432
      targetPort: 6432
      name: pgbouncer
  selector:
    app: pgbouncer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
    app: pgbouncer
spec:
  replicas: {{ .Values.pgbouncer.replicaCount }}
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
        # Las NetworkPolicy (y la de Cilium) seleccionan a PgBouncer por este componente.
        app.kubernetes.io/component: pgbouncer
        {{- include "pokedex.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      # Autenticación real de los clientes (scram-sha-256): el `userlist` se genera al arrancar
      # a partir del usuario y la contraseña de PostgreSQL y vive solo en un emptyDir en memoria.
      # Así no hay un segundo secreto que mantener ni contraseñas en el archivo de configuración.
      initContainers:
        - name: render-userlist
          image: "{{ .Values.pgbouncer.image.repository }}{{ if .Values.pgbouncer.image.digest }}{{ if .Values.pgbouncer.image.tag }}:{{ .Values.pgbouncer.image.tag }}{{ end }}@{{ .Values.pgbouncer.image.digest }}{{ else }}:{{ .Values.pgbouncer.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.pgbouncer.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              umask 077
              # En un userlist de PgBouncer las comillas dobles se escapan duplicándolas.
              esc() { printf '%s' "$1" | sed 's/"/""/g'; }
              printf '"%s" "%s"\n' "$(esc "${PGB_USER}")" "$(esc "${PGB_PASSWORD}")" > /auth/userlist.txt
          env:
            - name: PGB_USER
              valueFrom:
                configMapKeyRef:
                  name: pokemon-config
                  key: POSTGRES_USER
            - name: PGB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pokedex.secretName" . }}
                  key: POSTGRES_PASSWORD
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "50m"
              memory: "32Mi"
              ephemeral-storage: "16Mi"
            requests:
              cpu: "10m"
              memory: "16Mi"
              ephemeral-storage: "16Mi"
          volumeMounts:
            - mountPath: /auth
              name: auth-volume
      containers:
        - name: pgbouncer
          image: "{{ .Values.pgbouncer.image.repository }}{{ if .Values.pgbouncer.image.digest }}{{ if .Values.pgbouncer.image.tag }}:{{ .Values.pgbouncer.image.tag }}{{ end }}@{{ .Values.pgbouncer.image.digest }}{{ else }}:{{ .Values.pgbouncer.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.pgbouncer.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 5
          ports:
            - containerPort: 6432
              name: pgbouncer
          # Variables de la imagen oficial `pgbouncer/pgbouncer`: DATABASES_* define el servidor y
          # PGBOUNCER_* el archivo de configuración (/opt/pgbouncer/entrypoint.sh).
          env:
            - name: DATABASES_HOST
              value: "postgres-service"
            - name: DATABASES_PORT
              value: {{ .Values.postgresql.port | quote }}
            - name: DATABASES_USER
              valueFrom:
                configMapKeyRef:
                  name: pokemon-config
                  key: POSTGRES_USER
            # Sin DATABASES_PASSWORD: PgBouncer usa para el servidor la contraseña del `userlist`.
            - name: DATABASES_DBNAME
              valueFrom:
                configMapKeyRef:
                  name: pokemon-config
                  key: POSTGRES_DB
            # Los clientes solo pueden pedir la base de la aplicación (por defecto sería `*`).
            - name: DATABASES_CLIENT_SIDE_DBNAME
              valueFrom:
                configMapKeyRef:
                  name: pokemon-config
                  key: POSTGRES_DB
            - name: PGBOUNCER_LISTEN_PORT
              value: "6432"
            - name: PGBOUNCER_AUTH_TYPE
              value: "scram-sha-256"
            - name: PGBOUNCER_AUTH_FILE
              value: "/auth/userlist.txt"
            # Sin consola de administración: ningún usuario del `userlist` figura como admin.
            - name: PGBOUNCER_ADMIN_USERS
              value: "pgbouncer_admin"
            - name: PGBOUNCER_POOL_MODE
              value: {{ .Values.pgbouncer.poolMode | quote }}
            - name: PGBOUNCER_MAX_CLIENT_CONN
              value: {{ .Values.pgbouncer.maxClientConn | quote }}
            - name: PGBOUNCER_DEFAULT_POOL_SIZE
              value: {{ .Values.pgbouncer.defaultPoolSize | quote }}
          resources:
            limits:
              cpu: {{ .Values.pgbouncer.resources.limits.cpu | default "250m" | quote }}
              memory: {{ .Values.pgbouncer.resources.limits.memory | default "256Mi" | quote }}
              ephemeral-storage: {{ index .Values.pgbouncer.resources.limits "ephemeral-storage" | default "256Mi" | quote }}
            requests:
              cpu: {{ .Values.pgbouncer.resources.requests.cpu | default "50m" | quote }}
              memory: {{ .Values.pgbouncer.resources.requests.memory | default "64Mi" | quote }}
              ephemeral-storage: {{ index .Values.pgbouncer.resources.requests "ephemeral-storage" | default "64Mi" | quote }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
            # El entrypoint genera aquí pgbouncer.ini (sin contraseñas).
            - mountPath: /etc/pgbouncer
              name: config-volume
            - mountPath: /auth
              name: auth-volume
              readOnly: true
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: config-volume
          emptyDir: {}
        - name: auth-volume
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
{{- end }}
