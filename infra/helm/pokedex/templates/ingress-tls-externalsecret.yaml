{{- /*
AUD-SEC-TLS-001: certificado del ingress sincronizado desde Vault por ESO para
entornos sin cert-manager (Proxmox con CA interna). El Secret resultante es de
tipo kubernetes.io/tls y toma el nombre del primer bloque de `ingress.tls`.
*/ -}}
{{- if and .Values.ingress.enabled .Values.ingress.tlsExternalSecret .Values.ingress.tlsExternalSecret.enabled }}
{{- $tls := required "ingress.tlsExternalSecret requiere al menos un bloque en ingress.tls" (first .Values.ingress.tls) }}
{{- $ref := .Values.ingress.tlsExternalSecret.remoteRef }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "pokedex.fullname" . }}-ingress-tls
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name | default "vault-backend" }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ required "ingress.tls[0].secretName es obligatorio" $tls.secretName }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: {{ required "ingress.tlsExternalSecret.remoteRef.key es obligatorio" $ref.key }}
        property: {{ $ref.certProperty | default "TLS_CRT" }}
    - secretKey: tls.key
      remoteRef:
        key: {{ $ref.key }}
        property: {{ $ref.keyProperty | default "TLS_KEY" }}
{{- end }}
