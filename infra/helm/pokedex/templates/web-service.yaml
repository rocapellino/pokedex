apiVersion: v1
kind: Service
metadata:
  name: pokemon-web-svc
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "pokedex.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
