{{- if .Values.seedJob.enabled }}
{{- /*
Siembra del catálogo (ADR-030).

- Hook PostSync / post-install,post-upgrade: corre cuando PostgreSQL, Redis y
  la API ya están sanos. Como PreSync corría antes de crear el StatefulSet de
  PostgreSQL, fallaba en la primera instalación.
- Imagen: por defecto, la misma de la API (mismo digest firmado con Cosign):
  `dist/seed.cjs` forma parte de su build. `seedJob.image.repository` solo se
  declara para usar una imagen distinta.
- Entorno: el mismo ConfigMap y Secret que la API.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pokedex.fullname" . }}-db-seed
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-seeder
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "pokedex.selectorLabels" . | nindent 8 }}
        app: pokemon-db-seed
        app.kubernetes.io/component: db-seeder
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-seeder
          image: "{{ if .Values.seedJob.image.repository }}{{ .Values.seedJob.image.repository }}{{ if .Values.seedJob.image.digest }}@{{ .Values.seedJob.image.digest }}{{ else }}:{{ .Values.seedJob.image.tag | default .Chart.AppVersion }}{{ end }}{{ else }}{{ .Values.api.image.repository }}{{ if .Values.api.image.digest }}@{{ .Values.api.image.digest }}{{ else }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}{{ end }}{{ end }}"
          imagePullPolicy: {{ .Values.seedJob.image.pullPolicy | default .Values.api.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ["node", "dist/seed.cjs"]
          envFrom:
            - configMapRef:
                name: pokemon-config
            - secretRef:
                name: {{ include "pokedex.secretName" . }}
          env:
            - name: SEED_DATASET
              value: {{ .Values.seedJob.dataset | default "sample" | quote }}
            - name: FORCE_SEED
              value: {{ .Values.seedJob.forceSeed | default false | quote }}
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
              ephemeral-storage: 50Mi
            limits:
              cpu: 1000m
              memory: 1Gi
              ephemeral-storage: 256Mi
{{- end }}
