{{- if and .Values.backup .Values.backup.enabled .Values.backup.gdrive .Values.backup.gdrive.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "pokedex.fullname" . }}-gdrive-sync
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup-offsite
spec:
  schedule: "{{ .Values.backup.gdrive.schedule | default "0 3 * * *" }}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "pokedex.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup-offsite
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: gdrive-sync
              image: "{{ .Values.backup.gdrive.image.repository | default "rclone/rclone" }}{{ if .Values.backup.gdrive.image.digest }}@{{ .Values.backup.gdrive.image.digest }}{{ else }}:{{ .Values.backup.gdrive.image.tag | default "1.68.2" }}{{ end }}"
              imagePullPolicy: {{ .Values.backup.gdrive.image.pullPolicy | default "IfNotPresent" }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: RCLONE_CONFIG_GDRIVE_TYPE
                  value: "drive"
                - name: GDRIVE_FOLDER
                  value: "{{ .Values.backup.gdrive.folder | default "PokedexBackups/proxmox" }}"
                - name: RCLONE_CONFIG_GDRIVE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.gdrive.secretName | default (include "pokedex.secretName" .) }}
                      key: {{ .Values.backup.gdrive.tokenKey | default "GDRIVE_TOKEN" }}
                      optional: false
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  : "${RCLONE_CONFIG_GDRIVE_TOKEN:?GDRIVE_TOKEN is mandatory when gdrive backup is enabled}"
                  echo "☁️ [DR Off-Site] Sincronizando volcados cifrados desde PVC hacia Google Drive (gdrive:${GDRIVE_FOLDER})..."
                  rclone sync /backups "gdrive:${GDRIVE_FOLDER}" --include "pokedex_*.sql.gz.enc*" --include "*.sha256" --verbose
                  echo "✅ [DR Off-Site] ¡Sincronización a Google Drive completada exitosamente!"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml .Values.backup.gdrive.resources | nindent 16 }}
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: {{ include "pokedex.fullname" . }}-backup-pvc
            - name: tmp
              emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pokedex.fullname" . }}-allow-gdrive-sync-egress
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup-offsite
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backup-offsite
  policyTypes:
    - Egress
  egress:
    # 1. Resolución DNS interna en CoreDNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. Fallback L4 Anti-SSRF para clústeres sin Cilium (Flannel / Calico básico).
    # En clústeres con Cilium activo, el filtrado granular se delega a CiliumNetworkPolicy L7 FQDN
    # para evitar abrir puertos genéricos 443 hacia cualquier destino.
    {{- if not (and .Values.ciliumNetworkPolicy .Values.ciliumNetworkPolicy.enabled) }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32 # AWS/GCP/Azure IMDS Metadata Endpoint (Anti-SSRF)
              - 10.0.0.0/8         # RFC1918 Red Privada
              - 172.16.0.0/12      # RFC1918 Red Privada / K8s internal subnets
              - 192.168.0.0/16     # RFC1918 Red Privada
              - 127.0.0.0/8        # Loopback
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- if and .Values.ciliumNetworkPolicy .Values.ciliumNetworkPolicy.enabled }}
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "pokedex.fullname" . }}-gdrive-sync-cilium-l7-policy
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup-offsite
spec:
  description: "Aislamiento de Capa 7 (L7 Egress) con Cilium eBPF y FQDN Allowlist para Google Drive Sync (Rclone)"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: backup-offsite
  egress:
    # 1. Resolución DNS interna en CoreDNS con inspección de nombres
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # 2. Tráfico Saliente HTTPS L7 restringido estrictamente a FQDNs autorizados de Google Drive
    - toFQDNs:
        {{- if and .Values.backup.gdrive.fqdnAllowlist }}
        {{- toYaml .Values.backup.gdrive.fqdnAllowlist | nindent 8 }}
        {{- else }}
        - matchPattern: "*.googleapis.com"
        - matchName: "accounts.google.com"
        {{- end }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
{{- end }}

