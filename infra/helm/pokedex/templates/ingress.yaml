{{- if .Values.ingress.enabled -}}
{{- /*
AUD-SEC-TLS-001: las anotaciones de ingress-nginx solo aplican con className nginx
y las de cert-manager no deben competir con el Secret que entrega ESO. Fuera de
esos casos se omiten para que el render refleje la configuración efectiva.
*/ -}}
{{- $className := .Values.ingress.className | default "" }}
{{- $tlsViaEso := and .Values.ingress.tlsExternalSecret .Values.ingress.tlsExternalSecret.enabled }}
{{- $annotations := dict }}
{{- range $key, $value := .Values.ingress.annotations }}
{{- $foreignNginx := and (ne $className "nginx") (hasPrefix "nginx.ingress.kubernetes.io/" $key) }}
{{- $foreignCertManager := and $tlsViaEso (hasPrefix "cert-manager.io/" $key) }}
{{- if not (or $foreignNginx $foreignCertManager) }}
{{- $_ := set $annotations $key $value }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pokedex.fullname" . }}-ingress
  labels:
    {{- include "pokedex.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  {{- with $annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    {{- if .host }}
    - host: {{ .host | quote }}
      http:
    {{- else }}
    - http:
    {{- end }}

        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ .backend.service.name }}
                port:
                  number: {{ .backend.service.port.number }}
          {{- end }}
    {{- end }}
{{- end }}
