#cloud-config
# ==============================================================================
# Cloud-Init User Data para Aprovisionamiento Base de Nodo en Proxmox VE (VM / LXC)
# ==============================================================================
# NOTA ARQUITECTÓNICA:
# Este template aprovisiona exclusivamente el sistema operativo base, runtime
# de contenedores y hardening de red. La configuración y unión al clúster se
# delegan a Ansible (host_baseline.yml) y el despliegue de la app a Kubernetes/Helm.
# ==============================================================================

hostname: pokedex-node
manage_etc_hosts: true

users:
  - name: devops
    gecos: DevOps Engineer
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: [docker, sudo]
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleKeyDevOpsProxmoxPokédex user@proxmox"

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git
  - ufw
  - htop
  - python3
  - python3-apt
  - net-tools

write_files:
  - path: /etc/sysctl.d/99-kubernetes.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.ipv4.ip_forward                 = 1
      net.bridge.bridge-nf-call-ip6tables = 1

runcmd:
  # 1. Configurar módulos de kernel para Kubernetes / Containers
  - modprobe overlay
  - modprobe br_netfilter
  - sysctl --system

  # 2. Instalar Container Runtime (Docker CE / containerd)
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io

  # 3. Habilitar y arrancar servicio de contenedores
  - systemctl enable --now docker

  # 4. Hardening Perimetral de Firewall (UFW)
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment 'SSH Gestión'
  - ufw --force enable

  # 5. Registro de inicialización completada
  - echo "✅ Nodo Proxmox aprovisionado con éxito. Listo para Ansible baseline y Kubernetes." > /var/log/pokedex-bootstrap.log
