# ==============================================================================
# Grafana Cloud: k8s-monitoring Values (esquema v4)
# Chart: https://grafana.github.io/helm-charts (k8s-monitoring)
# La version del chart se fija en scripts/deploy-grafana-cloud.mjs (DEFAULTS.chartVersion)
# y el contrato de render lo valida tests/contracts/observability/grafana_cloud_collection.test.ts.
# ==============================================================================

cluster:
  name: "pokedex-k8s-cluster"

# ------------------------------------------------------------------------------
# Destinos declarados en el repo (SSOT). El receptor OTLP se replica tal cual desde
# `collectors.alloy.extraConfig` (misma configuración que corría en pre-prod con el chart simple
# `alloy`) para no renombrar las series que usan dashboards y alertas. Los logs de pods usan la
# función nativa `podLogsViaLoki`: los dashboards solo filtran por `namespace` y `container`.
# ------------------------------------------------------------------------------
destinations:
  grafana-cloud-metrics:
    type: prometheus
    url: "https://prometheus-prod-40-prod-sa-east-1.grafana.net/api/prom/push"
    auth:
      type: basic
      # ID de la instancia Prometheus del stack (basicAuthUser de grafanacloud-prom).
      username: "3589862"
      # El token (Access Policy con metrics:write) se inyecta con --set-file desde
      # scripts/deploy-grafana-cloud.mjs; nunca se versiona.
  # Logs de pods y OTLP. El chart emite `loki.write.grafana_cloud_logs` porque `podLogsViaLoki` lo usa;
  # el receptor OTLP del extraConfig reenvía sus logs a ese mismo componente.
  grafana-cloud-logs:
    type: loki
    url: "https://logs-prod-024.grafana.net/loki/api/v1/push"
    auth:
      type: basic
      # ID de la instancia Loki del stack (GRAFANA_CLOUD_LOKI_USER).
      username: "1790605"
      # Se inyecta con --set-file; el token necesita además el scope logs:write.

# ------------------------------------------------------------------------------
# Metricas del cluster: cAdvisor, kubelet y kube-state-metrics.
# Las allowlists por defecto se amplian con las metricas que consulta
# infra/monitoring/alerts.yaml y que el chart descarta de fabrica.
# ------------------------------------------------------------------------------
clusterMetrics:
  enabled: true
  collector: alloy
  cadvisor:
    metricsTuning:
      includeMetrics:
        - container_spec_memory_limit_bytes
  kube-state-metrics:
    metricsTuning:
      includeMetrics:
        - kube_job_status_failed
        - kube_cronjob_status_last_successful_time

# Logs de los pods de la aplicación y del propio stack de monitoreo (los mismos namespaces que
# recolectaba el Alloy previo). Etiquetas resultantes: namespace, pod, container, app_kubernetes_io_name.
podLogsViaLoki:
  enabled: true
  collector: alloy
  destinations:
    - grafana-cloud-logs
  namespaces:
    - pokemon-app
    - monitoring

# Metricas de host del nodo K3s (node-exporter desplegado en telemetryServices).
hostMetrics:
  enabled: true
  collector: alloy
  linuxHosts:
    enabled: true

collectorCommon:
  alloy:
    remoteConfig:
      enabled: true
      url: "https://fleet-management-prod-015.grafana.net"
      auth:
        type: "basic"
        username: "1832819"
        # La contraseña (token de Access Policy) se inyecta con --set-file desde el script

collectors:
  # El nombre `alloy` produce el colector `grafana-cloud-alloy`, el Service al que la
  # API envia OTLP (infra/helm/pokedex/values.yaml: otelEndpoint). No renombrar sin
  # actualizar ese endpoint.
  alloy:
    presets:
      - large
      - root
      - host-storage
      - host-network
      - host-cgroup
      - clustered
      - service-discovery
      - filesystem-log-reader
      - daemonset
    # Scrape de /metrics de la API de Pokédex. La API exige un token Bearer cuando define
    # METRICS_BEARER_TOKEN (AUD-SEC-OBS-001); el Alloy lo toma de un Secret de este namespace.
    # El job resultante sigue siendo `prometheus.scrape.pokemon_api`: dashboards y alertas no cambian.
    extraConfig: |
      prometheus.scrape "pokemon_api" {
        targets = [
          {
            "__address__"      = "pokemon-api-svc.pokemon-app.svc.cluster.local:3000",
            "__metrics_path__" = "/metrics",
            "app"              = "pokemon-api",
            "instance"         = "pokedex-k8s-node",
            "environment"      = "onprem-proxmox",
            "cluster"          = "pokedex-k8s-cluster",
          },
        ]
        authorization {
          type        = "Bearer"
          credentials = sys.env("METRICS_BEARER_TOKEN")
        }
        forward_to      = [prometheus.remote_write.grafana_cloud_metrics.receiver]
        scrape_interval = "15s"
      }

      // Receptor OTLP (gRPC :4317 / HTTP :4318). La API envía aquí métricas y logs; las trazas
      // no se reenvían (igual que en el despliegue previo con el chart `alloy`).
      otelcol.receiver.otlp "pokedex_otlp" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          metrics = [otelcol.exporter.prometheus.pokedex_otlp.input]
          logs    = [otelcol.exporter.loki.pokedex_otlp.input]
        }
      }

      otelcol.exporter.prometheus "pokedex_otlp" {
        forward_to = [prometheus.remote_write.grafana_cloud_metrics.receiver]
      }

      otelcol.exporter.loki "pokedex_otlp" {
        forward_to = [loki.write.grafana_cloud_logs.receiver]
      }
    alloy:
      alloy:
        # El preset `large` reserva 1 GiB y 2 CPU; un nodo único de laboratorio (5 GiB) no lo necesita.
        resources:
          requests:
            cpu: 200m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 1Gi
        extraEnv:
          - name: METRICS_BEARER_TOKEN
            valueFrom:
              secretKeyRef:
                name: alloy-metrics-token
                key: METRICS_BEARER_TOKEN
        # Puertos del receptor OTLP que hoy configura Fleet Management.
        extraPorts:
          - name: otlp-grpc
            port: 4317
            targetPort: 4317
            protocol: TCP
          - name: otlp-http
            port: 4318
            targetPort: 4318
            protocol: TCP

telemetryServices:
  node-exporter:
    deploy: true

  kube-state-metrics:
    deploy: true

  # Beyla (eBPF) queda apagado: el nodo K3s de pre-prod es un LXC sin privilegios de host
  # (kernel compartido con Proxmox), donde eBPF no está garantizado. Reactivar solo tras probarlo.
  beyla:
    deploy: false

# ------------------------------------------------------------------------------
# Token de /metrics (AUD-SEC-OBS-001). El Secret `pokemon-secrets` vive en `pokemon-app` y un pod no
# lee Secrets de otro namespace, así que se sincroniza otra copia en `monitoring` desde la misma
# propiedad de Vault. Crear la propiedad ANTES de instalar (`vault kv patch secret/pokedex/preprod
# METRICS_BEARER_TOKEN=...`): sin ella el ExternalSecret falla y el Alloy no arranca con la variable.
# ------------------------------------------------------------------------------
extraObjects:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: alloy-metrics-token
      namespace: monitoring
      labels:
        app.kubernetes.io/part-of: pokedex-platform
        app.kubernetes.io/component: observability
    spec:
      refreshInterval: "1h"
      secretStoreRef:
        name: vault-backend-preprod
        kind: ClusterSecretStore
      target:
        name: alloy-metrics-token
        creationPolicy: Owner
      data:
        - secretKey: METRICS_BEARER_TOKEN
          remoteRef:
            key: pokedex/preprod
            property: METRICS_BEARER_TOKEN
