apiVersion: v1
kind: Service
metadata:
  name: pokemon-api-svc
  namespace: pokemon-app
  labels:
    app: pokemon-api
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
    - port: 5000
      targetPort: 3000
      name: http-compat
  selector:
    app: pokemon-api
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: pokemon-app
  labels:
    app: pokemon-api
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
    - port: 5000
      targetPort: 3000
      name: http-compat
  selector:
    app: pokemon-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokemon-api
  namespace: pokemon-app
  labels:
    app: pokemon-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pokemon-api
  template:
    metadata:
      labels:
         app: pokemon-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: pokedex-server:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: pokemon-config
            - secretRef:
                name: pokemon-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
