apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pokemon-ingress
  namespace: pokemon-app
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/server-snippet: "more_clear_headers Server;"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pokedex.local
      secretName: pokemon-tls-secret
  rules:
    - http:
        paths:
          # Rutas API (Backend)
          - path: /api/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: pokemon-api-svc
                port:
                  number: 5000
          - path: /pokemons/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: pokemon-api-svc
                port:
                  number: 5000
          # Ruta Frontend Web (SPA)
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: pokemon-web-svc
                port:
                  number: 8080
