apiVersion: v1
kind: ConfigMap
metadata:
  name: pokemon-config
  namespace: pokemon-app
data:
  PORT: "5000"
  FLASK_ENV: "production"
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "pokedex_db"
  DATABASE_URL: "postgresql://postgres:postgres@postgres-service:5432/pokedex_db"
  REDIS_URL: "redis://redis-service:6379/0"
---
apiVersion: v1
kind: Secret
metadata:
  name: pokemon-secrets
  namespace: pokemon-app
type: Opaque
stringData:
  POSTGRES_DB: pokedex_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres_secure_password_k8s
