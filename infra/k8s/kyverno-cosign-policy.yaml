apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: check-pokedex-cosign-signature
  annotations:
    policies.kyverno.io/title: Verify Cosign Signature for Pokédex Images
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Verifica que las imágenes de contenedor de la Pokédex provenientes de GHCR
      estén firmadas criptográficamente con Cosign usando el emisor OIDC de GitHub Actions
      y el repositorio rocapellino/pokedex en modo keyless (Sigstore).
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-pokedex-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/rocapellino/pokedex:*"
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subject: "https://github.com/rocapellino/pokedex/.github/workflows/ci.yml@refs/heads/main"
                    rekor:
                      url: "https://rekor.sigstore.dev"
