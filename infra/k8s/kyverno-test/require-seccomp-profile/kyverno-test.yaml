apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-seccomp-profile-test
policies:
  - ../../policies/require-seccomp-profile.yaml
resources:
  - resources.yaml
results:
  - policy: require-seccomp-profile
    rule: check-seccomp-profile
    kind: Pod
    resources:
      - seccomp-pod-valid
    result: pass
  - policy: require-seccomp-profile
    rule: check-seccomp-profile
    kind: Pod
    resources:
      - seccomp-pod-invalid
    result: fail
