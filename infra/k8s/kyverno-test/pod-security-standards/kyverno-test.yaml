apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pod-security-standards-test
policies:
  - ../../policies/pod-security-standards.yaml
resources:
  - resources.yaml
results:
  - policy: pod-security-standards
    rule: disallow-privilege-escalation
    kind: Pod
    resources:
      - pss-pod-valid
    result: pass
  - policy: pod-security-standards
    rule: require-readonly-rootfs
    kind: Pod
    resources:
      - pss-pod-valid
    result: pass
  - policy: pod-security-standards
    rule: require-drop-all-capabilities
    kind: Pod
    resources:
      - pss-pod-valid
    result: pass
  - policy: pod-security-standards
    rule: disallow-privilege-escalation
    kind: Pod
    resources:
      - pss-pod-invalid-escalation
    result: fail
  - policy: pod-security-standards
    rule: disallow-privileged-containers
    kind: Pod
    resources:
      - pss-pod-invalid-privileged
    result: fail
