# ==============================================================================
# External Secrets Operator (ESO) - ClusterSecretStores Canónicos
# AWS:     ClusterSecretStore/aws-secrets-manager -> AWS Secrets Manager
# Proxmox: ClusterSecretStore/vault-backend       -> HashiCorp Vault
# ==============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    app.kubernetes.io/name: pokedex
    app.kubernetes.io/component: secrets-management
    environment: proxmox-prod
spec:
  provider:
    vault:
      server: "https://10.10.13.110:8200"
      path: "secret"
      version: "v2"
      caProvider:
        type: ConfigMap
        name: vault-ca
        key: ca.crt
        namespace: external-secrets
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "pokedex-prod-role"
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend-preprod
  labels:
    app.kubernetes.io/name: pokedex
    app.kubernetes.io/component: secrets-management
    environment: proxmox-preprod
spec:
  provider:
    vault:
      server: "https://10.10.13.110:8200"
      path: "secret"
      version: "v2"
      caProvider:
        type: ConfigMap
        name: vault-ca
        key: ca.crt
        namespace: external-secrets
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "pokedex-preprod-role"
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/name: pokedex
    app.kubernetes.io/component: secrets-management
    environment: aws
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
