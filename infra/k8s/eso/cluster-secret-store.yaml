# ==============================================================================
# External Secrets Operator (ESO) - ClusterSecretStores Canónicos
# Proxmox pre-prod:         ClusterSecretStore/vault-backend-preprod -> HashiCorp Vault
#
# Prod cloud (blueprint, ADR-030) no declara su store aquí: el override
# gitops/environments/cloud/values.yaml referencia `cloud-secret-store`, y el
# manifiesto se crea al activar el entorno con el backend del proveedor elegido.
# ==============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend-preprod
  labels:
    app.kubernetes.io/name: pokedex
    app.kubernetes.io/component: secrets-management
    environment: proxmox-preprod
spec:
  provider:
    vault:
      server: "https://10.10.13.110:8200"
      path: "secret"
      version: "v2"
      caProvider:
        type: ConfigMap
        name: vault-ca
        key: ca.crt
        namespace: external-secrets
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "pokedex-preprod-role"
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
