apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pokedex-credentials-sync
  namespace: pokedex
  labels:
    app.kubernetes.io/name: pokedex
    app.kubernetes.io/part-of: pokedex-platform
    app.kubernetes.io/component: secrets-management
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: pokedex-secret-store
    kind: ClusterSecretStore
  target:
    name: pokedex-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: pokedex/production/database
        property: password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: pokedex/production/redis
        property: password
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: pokedex/production/ai
        property: api_key
    - secretKey: SESSION_SECRET
      remoteRef:
        key: pokedex/production/auth
        property: session_secret
