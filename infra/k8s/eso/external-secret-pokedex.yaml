apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pokedex-credentials-sync
  namespace: pokemon-app
  labels:
    app.kubernetes.io/name: pokedex
    app.kubernetes.io/part-of: pokedex-platform
    app.kubernetes.io/component: secrets-management
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: pokemon-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: pokedex/production
        property: POSTGRES_PASSWORD
    - secretKey: ADMIN_API_KEY
      remoteRef:
        key: pokedex/production
        property: ADMIN_API_KEY
    - secretKey: ADMIN_SESSION_SECRET
      remoteRef:
        key: pokedex/production
        property: ADMIN_SESSION_SECRET
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: pokedex/production
        property: REDIS_PASSWORD
    - secretKey: REDIS_URL
      remoteRef:
        key: pokedex/production
        property: REDIS_URL
    - secretKey: DATABASE_URL
      remoteRef:
        key: pokedex/production
        property: DATABASE_URL
    - secretKey: AI_API_KEY
      remoteRef:
        key: pokedex/production
        property: AI_API_KEY
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: pokedex/production
        property: GEMINI_API_KEY
    - secretKey: BACKUP_ENCRYPTION_KEY
      remoteRef:
        key: pokedex/production
        property: BACKUP_ENCRYPTION_KEY
