apiVersion: batch/v1
kind: Job
metadata:
  name: pokemon-db-seed-job
  namespace: pokemon-app
  labels:
    app: pokemon-db-seed
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: pokemon-db-seed
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-seeder
          image: pokedex-server:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "-e", "console.log('Seed catalog verified and bootstrapped in native service.')"]
          envFrom:
            - configMapRef:
                name: pokemon-config
            - secretRef:
                name: pokemon-secrets
          env:
            - name: POKEMON_LIMIT
              value: "1025"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
