# ==============================================================================
# Configuración Declarativa de Clúster Kubernetes Local (Kind)
# ==============================================================================
# Proporciona un entorno Kubernetes conformante local para desarrollo y pruebas
# idéntico a producción (Ingress, NetworkPolicies, Helm Hooks, Probes y RBAC).
# ==============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pokedex-local
nodes:
  - role: control-plane
    image: kindest/node:v1.29.2
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Ingress HTTP -> localhost:8080
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      # Ingress HTTPS -> localhost:8443
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
      # NodePort directo API -> localhost:3000
      - containerPort: 30000
        hostPort: 3000
        protocol: TCP
