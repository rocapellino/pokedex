apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all-ingress
  namespace: pokemon-app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# ==============================================================================
# 1. Regla para Frontend Web: Acepta tráfico HTTP desde el exterior / Ingress
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-ingress
  namespace: pokemon-app
spec:
  podSelector:
    matchLabels:
      app: pokemon-web
  policyTypes:
    - Ingress
  ingress:
    - from: [] # Permite tráfico entrante desde el Ingress Controller / LoadBalancer
      ports:
        - protocol: TCP
          port: 80
---
# ==============================================================================
# 2. Regla para Backend API: Solo acepta tráfico desde pods 'web' y 'ingress'
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
  namespace: pokemon-app
spec:
  podSelector:
    matchLabels:
      app: pokemon-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pokemon-web
        - namespaceSelector: {} # Permite tráfico desde ingress-nginx namespace
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 5000
---
# ==============================================================================
# 3. Regla para PgBouncer: Solo acepta tráfico desde pods 'pokemon-api' y seed job
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pgbouncer-ingress
  namespace: pokemon-app
spec:
  podSelector:
    matchLabels:
      app: pgbouncer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pokemon-api
        - podSelector:
            matchLabels:
              app: pokemon-db-seed
      ports:
        - protocol: TCP
          port: 5432
---
# ==============================================================================
# 4. Regla para PostgreSQL: Solo acepta tráfico desde PgBouncer, API y Seed Job
#    (BLOQUEA completamente cualquier intento de acceso directo desde Web o Internet)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress
  namespace: pokemon-app
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pgbouncer
        - podSelector:
            matchLabels:
              app: pokemon-api
        - podSelector:
            matchLabels:
              app: pokemon-db-seed
      ports:
        - protocol: TCP
          port: 5432
---
# ==============================================================================
# 5. Regla para Redis: Solo acepta tráfico desde pods 'pokemon-api' y Seed Job
#    (BLOQUEA completamente cualquier intento de acceso directo desde Web o Internet)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-ingress
  namespace: pokemon-app
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pokemon-api
        - podSelector:
            matchLabels:
              app: pokemon-db-seed
      ports:
        - protocol: TCP
          port: 6379
