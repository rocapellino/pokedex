[defaults]
inventory = inventories/proxmox/hosts.yaml
# INFRA-003: valor por defecto para inventarios que no declaren `ansible_user`
# por host. Los inventarios vigentes (proxmox y lab) lo declaran explicitamente en
# cada host porque OpenTofu crea usuarios distintos segun el tipo de computo:
# los LXC solo admiten claves para `root`, mientras que la VM de produccion
# declara `username = "devops"`. Este valor solo aplica a inventarios futuros
# que no declaren el usuario; la autoridad es siempre `ansible_user` por host.
remote_user = root
# INFRA-002: politica SSH = `accept-new`, declarada en UNA sola fuente de verdad
# (`ssh_args`, seccion `[ssh_connection]`). Antes coexistian `host_key_checking = True`
# y `-o StrictHostKeyChecking=accept-new`; la opcion de linea de comandos tiene
# precedencia sobre la primera, de modo que la configuracion aparentaba una politica
# mas estricta de la realmente aplicada.
#
# Motivo de la eleccion: la plataforma opera sobre un cluster efimero en Proxmox
# cuyos nodos se recrean con frecuencia (OpenTofu `vm_id` reutilizable y rotacion de
# LXC). Con verificacion estricta, cada recreacion invalidaria known_hosts y el
# playbook fallaria. `accept-new` acepta la clave de un host NUEVO y la registra,
# pero sigue RECHAZANDO una clave modificada en un host conocido, que es el vector
# de MITM y de sustitucion de host que si importa preservar.
#
# Riesgo residual asumido y aceptado: un atacante que controle la red ANTES del
# primer contacto con un host nuevo podria injectar su clave. Ese escenario exige
# acceso previo a la red de gestion, donde ya se requeriria otro vector de acceso.
# El inventario declara `ansible_user` explicito por host (INFRA-003), por lo que la
# conexion se realiza por SSH key, sin autenticacion por contrasena.
retry_files_enabled = False
forks = 5
stdout_callback = yaml
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
