---
# ==============================================================================
# Playbook: Aprovisionamiento y Centralización de Herramientas en Bastion LXC
# ==============================================================================
- name: Centralizar herramientas DevOps en el Bastion Host
  hosts: bastion_servers
  become: true
  gather_facts: true

  vars:
    # URL oficial del repositorio para orquestación interna
    pokedex_git_repo: "https://github.com/rocapellino/pokedex.git"
    pokedex_git_dest: "/opt/devops/pokedex"
    # Anclaje inmutable a Commit SHA o Tag de versión verificada (Known-Good State).
    # Previene mutabilidad y deriva (drift) al no depender de ramas flotantes como 'main' en incidentes.
    pokedex_git_version: "{{ bastion_git_commit_sha | default(bastion_git_version | default('HEAD')) }}"

  tasks:
    - name: Actualizar cache de APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Instalar paquetes esenciales de administración y red
      ansible.builtin.apt:
        name:
          - ansible
          - git
          - curl
          - wget
          - jq
          - python3
          - python3-pip
          - python3-venv
          - sshpass
          - rsync
          - dnsutils
          - netcat-openbsd
          - ca-certificates
          - gnupg
          - lsb-release
        state: present

    - name: Añadir clave GPG oficial de HashiCorp (Vault)
      ansible.builtin.get_url:
        url: https://apt.releases.hashicorp.com/gpg
        dest: /etc/apt/trusted.gpg.d/hashicorp.asc
        mode: '0644'

    - name: Añadir repositorio oficial de HashiCorp
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"
        state: present
        filename: hashicorp

    - name: Instalar cliente HashiCorp Vault
      ansible.builtin.apt:
        name: vault
        state: present
        update_cache: true

    - name: Descargar e instalar kubectl (Kubernetes CLI)
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Instalar Helm (Kubernetes Package Manager)
      ansible.builtin.shell: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Crear directorio de trabajo /opt/devops
      ansible.builtin.file:
        path: /opt/devops
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Clonar o sincronizar repositorio Pokédex anclado a Commit SHA / Tag inmutable (Break-Glass)
      ansible.builtin.git:
        repo: "{{ pokedex_git_repo }}"
        dest: "{{ pokedex_git_dest }}"
        version: "{{ pokedex_git_version }}"
        force: false
      ignore_errors: true

    # --------------------------------------------------------------------------
    # Auditoría Forense y Trazabilidad Break-Glass (ADR-025)
    # --------------------------------------------------------------------------
    - name: Crear directorio para registros de auditoría de Bastion
      ansible.builtin.file:
        path: /var/log/bastion
        state: directory
        owner: root
        group: adm
        mode: '0750'

    - name: Configurar captura de auditoría para sesiones interactivas
      ansible.builtin.copy:
        dest: /etc/profile.d/bastion-audit.sh
        owner: root
        group: root
        mode: '0644'
        content: |
          # ====================================================================
          # Auditoría de Comandos Break-Glass en Bastion Host (ADR-025)
          # ====================================================================
          export HISTTIMEFORMAT="%Y-%m-%dT%H:%M:%S%z "
          shopt -s histappend

          _bastion_audit() {
            local exit_code=$?
            local last_cmd
            last_cmd=$(HISTTIMEFORMAT="" history 1 | sed -e 's/^[ ]*[0-9]*[ ]*//')
            if [ -n "$last_cmd" ] && [ "$last_cmd" != "$_LAST_AUDITED_CMD" ]; then
              _LAST_AUDITED_CMD="$last_cmd"
              local timestamp
              timestamp=$(date --iso-8601=seconds)
              local remote_ip="${SSH_CLIENT%% *}"
              [ -z "$remote_ip" ] && remote_ip="local"
              local log_entry="[$timestamp] [BREAK-GLASS] USER=${USER} UID=${EUID} IP=${remote_ip} PWD=${PWD} EXIT=${exit_code} CMD=${last_cmd}"
              echo "$log_entry" >> /var/log/bastion/audit.log 2>/dev/null || true
              logger -p authpriv.notice -t "bastion-audit[$$]" "$log_entry" 2>/dev/null || true
            fi
          }

          if [ -z "$PROMPT_COMMAND" ]; then
            PROMPT_COMMAND="_bastion_audit"
          else
            PROMPT_COMMAND="_bastion_audit; ${PROMPT_COMMAND}"
          fi

    - name: Configurar rotación de logs de auditoría en Bastion
      ansible.builtin.copy:
        dest: /etc/logrotate.d/bastion-audit
        owner: root
        group: root
        mode: '0644'
        content: |
          /var/log/bastion/*.log {
              weekly
              missingok
              rotate 12
              compress
              delaycompress
              notifempty
              create 0640 root adm
          }
