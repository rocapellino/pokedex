---
# ==============================================================================
# Playbook: Aprovisionamiento de Host Baseline y Preparación de Nodos
# ==============================================================================
# Propósito:
#   Configurar el sistema operativo base, dependencias esenciales, runtime de
#   contenedores (Docker / containerd), tuning de kernel y hardening perimetral.
#   NO realiza despliegues de aplicación (delegado a Kubernetes + GitOps / ArgoCD).
# ==============================================================================
- name: Aprovisionamiento Base de Servidores y Nodos
  hosts: all
  become: true
  roles:
    - role: ../roles/base_os
    - role: ../roles/container_runtime
      when: install_docker | default(true)
    - role: ../roles/hardening

- import_playbook: security_hardening.yml
