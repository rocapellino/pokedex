---
# ==============================================================================
# Playbook: Despliegue Automatizado de la Pokédex (Docker Compose / K8s)
# ==============================================================================
- name: Despliegue de la Aplicación Pokédex en Servidores Standalone
  hosts: standalone_servers
  become: true
  vars:
    app_directory: /opt/pokedex
  tasks:
    - name: Asegurar que el directorio de la aplicación existe
      file:
        path: "{{ app_directory }}"
        state: directory
        mode: '0755'
        owner: "{{ ansible_user | default('ubuntu') }}"

    - name: Sincronizar archivos del proyecto (excluyendo secretos locales)
      synchronize:
        src: "{{ playbook_dir }}/../../../"
        dest: "{{ app_directory }}/"
        delete: no
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=.env"
          - "--exclude=.env.*"
          - "--include=.env.example"
          - "--exclude=.venv"
          - "--exclude=__pycache__"
          - "--exclude=node_modules"
          - "--exclude=.ruff_cache"

    - name: Asegurar archivo .env seguro en el host remoto si no existe
      shell: |
        if [ ! -f {{ app_directory }}/.env ]; then
          cp {{ app_directory }}/.env.example {{ app_directory }}/.env
          sed -i "s/ADMIN_SESSION_SECRET=.*/ADMIN_SESSION_SECRET=$(openssl rand -hex 32)/" {{ app_directory }}/.env
          sed -i "s/POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" {{ app_directory }}/.env
          sed -i "s/REDIS_PASSWORD=.*/REDIS_PASSWORD=$(openssl rand -hex 16)/" {{ app_directory }}/.env
          sed -i "s/ADMIN_API_KEY=.*/ADMIN_API_KEY=$(openssl rand -hex 24)/" {{ app_directory }}/.env
          chmod 0600 {{ app_directory }}/.env
        fi
      args:
        creates: "{{ app_directory }}/.env"

    - name: Levantar o actualizar contenedores con Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ app_directory }}"
        state: present
        build: always
        pull: always
      environment:
        NODE_ENV: "{{ env | default('production') }}"

    - name: Verificar salud del servicio Web
      uri:
        url: "http://localhost:8080/healthz"
        status_code: 200
      register: result
      until: result.status == 200
      retries: 5
      delay: 5
