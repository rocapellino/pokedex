---
# ==============================================================================
# Playbook de Ansible para Despliegue Automatizado en Proxmox VE (LXC / VM)
# ==============================================================================
- name: Desplegar Plataforma Pokédex en Proxmox VE
  hosts: proxmox_nodes:all
  become: true
  vars:
    app_dir: /opt/pokedex
    repo_url: https://github.com/rocapellino/pokedex.git
    deploy_env: prod

  tasks:
    - name: 1. Actualizar caché de paquetes APT
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: 2. Instalar paquetes prerrequisitos
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
          - ufw
        state: present

    - name: 3. Verificar si Docker ya está instalado
      command: docker --version
      register: docker_installed
      ignore_errors: true
      changed_when: false

    - name: 4. Instalar Docker y Docker Compose Plugin (si no existe)
      when: docker_installed.rc != 0
      block:
        - name: Crear directorio para keyring de Docker
          file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'

        - name: Descargar clave GPG oficial de Docker
          get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: '0644'

        - name: Agregar repositorio de Docker
          apt_repository:
            repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            state: present

        - name: Instalar Docker CE y Compose
          apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-compose-plugin
            state: present
            update_cache: yes

        - name: Asegurar servicio Docker iniciado y habilitado
          service:
            name: docker
            state: started
            enabled: yes

    - name: 5. Crear directorio de la aplicación
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: 6. Sincronizar archivos del proyecto a Proxmox (sin secretos locales)
      synchronize:
        src: "{{ playbook_dir }}/../../../"
        dest: "{{ app_dir }}"
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=.env"
          - "--exclude=.env.*"
          - "--include=.env.example"
          - "--exclude=.venv"
          - "--exclude=__pycache__"
          - "--exclude=node_modules"
          - "--exclude=.ruff_cache"

    - name: 6.1. Inicializar archivo .env seguro en Proxmox si no existe
      shell: |
        if [ ! -f {{ app_dir }}/.env ]; then
          cp {{ app_dir }}/.env.example {{ app_dir }}/.env
          sed -i "s/ADMIN_SESSION_SECRET=.*/ADMIN_SESSION_SECRET=$(openssl rand -hex 32)/" {{ app_dir }}/.env
          sed -i "s/POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" {{ app_dir }}/.env
          sed -i "s/REDIS_PASSWORD=.*/REDIS_PASSWORD=$(openssl rand -hex 16)/" {{ app_dir }}/.env
          sed -i "s/ADMIN_API_KEY=.*/ADMIN_API_KEY=$(openssl rand -hex 24)/" {{ app_dir }}/.env
          chmod 0600 {{ app_dir }}/.env
        fi
      args:
        creates: "{{ app_dir }}/.env"

    - name: 7. Desplegar Contenedores en Modo Producción con Docker Compose
      command:
        cmd: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans
        chdir: "{{ app_dir }}"
      register: compose_output

    - name: 8. Mostrar resultado del despliegue
      debug:
        var: compose_output.stdout_lines

    - name: 9. Validar Endpoint de Salud (Health Check)
      uri:
        url: "http://localhost:8080/healthz"
        status_code: 200
        return_content: yes
      register: health_check
      retries: 6
      delay: 5
      until: health_check.status == 200

    - name: 10. Confirmación de Despliegue Exitoso
      debug:
        msg: "🎉 Pokédex desplegada y operativa en Proxmox: http://{{ ansible_default_ipv4.address }}:8080/"
