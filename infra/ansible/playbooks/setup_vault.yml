---
# ==============================================================================
# Playbook: Instalación y Configuración de HashiCorp Vault (Community Edition)
# Entorno: Contenedor LXC en Proxmox VE (Debian 12 Bookworm)
# Proveedor para: External Secrets Operator (ESO) -> ClusterSecretStore/vault-backend
# ==============================================================================
- name: Setup HashiCorp Vault (Community Edition)
  hosts: vault_servers
  become: true
  tasks:
    - name: Instalar paquetes de prerrequisitos
      ansible.builtin.apt:
        name:
          - curl
          - gpg
          - lsb-release
          - jq
          - ca-certificates
        state: present
        update_cache: true

    - name: Descargar e instalar clave GPG del repositorio oficial de HashiCorp
      ansible.builtin.get_url:
        url: https://apt.releases.hashicorp.com/gpg
        dest: /usr/share/keyrings/hashicorp-archive-keyring.asc
        mode: '0644'

    - name: Convertir clave GPG de HashiCorp a formato binario
      ansible.builtin.command:
        cmd: gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg /usr/share/keyrings/hashicorp-archive-keyring.asc
        creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg

    - name: Configurar repositorio oficial de HashiCorp
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"
        state: present
        filename: hashicorp

    - name: Instalar HashiCorp Vault (Community Edition)
      ansible.builtin.apt:
        name: vault
        state: present
        update_cache: true

    - name: Crear directorio de almacenamiento de datos de Vault
      ansible.builtin.file:
        path: /opt/vault/data
        state: directory
        owner: vault
        group: vault
        mode: '0750'

    - name: Generar archivo de configuración /etc/vault.d/vault.hcl
      ansible.builtin.copy:
        dest: /etc/vault.d/vault.hcl
        owner: vault
        group: vault
        mode: '0640'
        content: |
          # Configuración HashiCorp Vault (Community Edition) en Proxmox LXC
          storage "file" {
            path = "/opt/vault/data"
          }

          listener "tcp" {
            address     = "0.0.0.0:8200"
            tls_disable = 1
          }

          api_addr      = "http://10.10.13.110:8200"
          cluster_addr  = "http://10.10.13.110:8201"
          ui            = true
          disable_mlock = true

    - name: Iniciar y habilitar el servicio de HashiCorp Vault
      ansible.builtin.systemd:
        name: vault
        enabled: true
        state: started
        daemon_reload: true

    - name: Verificar disponibilidad del endpoint de Vault
      ansible.builtin.uri:
        url: http://127.0.0.1:8200/v1/sys/health
        method: GET
        status_code:
          - 200 # Inicializado y desbloqueado
          - 501 # No inicializado (esperado tras primer arranque)
          - 503 # Sellado (esperado antes del unseal)
      register: vault_health
      retries: 10
      delay: 2
      until: vault_health.status in [200, 501, 503]

    - name: Inicializar HashiCorp Vault si es el primer arranque
      ansible.builtin.command:
        cmd: vault operator init -key-shares=1 -key-threshold=1 -format=json
      environment:
        VAULT_ADDR: "http://127.0.0.1:8200"
      register: vault_init_raw
      when: vault_health.status == 501
      changed_when: true

    - name: Guardar credenciales maestras en archivo local protegido
      ansible.builtin.copy:
        dest: /etc/vault.d/vault-init.json
        owner: root
        group: root
        mode: '0600'
        content: "{{ vault_init_raw.stdout }}"
      when: vault_health.status == 501

    - name: Verificar si existe archivo de credenciales de inicialización
      ansible.builtin.stat:
        path: /etc/vault.d/vault-init.json
      register: vault_init_file

    - name: Leer credenciales de inicialización si existen
      ansible.builtin.slurp:
        src: /etc/vault.d/vault-init.json
      register: vault_init_slurped
      when: vault_init_file.stat.exists

    - name: Parsear credenciales de inicialización
      ansible.builtin.set_fact:
        vault_creds: "{{ vault_init_slurped.content | b64decode | from_json }}"
      when: vault_init_file.stat.exists

    - name: Desbloquear (Unseal) HashiCorp Vault si está sellado
      ansible.builtin.command:
        cmd: "vault operator unseal {{ vault_creds.unseal_keys_b64[0] }}"
      environment:
        VAULT_ADDR: "http://127.0.0.1:8200"
      when:
        - vault_init_file.stat.exists
        - vault_health.status == 503 or (vault_init_raw is defined and vault_init_raw.changed)
      changed_when: true

    - name: Habilitar Secrets Engine KV versión 2 en secret/
      ansible.builtin.command:
        cmd: vault secrets enable -version=2 -path=secret kv
      environment:
        VAULT_ADDR: "http://127.0.0.1:8200"
        VAULT_TOKEN: "{{ vault_creds.root_token }}"
      when: vault_init_file.stat.exists
      register: kv_enable
      failed_when: false
      changed_when: kv_enable.rc == 0

    - name: Generar política de acceso pokedex-policy para la aplicación
      ansible.builtin.copy:
        dest: /etc/vault.d/pokedex-policy.hcl
        owner: root
        group: root
        mode: '0640'
        content: |
          # Política de solo lectura para la aplicación Pokédex
          path "secret/data/pokedex/*" {
            capabilities = ["read"]
          }
          path "secret/metadata/pokedex/*" {
            capabilities = ["read", "list"]
          }

    - name: Aplicar política pokedex-policy en Vault
      ansible.builtin.command:
        cmd: vault policy write pokedex-policy /etc/vault.d/pokedex-policy.hcl
      environment:
        VAULT_ADDR: "http://127.0.0.1:8200"
        VAULT_TOKEN: "{{ vault_creds.root_token }}"
      when: vault_init_file.stat.exists
      changed_when: true

    - name: Habilitar método de autenticación Kubernetes
      ansible.builtin.command:
        cmd: vault auth enable kubernetes
      environment:
        VAULT_ADDR: "http://127.0.0.1:8200"
        VAULT_TOKEN: "{{ vault_creds.root_token }}"
      when: vault_init_file.stat.exists
      register: k8s_auth_enable
      failed_when: false
      changed_when: k8s_auth_enable.rc == 0

    - name: Configurar rol pokedex-role para External Secrets Operator
      ansible.builtin.command:
        cmd: >
          vault write auth/kubernetes/role/pokedex-role
          bound_service_account_names=external-secrets-sa
          bound_service_account_namespaces=external-secrets
          policies=pokedex-policy
          ttl=1h
      environment:
        VAULT_ADDR: "http://127.0.0.1:8200"
        VAULT_TOKEN: "{{ vault_creds.root_token }}"
      when: vault_init_file.stat.exists
      register: role_write
      failed_when: false
      changed_when: role_write.rc == 0

