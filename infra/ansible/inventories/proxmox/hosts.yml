---
# ==============================================================================
# Inventario Proxmox VE (On-Premise) - Formato YAML Estructurado
# ==============================================================================
all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
    app_name: pokedex
    mgmt_cidr: "192.168.1.0/24"
    k8s_cluster_cidr: "192.168.1.0/24"
  children:
    k8s_control_plane:
      hosts:
        k8s-master-01:
          ansible_host: 192.168.1.10
          node_role: control-plane
    k8s_workers:
      hosts:
        k8s-worker-01:
          ansible_host: 192.168.1.11
          node_role: worker
        k8s-worker-02:
          ansible_host: 192.168.1.12
          node_role: worker
    k8s_cluster:
      children:
        k8s_control_plane:
        k8s_workers:
    standalone_servers:
      hosts:
        pokedex-prod-01:
          ansible_host: 192.168.1.20
          env: production
        pokedex-staging-01:
          ansible_host: 192.168.1.21
          env: staging
    vault_servers:
      hosts:
        vault-01:
          ansible_host: 10.10.13.110
          env: proxmox
    bastion_servers:
      hosts:
        bastion:
          ansible_host: 10.10.13.120
          env: proxmox

