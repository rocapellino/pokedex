---
# ==============================================================================
# Inventario Proxmox VE (On-Premise) - Formato YAML Estructurado
# ==============================================================================
all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
    app_name: pokedex
    mgmt_cidr: "10.10.13.0/24"
    # INFRA-009: subred de los NODOS del cluster. Sustituye a `k8s_cluster_cidr`,
    # nombre ambiguo que llego a contener el CIDR de pods de k3s. Aqui el valor ya
    # era correcto (la red de nodos coincide con la de gestion), por lo que no
    # cambia el comportamiento efectivo de las reglas del firewall.
    k8s_nodes_cidr: "10.10.13.0/24"
  children:
    k8s_control_plane:
      hosts:
        k8s-master-01:
          # LXC 800 `pokedex-k8s-node` (nodo único de pre-prod).
          ansible_host: 10.10.13.100
          # INFRA-003: los contenedores LXC de Proxmox solo admiten claves SSH
          # para la cuenta `root` (el provider no expone `username` en
          # initialization.user_account). OpenTofu no crea ningun usuario
          # privilegiado en LXC, por lo que Ansible debe conectar como root y
          # elevar con `become`. Declarar `ansible_user` explicito evita
          # depender del `remote_user` global de ansible.cfg, que no coincide
          # con este contrato.
          ansible_user: root
          node_role: control-plane
    # ADR-030: pre-prod es K3s mononodo en el LXC 800 (pokedex-k8s-node). Los workers
    # 10.10.13.101/102 nunca se aprovisionaron (relevamiento 2026-10-04). El grupo se
    # conserva vacío como punto de extensión del grupo k8s_cluster.
    k8s_workers:
      hosts: {}
    k8s_cluster:
      children:
        k8s_control_plane:
        k8s_workers:
    vault_servers:
      hosts:
        vault-01:
          ansible_host: 10.10.13.110
          ansible_user: root
          env: proxmox
    bastion_servers:
      hosts:
        bastion:
          ansible_host: 10.10.13.120
          ansible_user: root
          env: proxmox
    # ADR-030: grupo para el host hipervisor Proxmox VE (reservado para playbooks
    # a nivel host como setup_pbs_backup_blueprint y setup_gdrive_backup).
    proxmox_hosts:
      hosts: {}
# INFRA-012: se elimina el grupo `standalone_servers`. Declaraba dos hosts que
# OpenTofu no crea: `pokedex-prod-01` colisionaba en 10.10.13.100 con
# `k8s-master-01` y `pokedex-staging-01` (10.10.13.105) no existe en ningun
# recurso. Con `hosts: all` en los playbooks, el duplicado ejecutaba el
# hardening dos veces sobre el mismo host. Los recursos reales de OpenTofu son
# los nodos k3s (800+), vault (810) y bastion (820), todos declarados arriba.
