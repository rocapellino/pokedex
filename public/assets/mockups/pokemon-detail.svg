<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="detailBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.98" />
    </linearGradient>
    <filter id="modalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Darkened Background Overlay -->
  <rect width="1280" height="720" fill="#030712" fill-opacity="0.85" />

  <!-- Main Modal Container -->
  <g transform="translate(140, 40)" filter="url(#modalShadow)">
    <rect width="1000" height="640" rx="20" fill="#111827" stroke="#374151" stroke-width="1.5" />

    <!-- Modal Header -->
    <rect x="0" y="0" width="1000" height="70" rx="20" fill="#1f2937" />
    <text x="32" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800">Pikachu #025</text>
    <text x="210" y="44" fill="#eab308" font-family="sans-serif" font-size="14" font-weight="600">Ratón • Kanto</text>
    
    <!-- Close Button -->
    <circle cx="956" cy="35" r="16" fill="#374151" />
    <text x="949" y="41" fill="#9ca3af" font-family="sans-serif" font-size="18">✕</text>

    <!-- Left Column: Artwork & Bio -->
    <g transform="translate(32, 90)">
      <!-- Artwork Box -->
      <rect width="360" height="320" rx="16" fill="#1f2937" stroke="#374151" />
      <circle cx="180" cy="150" r="110" fill="#eab308" fill-opacity="0.12" />
      <image href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" x="65" y="35" width="230" height="230" />

      <!-- Types -->
      <rect x="135" y="275" width="90" height="28" rx="14" fill="#eab308" />
      <text x="150" y="294" fill="#111827" font-family="sans-serif" font-size="13" font-weight="700">Eléctrico</text>

      <!-- Description Box -->
      <rect x="0" y="340" width="360" height="175" rx="12" fill="#1f2937" stroke="#374151" />
      <text x="20" y="368" fill="#f3f4f6" font-family="sans-serif" font-size="14" font-weight="700">📖 Descripción Pokédex</text>
      <text x="20" y="400" fill="#9ca3af" font-family="sans-serif" font-size="13">Tiene pequeñas bolsas en las mejillas</text>
      <text x="20" y="422" fill="#9ca3af" font-family="sans-serif" font-size="13">donde almacena electricidad mientras</text>
      <text x="20" y="444" fill="#9ca3af" font-family="sans-serif" font-size="13">duerme. Si está en alerta, descarga chispas.</text>
      <text x="20" y="480" fill="#60a5fa" font-family="sans-serif" font-size="12">Hábitat Natural: Bosques de Kanto</text>
    </g>

    <!-- Right Column: Stats & Characteristics -->
    <g transform="translate(420, 90)">
      <!-- Base Stats Section -->
      <rect width="548" height="260" rx="14" fill="#1f2937" stroke="#374151" />
      <text x="24" y="36" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">📊 Estadísticas Base (Total: 320)</text>

      <!-- Stat Bars -->
      <!-- HP -->
      <text x="24" y="75" fill="#9ca3af" font-family="sans-serif" font-size="13">Puntos de Salud (HP)</text>
      <text x="230" y="75" fill="#f3f4f6" font-family="sans-serif" font-size="13" font-weight="700">35</text>
      <rect x="270" y="64" width="250" height="14" rx="7" fill="#374151" />
      <rect x="270" y="64" width="55" height="14" rx="7" fill="#ef4444" />

      <!-- Attack -->
      <text x="24" y="110" fill="#9ca3af" font-family="sans-serif" font-size="13">Ataque Físico</text>
      <text x="230" y="110" fill="#f3f4f6" font-family="sans-serif" font-size="13" font-weight="700">55</text>
      <rect x="270" y="99" width="250" height="14" rx="7" fill="#374151" />
      <rect x="270" y="99" width="86" height="14" rx="7" fill="#f97316" />

      <!-- Defense -->
      <text x="24" y="145" fill="#9ca3af" font-family="sans-serif" font-size="13">Defensa Física</text>
      <text x="230" y="145" fill="#f3f4f6" font-family="sans-serif" font-size="13" font-weight="700">40</text>
      <rect x="270" y="134" width="250" height="14" rx="7" fill="#374151" />
      <rect x="270" y="134" width="62" height="14" rx="7" fill="#eab308" />

      <!-- Sp Attack -->
      <text x="24" y="180" fill="#9ca3af" font-family="sans-serif" font-size="13">Ataque Especial</text>
      <text x="230" y="180" fill="#f3f4f6" font-family="sans-serif" font-size="13" font-weight="700">50</text>
      <rect x="270" y="169" width="250" height="14" rx="7" fill="#374151" />
      <rect x="270" y="169" width="78" height="14" rx="7" fill="#3b82f6" />

      <!-- Sp Defense -->
      <text x="24" y="215" fill="#9ca3af" font-family="sans-serif" font-size="13">Defensa Especial</text>
      <text x="230" y="215" fill="#f3f4f6" font-family="sans-serif" font-size="13" font-weight="700">50</text>
      <rect x="270" y="204" width="250" height="14" rx="7" fill="#374151" />
      <rect x="270" y="204" width="78" height="14" rx="7" fill="#10b981" />

      <!-- Speed -->
      <text x="24" y="250" fill="#9ca3af" font-family="sans-serif" font-size="13">Velocidad</text>
      <text x="230" y="250" fill="#f3f4f6" font-family="sans-serif" font-size="13" font-weight="700">90</text>
      <rect x="270" y="239" width="250" height="14" rx="7" fill="#374151" />
      <rect x="270" y="239" width="140" height="14" rx="7" fill="#ec4899" />

      <!-- Evolution Lineage Section -->
      <g transform="translate(0, 280)">
        <rect width="548" height="235" rx="14" fill="#1f2937" stroke="#374151" />
        <text x="24" y="32" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">⚡ Línea Evolutiva</text>

        <!-- Stage 1: Pichu -->
        <g transform="translate(30, 55)">
          <rect width="130" height="155" rx="10" fill="#111827" stroke="#374151" />
          <image href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/172.png" x="25" y="10" width="80" height="80" />
          <text x="38" y="108" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Pichu</text>
          <text x="44" y="126" fill="#9ca3af" font-family="sans-serif" font-size="11">#172</text>
          <rect x="20" y="132" width="90" height="16" rx="8" fill="#374151" />
          <text x="45" y="144" fill="#eab308" font-family="sans-serif" font-size="10">Base</text>
        </g>

        <!-- Arrow 1 -->
        <text x="180" y="135" fill="#ef4444" font-family="sans-serif" font-size="18" font-weight="800">→</text>
        <text x="165" y="152" fill="#9ca3af" font-family="sans-serif" font-size="9">Amistad</text>

        <!-- Stage 2: Pikachu (Active) -->
        <g transform="translate(210, 55)">
          <rect width="130" height="155" rx="10" fill="#111827" stroke="#eab308" stroke-width="2" />
          <image href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" x="25" y="10" width="80" height="80" />
          <text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Pikachu</text>
          <text x="44" y="126" fill="#9ca3af" font-family="sans-serif" font-size="11">#025</text>
          <rect x="20" y="132" width="90" height="16" rx="8" fill="#eab308" />
          <text x="36" y="144" fill="#111827" font-family="sans-serif" font-size="10" font-weight="700">Actual (Fase 1)</text>
        </g>

        <!-- Arrow 2 -->
        <text x="360" y="135" fill="#ef4444" font-family="sans-serif" font-size="18" font-weight="800">→</text>
        <text x="345" y="152" fill="#9ca3af" font-family="sans-serif" font-size="9">Piedra Trueno</text>

        <!-- Stage 3: Raichu -->
        <g transform="translate(390, 55)">
          <rect width="130" height="155" rx="10" fill="#111827" stroke="#374151" />
          <image href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/26.png" x="25" y="10" width="80" height="80" />
          <text x="36" y="108" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Raichu</text>
          <text x="44" y="126" fill="#9ca3af" font-family="sans-serif" font-size="11">#026</text>
          <rect x="20" y="132" width="90" height="16" rx="8" fill="#374151" />
          <text x="40" y="144" fill="#eab308" font-family="sans-serif" font-size="10">Fase 2</text>
        </g>
      </g>
    </g>
  </g>
</svg>
