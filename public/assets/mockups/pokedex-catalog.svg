<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Navbar -->
  <rect x="0" y="0" width="1280" height="72" fill="#111827" stroke="#374151" stroke-width="1" />
  
  <!-- Pokeball Logo -->
  <g transform="translate(48, 16)">
    <circle cx="20" cy="20" r="18" fill="#1f2937" stroke="#ef4444" stroke-width="3"/>
    <path d="M2 20 A 18 18 0 0 1 38 20 Z" fill="#ef4444" />
    <line x1="2" y1="20" x2="38" y2="20" stroke="#111827" stroke-width="4"/>
    <circle cx="20" cy="20" r="6" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  </g>
  <text x="96" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Pokédex</text>
  <text x="195" y="42" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">v2.0 • Node.js Engine</text>

  <!-- Nav Action Buttons -->
