  <rect x="1125" y="21" width="50" height="30" rx="15" fill="#ef4444" />
  <text x="1090" y="40" fill="#9ca3af" font-family="sans-serif" font-size="11">☀️</text>
  <text x="1140" y="40" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">🌙 Oscuro</text>
  <text x="1195" y="40" fill="#9ca3af" font-family="sans-serif" font-size="11">💻</text>

  <!-- Controls Bar -->
  <!-- Search Box -->
