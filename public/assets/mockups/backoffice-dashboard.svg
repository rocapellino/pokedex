<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="backGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="tableShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#backGrad)" />

  <!-- Navbar -->
  <rect x="0" y="0" width="1280" height="70" fill="#111827" stroke="#374151" stroke-width="1" />
  <g transform="translate(48, 16)">
    <circle cx="18" cy="18" r="16" fill="#1f2937" stroke="#3b82f6" stroke-width="3"/>
    <path d="M2 18 A 16 16 0 0 1 34 18 Z" fill="#3b82f6" />
    <line x1="2" y1="18" x2="34" y2="18" stroke="#111827" stroke-width="3"/>
    <circle cx="18" cy="18" r="5" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  </g>
  <text x="96" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700">Pokédex Backoffice</text>
  <text x="300" y="42" fill="#3b82f6" font-family="sans-serif" font-size="12" font-weight="600">PANEL DE GESTIÓN ADMINISTRATIVA</text>

  <!-- Navbar links -->
  <rect x="990" y="18" width="115" height="34" rx="8" fill="#1f2937" stroke="#374151" />
  <text x="1008" y="40" fill="#e5e7eb" font-family="sans-serif" font-size="12" font-weight="600">← Ver Catálogo</text>

  <rect x="1118" y="18" width="115" height="34" rx="8" fill="#1f2937" stroke="#374151" />
  <text x="1136" y="40" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="700">● API Online</text>

  <!-- Top Action Bar -->
  <g transform="translate(48, 95)">
    <!-- Title & Subtitle -->
    <text x="0" y="24" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="800">Administración de Pokémon</text>
    <text x="0" y="48" fill="#9ca3af" font-family="sans-serif" font-size="13">Control CRUD completo, validación de schemas y sincronización en tiempo real.</text>

    <!-- New Pokemon Button -->
    <rect x="1010" y="8" width="174" height="42" rx="8" fill="#ef4444" />
    <text x="1035" y="34" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">+ Registrar Pokémon</text>
  </g>

  <!-- KPI Cards Row -->
  <g transform="translate(48, 165)">
    <rect x="0" y="0" width="280" height="74" rx="10" fill="#1f2937" stroke="#374151" />
    <text x="20" y="28" fill="#9ca3af" font-family="sans-serif" font-size="11" font-weight="700">TOTAL REGISTRADOS</text>
    <text x="20" y="58" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="800">22</text>
    <text x="200" y="45" fill="#3b82f6" font-family="sans-serif" font-size="24">📋</text>

    <rect x="302" y="0" width="280" height="74" rx="10" fill="#1f2937" stroke="#374151" />
    <text x="322" y="28" fill="#9ca3af" font-family="sans-serif" font-size="11" font-weight="700">OPERACIONES CRUD (24H)</text>
    <text x="322" y="58" fill="#10b981" font-family="sans-serif" font-size="24" font-weight="800">148</text>
    <text x="502" y="45" fill="#10b981" font-family="sans-serif" font-size="24">⚡</text>

    <rect x="604" y="0" width="280" height="74" rx="10" fill="#1f2937" stroke="#374151" />
    <text x="624" y="28" fill="#9ca3af" font-family="sans-serif" font-size="11" font-weight="700">LATENCIA PROMEDIO API</text>
    <text x="624" y="58" fill="#f59e0b" font-family="sans-serif" font-size="24" font-weight="800">4.2 ms</text>
    <text x="804" y="45" fill="#f59e0b" font-family="sans-serif" font-size="24">⏱️</text>

    <rect x="906" y="0" width="278" height="74" rx="10" fill="#1f2937" stroke="#374151" />
    <text x="926" y="28" fill="#9ca3af" font-family="sans-serif" font-size="11" font-weight="700">HEALTHCHECK K8s</text>
    <text x="926" y="58" fill="#10b981" font-family="sans-serif" font-size="22" font-weight="800">100% HEALTHY</text>
    <text x="1106" y="45" fill="#10b981" font-family="sans-serif" font-size="24">🛡️</text>
  </g>

  <!-- Table Container -->
  <g transform="translate(48, 260)" filter="url(#tableShadow)">
    <rect width="1184" height="420" rx="12" fill="#1f2937" stroke="#374151" />

    <!-- Table Header Row -->
    <rect x="0" y="0" width="1184" height="46" rx="12" fill="#111827" />
    <text x="24" y="28" fill="#9ca3af" font-family="sans-serif" font-size="12" font-weight="700">ID</text>
    <text x="80" y="28" fill="#9ca3af" font-family="sans-serif" font-size="12" font-weight="700">SPRITE</text>
    <text x="180" y="28" fill="#9ca3af" font-family="sans-serif" font-size="12" font-weight="700">NOMBRE</text>
    <text x="360" y="28" fill="#9ca3af" font-family="sans-serif" font-size="12" font-weight="700">TIPO(S)</text>
    <text x="540" y="28" fill="#9ca3af" font-family="sans-serif" font-size="12" font-weight="700">HÁBITAT</text>
    <text x="700" y="28" fill="#9ca3af" font-family="sans-serif" font-size="12" font-weight="700">FUERZA</text>
    <text x="830" y="28" fill="#9ca3af" font-family="sans-serif" font-size="12" font-weight="700">PESO / ALTURA</text>
    <text x="1030" y="28" fill="#9ca3af" font-family="sans-serif" font-size="12" font-weight="700">ACCIONES</text>

    <!-- Row 1: Bulbasaur -->
    <g transform="translate(0, 46)">
      <line x1="0" y1="64" x2="1184" y2="64" stroke="#374151" stroke-width="1" />
      <text x="24" y="38" fill="#e5e7eb" font-family="sans-serif" font-size="13" font-weight="700">#001</text>
      <image href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1.png" x="80" y="10" width="44" height="44" />
      <text x="180" y="38" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Bulbasaur</text>
      <rect x="360" y="20" width="60" height="22" rx="11" fill="#10b981" />
      <text x="372" y="35" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Planta</text>
      <text x="540" y="38" fill="#d1d5db" font-family="sans-serif" font-size="13">Kanto</text>
      <text x="700" y="38" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="700">49 PTS</text>
      <text x="830" y="38" fill="#9ca3af" font-family="sans-serif" font-size="13">6.9 kg / 0.7 m</text>
      <!-- Buttons -->
      <rect x="1010" y="18" width="65" height="28" rx="6" fill="#2563eb" />
      <text x="1025" y="36" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Editar</text>
      <rect x="1085" y="18" width="75" height="28" rx="6" fill="#dc2626" />
      <text x="1098" y="36" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Eliminar</text>
    </g>

    <!-- Row 2: Pikachu -->
    <g transform="translate(0, 110)">
      <line x1="0" y1="64" x2="1184" y2="64" stroke="#374151" stroke-width="1" />
      <text x="24" y="38" fill="#e5e7eb" font-family="sans-serif" font-size="13" font-weight="700">#025</text>
      <image href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" x="80" y="10" width="44" height="44" />
      <text x="180" y="38" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Pikachu</text>
      <rect x="360" y="20" width="70" height="22" rx="11" fill="#eab308" />
      <text x="368" y="35" fill="#111827" font-family="sans-serif" font-size="11" font-weight="700">Eléctrico</text>
      <text x="540" y="38" fill="#d1d5db" font-family="sans-serif" font-size="13">Kanto</text>
      <text x="700" y="38" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="700">55 PTS</text>
      <text x="830" y="38" fill="#9ca3af" font-family="sans-serif" font-size="13">6.0 kg / 0.4 m</text>
      <rect x="1010" y="18" width="65" height="28" rx="6" fill="#2563eb" />
      <text x="1025" y="36" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Editar</text>
      <rect x="1085" y="18" width="75" height="28" rx="6" fill="#dc2626" />
      <text x="1098" y="36" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Eliminar</text>
    </g>

    <!-- Row 3: Lucario -->
    <g transform="translate(0, 174)">
      <line x1="0" y1="64" x2="1184" y2="64" stroke="#374151" stroke-width="1" />
      <text x="24" y="38" fill="#e5e7eb" font-family="sans-serif" font-size="13" font-weight="700">#448</text>
      <image href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/448.png" x="80" y="10" width="44" height="44" />
      <text x="180" y="38" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Lucario</text>
      <rect x="360" y="20" width="60" height="22" rx="11" fill="#ea580c" />
      <text x="372" y="35" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Lucha</text>
      <text x="540" y="38" fill="#d1d5db" font-family="sans-serif" font-size="13">Sinnoh</text>
      <text x="700" y="38" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="700">110 PTS</text>
      <text x="830" y="38" fill="#9ca3af" font-family="sans-serif" font-size="13">54.0 kg / 1.2 m</text>
      <rect x="1010" y="18" width="65" height="28" rx="6" fill="#2563eb" />
      <text x="1025" y="36" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Editar</text>
      <rect x="1085" y="18" width="75" height="28" rx="6" fill="#dc2626" />
      <text x="1098" y="36" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Eliminar</text>
    </g>

    <!-- Row 4: Rayquaza -->
    <g transform="translate(0, 238)">
      <line x1="0" y1="64" x2="1184" y2="64" stroke="#374151" stroke-width="1" />
      <text x="24" y="38" fill="#e5e7eb" font-family="sans-serif" font-size="13" font-weight="700">#384</text>
      <image href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/384.png" x="80" y="10" width="44" height="44" />
      <text x="180" y="38" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Rayquaza</text>
      <rect x="360" y="20" width="65" height="22" rx="11" fill="#7c3aed" />
      <text x="372" y="35" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Dragón</text>
      <text x="540" y="38" fill="#d1d5db" font-family="sans-serif" font-size="13">Hoenn</text>
      <text x="700" y="38" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="700">150 PTS</text>
      <text x="830" y="38" fill="#9ca3af" font-family="sans-serif" font-size="13">206.5 kg / 7.0 m</text>
      <rect x="1010" y="18" width="65" height="28" rx="6" fill="#2563eb" />
      <text x="1025" y="36" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Editar</text>
      <rect x="1085" y="18" width="75" height="28" rx="6" fill="#dc2626" />
      <text x="1098" y="36" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Eliminar</text>
    </g>
  </g>
</svg>
