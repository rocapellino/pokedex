<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <meta name="description" content="Pokédex interactiva: explora el catálogo nacional de Pokémon con búsqueda, filtros por tipo y generación, fichas de detalle, evoluciones y megaevoluciones.">
  <!-- Favicons (Pokébola Oficial) -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <!-- Fuente base autoalojada (el resto de familias se declara en style.css) -->
  <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- CSS -->
  <link rel="stylesheet" href="/css/style.css">
  <!-- Theme Manager Script (TypeScript + Zero-FOUC) -->
  <script type="module" src="/src/theme.ts"></script>
</head>

<body>

  <div class="app-container">
    <!-- Navbar Header -->
    <header class="navbar">
      <a href="/" class="brand">
        <svg class="pokeball-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="46" stroke="#EF4444" stroke-width="8" fill="#111827" />
          <path d="M4 50H32M68 50H96" stroke="#EF4444" stroke-width="8" stroke-linecap="round" />
          <path d="M4 50C4 24.5949 24.5949 4 50 4C75.4051 4 96 24.5949 96 50H4Z" fill="#EF4444" />
          <circle cx="50" cy="50" r="16" fill="#111827" stroke="#EF4444" stroke-width="6" />
          <circle cx="50" cy="50" r="8" fill="#FFFFFF" />
        </svg>
        <div>
          <span class="brand-title">Pokédex</span>
        </div>
      </a>

      <!-- Theme Switcher Control (Claro, Oscuro, Sistema) -->
      <div class="nav-actions">
        <div class="theme-switch-group" role="radiogroup" aria-label="Seleccionar tema">
          <button type="button" class="theme-btn" data-theme-val="light" title="Modo Claro"
            aria-label="Modo Claro">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <span class="theme-label">Claro</span>
          </button>
          <button type="button" class="theme-btn" data-theme-val="dark" title="Modo Oscuro"
            aria-label="Modo Oscuro">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <span class="theme-label">Oscuro</span>
          </button>
          <button type="button" class="theme-btn" data-theme-val="system"
            title="Igual al Sistema" aria-label="Igual al Sistema">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            <span class="theme-label">Sistema</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Controls & Filters Bar -->
    <section class="controls-bar">
      <div class="search-box">
        <label for="searchInput" class="sr-only">Buscar Pokémon por nombre, tipo, habilidad o hábitat</label>
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <input type="text" id="searchInput" class="search-input"
          placeholder="Buscar por nombre, tipo, habilidad o hábitat..." aria-label="Buscar Pokémon por nombre, tipo, habilidad o hábitat">
      </div>

      <div class="filter-group">
        <label for="generationFilter" class="sr-only">Filtrar por generación de Pokémon</label>
        <select id="generationFilter" class="select-filter" aria-label="Filtrar por generación de Pokémon">
          <option value="all">🌐 Todas las Generaciones (I a IX)</option>
          <option value="1">Gen I: Kanto (1-151)</option>
          <option value="2">Gen II: Johto (152-251)</option>
          <option value="3">Gen III: Hoenn (252-386)</option>
          <option value="4">Gen IV: Sinnoh (387-493)</option>
          <option value="5">Gen V: Teselia (494-649)</option>
          <option value="6">Gen VI: Kalos (650-721)</option>
          <option value="7">Gen VII: Alola (722-809)</option>
          <option value="8">Gen VIII: Galar (810-905)</option>
          <option value="9">Gen IX: Paldea (906-1025)</option>
        </select>
      </div>
      <div class="filter-group">
        <label class="mega-filter" for="megaFilter">
          <input type="checkbox" id="megaFilter" class="mega-filter-input">
          <span>Con megaevolución</span>
        </label>
      </div>
    </section>

    <!-- Sort and Advanced Filters -->
    <section class="refine-bar" aria-label="Orden y filtros avanzados">
      <div class="filter-group">
        <label for="sortFilter" class="refine-label">Ordenar por</label>
        <select id="sortFilter" class="select-filter">
          <option value="id">Número de Pokédex</option>
          <option value="name">Nombre (A-Z)</option>
          <option value="total">Estadísticas totales (mayor)</option>
          <option value="hp">PS (mayor)</option>
          <option value="attack">Ataque (mayor)</option>
          <option value="defense">Defensa (mayor)</option>
          <option value="sp_attack">Ataque especial (mayor)</option>
          <option value="sp_defense">Defensa especial (mayor)</option>
          <option value="speed">Velocidad (mayor)</option>
        </select>
      </div>
      <details class="more-filters" id="moreFilters">
        <summary class="more-filters-toggle">
          <span>Más filtros</span>
          <span class="more-filters-count" id="moreFiltersCount" hidden></span>
        </summary>
        <div class="more-filters-body">
          <div class="filter-group">
            <label for="classFilter" class="refine-label">Clasificación</label>
            <select id="classFilter" class="select-filter">
              <option value="">Todas</option>
              <option value="legendario">Legendarios</option>
              <option value="mitico">Míticos</option>
              <option value="especial">Legendarios y míticos</option>
            </select>
          </div>
          <div class="filter-group stat-filter">
            <label for="statFilter" class="refine-label">Estadística mínima</label>
            <select id="statFilter" class="select-filter">
              <option value="">Sin filtro</option>
              <option value="total">Total</option>
              <option value="hp">PS</option>
              <option value="attack">Ataque</option>
              <option value="defense">Defensa</option>
              <option value="sp_attack">Ataque especial</option>
              <option value="sp_defense">Defensa especial</option>
              <option value="speed">Velocidad</option>
            </select>
            <label for="statMin" class="sr-only">Valor mínimo de la estadística</label>
            <input type="number" id="statMin" class="select-filter stat-min-input" min="0" max="780" step="5"
              inputmode="numeric" placeholder="Mín.">
          </div>
        </div>
      </details>
    </section>

    <!-- Type Pills Filter Bar -->
    <div class="type-filter-bar" id="typePillsContainer">
      <button type="button" class="type-pill active" data-type="all" aria-pressed="true">Todos</button>
      <button type="button" class="type-pill" data-type="Planta" aria-pressed="false">🌿 Planta</button>
      <button type="button" class="type-pill" data-type="Fuego" aria-pressed="false">🔥 Fuego</button>
      <button type="button" class="type-pill" data-type="Agua" aria-pressed="false">💧 Agua</button>
      <button type="button" class="type-pill" data-type="Eléctrico" aria-pressed="false">⚡ Eléctrico</button>
      <button type="button" class="type-pill" data-type="Psíquico" aria-pressed="false">🔮 Psíquico</button>
      <button type="button" class="type-pill" data-type="Roca" aria-pressed="false">🪨 Roca</button>
      <button type="button" class="type-pill" data-type="Tierra" aria-pressed="false">🏜️ Tierra</button>
      <button type="button" class="type-pill" data-type="Hielo" aria-pressed="false">❄️ Hielo</button>
      <button type="button" class="type-pill" data-type="Dragón" aria-pressed="false">🐉 Dragón</button>
      <button type="button" class="type-pill" data-type="Fantasma" aria-pressed="false">👻 Fantasma</button>
      <button type="button" class="type-pill" data-type="Veneno" aria-pressed="false">☠️ Veneno</button>
      <button type="button" class="type-pill" data-type="Bicho" aria-pressed="false">🐛 Bicho</button>
      <button type="button" class="type-pill" data-type="Volador" aria-pressed="false">🦅 Volador</button>
      <button type="button" class="type-pill" data-type="Lucha" aria-pressed="false">🥊 Lucha</button>
      <button type="button" class="type-pill" data-type="Acero" aria-pressed="false">⚙️ Acero</button>
      <button type="button" class="type-pill" data-type="Siniestro" aria-pressed="false">🌑 Siniestro</button>
      <button type="button" class="type-pill" data-type="Hada" aria-pressed="false">✨ Hada</button>
      <button type="button" class="type-pill" data-type="Normal" aria-pressed="false">⚪ Normal</button>
    </div>

    <!-- Active filters summary -->
    <div class="active-filters" id="activeFilters">
      <p class="results-summary" id="resultsSummary" role="status" aria-live="polite"></p>
      <ul class="filter-chips" id="activeFilterChips" aria-label="Filtros activos"></ul>
      <button type="button" class="btn-clear-filters" id="btnClearFilters" hidden>Limpiar filtros</button>
    </div>

    <!-- Stats Summary Matrix -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Total Pokémon Mostrados</span>
        <span class="stat-value" id="statTotal">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Fuerza Máxima</span>
        <span class="stat-value" id="statMaxForce">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Peso Promedio</span>
        <span class="stat-value" id="statAvgWeight">0 kg</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Tipos Registrados</span>
        <span class="stat-value" id="statTypesCount">0</span>
      </div>
    </div>

    <!-- Pokémon Grid Container -->
    <main class="pokemon-grid" id="pokemonGrid">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Cargando catálogo Pokédex desde el clúster...</p>
      </div>
    </main>

    <!-- Pagination Controls -->
    <div class="pagination-container hidden" id="paginationBar">
      <button class="btn btn-secondary" id="btnPrevPage">← Anterior</button>
      <span class="page-info" id="pageInfo">Página 1 de 1</span>
      <button class="btn btn-secondary" id="btnNextPage">Siguiente →</button>
    </div>
  </div>

  <!-- Modal Ficha de Detalle de Pokémon -->
  <dialog class="modal-overlay" id="detailModal" aria-labelledby="detailTitle">
    <div class="modal-card detail-modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="detailTitle">Ficha Pokémon</h3>
        <button class="btn-icon" aria-label="Cerrar ficha">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="modal-body" id="detailContent">
        <!-- Renderizado dinámico de la ficha -->
      </div>
    </div>
  </dialog>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- JavaScript (Vite Entrypoint) -->
  <script type="module" src="/src/pokedex.ts"></script>
</body>

</html>
