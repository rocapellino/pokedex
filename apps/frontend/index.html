<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <meta name="description" content="Pokédex interactiva: explora el catálogo nacional de Pokémon con búsqueda, filtros por tipo y generación, fichas de detalle, evoluciones y megaevoluciones.">
  <!-- Favicons (Pokébola Oficial) -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <!-- Fuente base autoalojada (el resto de familias se declara en style.css) -->
  <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- CSS -->
  <link rel="stylesheet" href="/css/style.css">
  <!-- Theme Manager Script (TypeScript + Zero-FOUC) -->
  <script type="module" src="/src/theme.ts"></script>
</head>

<body>

  <div class="app-container">
    <!-- Zona fija: cabecera, búsqueda y filtros siguen visibles al desplazarse por el catálogo -->
    <div class="sticky-top" id="stickyTop">
    <!-- Navbar Header -->
    <header class="navbar">
      <a href="/" class="brand">
        <svg class="pokeball-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="46" stroke="#EF4444" stroke-width="8" fill="#111827" />
          <path d="M4 50H32M68 50H96" stroke="#EF4444" stroke-width="8" stroke-linecap="round" />
          <path d="M4 50C4 24.5949 24.5949 4 50 4C75.4051 4 96 24.5949 96 50H4Z" fill="#EF4444" />
          <circle cx="50" cy="50" r="16" fill="#111827" stroke="#EF4444" stroke-width="6" />
          <circle cx="50" cy="50" r="8" fill="#FFFFFF" />
        </svg>
        <div>
          <span class="brand-title">Pokédex</span>
        </div>
      </a>

      <!-- Theme Switcher Control (Claro, Oscuro, Sistema) -->
      <div class="nav-actions">
        <div class="theme-switch-group" role="radiogroup" aria-label="Seleccionar tema">
          <button type="button" class="theme-btn" data-theme-val="light" title="Modo Claro"
            aria-label="Modo Claro">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <span class="theme-label">Claro</span>
          </button>
          <button type="button" class="theme-btn" data-theme-val="dark" title="Modo Oscuro"
            aria-label="Modo Oscuro">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <span class="theme-label">Oscuro</span>
          </button>
          <button type="button" class="theme-btn" data-theme-val="system"
            title="Igual al Sistema" aria-label="Igual al Sistema">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            <span class="theme-label">Sistema</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Search, Sort and Filters Toggle -->
    <section class="controls-bar" aria-label="Búsqueda y orden">
      <div class="search-box">
        <label for="searchInput" class="sr-only">Buscar Pokémon por nombre, tipo, habilidad o hábitat</label>
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <input type="text" id="searchInput" class="search-input"
          placeholder="Buscar Pokémon…" aria-label="Buscar Pokémon por nombre, tipo, habilidad o hábitat">
      </div>

      <div class="sort-controls">
        <label for="sortFilter" class="refine-label">Ordenar por</label>
        <select id="sortFilter" class="select-filter">
          <option value="id">Número de Pokédex</option>
          <option value="name">Nombre</option>
          <option value="total">Estadísticas totales</option>
          <option value="hp">PS</option>
          <option value="attack">Ataque</option>
          <option value="defense">Defensa</option>
          <option value="sp_attack">Ataque especial</option>
          <option value="sp_defense">Defensa especial</option>
          <option value="speed">Velocidad</option>
        </select>
        <button type="button" id="sortDirection" class="select-filter sort-direction" title="Invertir el sentido del orden"
          aria-label="Sentido del orden: ascendente. Pulsar para invertirlo">↑ Ascendente</button>
      </div>

      <button type="button" id="filtersToggle" class="select-filter filters-toggle" aria-expanded="false"
        aria-controls="moreFilters">
        <span class="filters-toggle-icon" aria-hidden="true">+</span>
        <span>Filtros</span>
        <span class="more-filters-count" id="moreFiltersCount" hidden></span>
      </button>
    </section>

    <!-- Filters panel -->
    <section class="filters-panel" id="moreFilters" aria-label="Filtros" hidden>
      <div class="filters-grid">
        <div class="filter-group">
          <label for="generationFilter" class="refine-label">Generación</label>
          <select id="generationFilter" class="select-filter">
            <option value="all">Todas las generaciones</option>
            <option value="1">Gen I: Kanto (1-151)</option>
            <option value="2">Gen II: Johto (152-251)</option>
            <option value="3">Gen III: Hoenn (252-386)</option>
            <option value="4">Gen IV: Sinnoh (387-493)</option>
            <option value="5">Gen V: Teselia (494-649)</option>
            <option value="6">Gen VI: Kalos (650-721)</option>
            <option value="7">Gen VII: Alola (722-809)</option>
            <option value="8">Gen VIII: Galar (810-905)</option>
            <option value="9">Gen IX: Paldea (906-1025)</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="classFilter" class="refine-label">Clasificación</label>
          <select id="classFilter" class="select-filter">
            <option value="">Todas</option>
            <option value="legendario">Legendarios</option>
            <option value="mitico">Míticos</option>
            <option value="especial">Legendarios y míticos</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="abilityFilter" class="refine-label">Habilidad</label>
          <input type="text" id="abilityFilter" class="select-filter ability-input" list="abilityOptions"
            placeholder="Elige una habilidad" autocomplete="off" spellcheck="false" maxlength="60">
          <datalist id="abilityOptions"></datalist>
        </div>
        <div class="filter-group">
          <label for="statFilter" class="refine-label">Estadística mínima</label>
          <div class="stat-filter-row">
            <select id="statFilter" class="select-filter">
              <option value="">Sin filtro</option>
              <option value="total">Total</option>
              <option value="hp">PS</option>
              <option value="attack">Ataque</option>
              <option value="defense">Defensa</option>
              <option value="sp_attack">Ataque especial</option>
              <option value="sp_defense">Defensa especial</option>
              <option value="speed">Velocidad</option>
            </select>
            <label for="statMin" class="sr-only">Valor mínimo de la estadística</label>
            <input type="number" id="statMin" class="select-filter stat-min-input" min="0" max="780" step="5"
              inputmode="numeric" placeholder="Mín.">
          </div>
        </div>
        <div class="filter-group">
          <span class="refine-label">Megaevolución</span>
          <label class="mega-filter" for="megaFilter">
            <input type="checkbox" id="megaFilter" class="mega-filter-input">
            <span>Solo con megaevolución</span>
          </label>
        </div>
        <div class="filter-group type-filter" id="typeFilterField">
          <span class="refine-label" id="typeFilterLabel">Tipos <span class="refine-hint">· debe tener todos los elegidos</span></span>
          <button type="button" id="typeFilterToggle" class="select-filter type-filter-toggle" aria-expanded="false"
            aria-controls="typeFilterList" aria-labelledby="typeFilterLabel typeFilterSummary">
            <span id="typeFilterSummary">Cualquier tipo</span>
            <span aria-hidden="true">▾</span>
          </button>
          <div class="type-filter-list" id="typeFilterList" role="group" aria-labelledby="typeFilterLabel" hidden>
            <label class="type-option"><input type="checkbox" value="Planta"><span class="type-dot" data-type="planta" aria-hidden="true"></span>Planta</label>
            <label class="type-option"><input type="checkbox" value="Fuego"><span class="type-dot" data-type="fuego" aria-hidden="true"></span>Fuego</label>
            <label class="type-option"><input type="checkbox" value="Agua"><span class="type-dot" data-type="agua" aria-hidden="true"></span>Agua</label>
            <label class="type-option"><input type="checkbox" value="Eléctrico"><span class="type-dot" data-type="electrico" aria-hidden="true"></span>Eléctrico</label>
            <label class="type-option"><input type="checkbox" value="Psíquico"><span class="type-dot" data-type="psiquico" aria-hidden="true"></span>Psíquico</label>
            <label class="type-option"><input type="checkbox" value="Roca"><span class="type-dot" data-type="roca" aria-hidden="true"></span>Roca</label>
            <label class="type-option"><input type="checkbox" value="Tierra"><span class="type-dot" data-type="tierra" aria-hidden="true"></span>Tierra</label>
            <label class="type-option"><input type="checkbox" value="Hielo"><span class="type-dot" data-type="hielo" aria-hidden="true"></span>Hielo</label>
            <label class="type-option"><input type="checkbox" value="Dragón"><span class="type-dot" data-type="dragon" aria-hidden="true"></span>Dragón</label>
            <label class="type-option"><input type="checkbox" value="Fantasma"><span class="type-dot" data-type="fantasma" aria-hidden="true"></span>Fantasma</label>
            <label class="type-option"><input type="checkbox" value="Veneno"><span class="type-dot" data-type="veneno" aria-hidden="true"></span>Veneno</label>
            <label class="type-option"><input type="checkbox" value="Bicho"><span class="type-dot" data-type="bicho" aria-hidden="true"></span>Bicho</label>
            <label class="type-option"><input type="checkbox" value="Volador"><span class="type-dot" data-type="volador" aria-hidden="true"></span>Volador</label>
            <label class="type-option"><input type="checkbox" value="Lucha"><span class="type-dot" data-type="lucha" aria-hidden="true"></span>Lucha</label>
            <label class="type-option"><input type="checkbox" value="Acero"><span class="type-dot" data-type="acero" aria-hidden="true"></span>Acero</label>
            <label class="type-option"><input type="checkbox" value="Siniestro"><span class="type-dot" data-type="siniestro" aria-hidden="true"></span>Siniestro</label>
            <label class="type-option"><input type="checkbox" value="Hada"><span class="type-dot" data-type="hada" aria-hidden="true"></span>Hada</label>
            <label class="type-option"><input type="checkbox" value="Normal"><span class="type-dot" data-type="normal" aria-hidden="true"></span>Normal</label>
          </div>
        </div>
      </div>
    </section>
    </div>

    <!-- Active filters summary -->
    <div class="active-filters" id="activeFilters">
      <p class="results-summary" id="resultsSummary" role="status" aria-live="polite"></p>
      <ul class="filter-chips" id="activeFilterChips" aria-label="Filtros activos"></ul>
      <button type="button" class="btn-clear-filters" id="btnClearFilters" hidden>Limpiar filtros</button>
    </div>

    <!-- Enlace de salto: aparece al recibir foco y solo cuando hay varias páginas (lo gestiona pokedex.ts) -->
    <a class="skip-link" id="skipToPagination" href="#paginationBar" hidden>Saltar a la paginación</a>

    <!-- Pokémon Grid Container -->
    <main class="pokemon-grid" id="pokemonGrid" tabindex="-1" aria-label="Catálogo de Pokémon">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Cargando catálogo Pokédex desde el clúster...</p>
      </div>
    </main>

    <!-- Pagination Controls -->
    <!-- Anuncia la página nueva a los lectores de pantalla; solo lo escribe changePage, no el refiltrado -->
    <p class="sr-only" id="pageAnnouncer" role="status" aria-live="polite"></p>

    <nav class="pagination-container hidden" id="paginationBar" aria-label="Paginación del catálogo">
      <button class="btn btn-secondary" id="btnPrevPage">← Anterior</button>
      <span class="page-info" id="pageInfo">Página 1 de 1</span>
      <button class="btn btn-secondary" id="btnNextPage">Siguiente →</button>
    </nav>
  </div>

  <!-- Modal Ficha de Detalle de Pokémon -->
  <dialog class="modal-overlay" id="detailModal" aria-labelledby="detailTitle">
    <div class="modal-card detail-modal-card">
      <!-- Nombre accesible del diálogo; el título visible lo renderiza la ficha en #detailContent. -->
      <h3 class="sr-only" id="detailTitle">Ficha Pokémon</h3>
      <div class="modal-body" id="detailContent">
        <!-- Renderizado dinámico de la ficha -->
      </div>
    </div>
  </dialog>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- JavaScript (Vite Entrypoint) -->
  <script type="module" src="/src/pokedex.ts"></script>
</body>

</html>
