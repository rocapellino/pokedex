server {
    listen 80;
    server_name localhost;

    # Ocultar versión de Nginx en cabeceras de respuesta HTTP
    server_tokens off;

    # Límite máximo de payload para mitigar ataques DoS
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Encabezados anti-caché para desarrollo local
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: forzar HTTPS en conexiones protegidas por TLS Ingress o Reverse Proxy
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: permite scripts/estilos propios, fuentes de Google, imágenes de GitHub y data URIs.
    # 'unsafe-inline' en style-src y script-src es necesario para los controladores interactivos del frontend.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https://raw.githubusercontent.com data: blob:; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; object-src 'none'; frame-ancestors 'self';" always;

    # 1. Backoffice CRUD — restringido a acceso local únicamente
    #    En producción detrás de un LB/Ingress, agregar la IP del jump host o bastion.
    location ~* ^/(admin|backoffice) {
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;  # Redes internas Docker bridge y gateways
        allow 10.0.0.0/8;     # Subredes privadas de Kubernetes / pods
        allow 192.168.0.0/16; # Redes locales privadas (LAN)
        deny all;
        try_files /backoffice.html =404;
    }

    # 2. Archivos estáticos y Pokédex Pública (Frontend)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3. Proxy inverso hacia el backend API Node.js / Express (/api/)
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Proxy directo para endpoints REST /pokemons
    location /pokemons {
        proxy_pass http://api:3000/pokemons;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 5. Endpoint de métricas de Prometheus — restringido a red interna (monitoring-net y k8s pods)
    #    No expuesto públicamente a través del LB/Ingress.
    location /metrics {
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;  # Redes Docker bridge (monitoring-net)
        allow 10.0.0.0/8;     # Subredes de pods Kubernetes
        allow 192.168.0.0/16; # Subredes privadas de monitoreo
        deny all;
        proxy_pass http://api:3000/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 6. Healthcheck para Nginx
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
