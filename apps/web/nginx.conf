server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Encabezados anti-caché para desarrollo local
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # 1. Enrutamiento del Backoffice CRUD
    location ~* ^/(admin|backoffice) {
        try_files /backoffice.html =404;
    }

    # 2. Archivos estáticos y Pokédex Pública (Frontend)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3. Proxy inverso hacia el backend API Flask (/api/)
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Proxy directo para endpoints REST /pokemons
    location /pokemons {
        proxy_pass http://api:5000/pokemons;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 5. Healthcheck para Nginx
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
