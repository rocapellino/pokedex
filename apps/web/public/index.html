<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex Nacional - DevOps Cloud-Native Edition</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css?v=2.0">
</head>
<body>

  <div class="app-container">
    <!-- Navbar Header -->
    <header class="navbar">
      <a href="/" class="brand">
        <svg class="pokeball-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="46" stroke="#EF4444" stroke-width="8" fill="#111827"/>
          <path d="M4 50H32M68 50H96" stroke="#EF4444" stroke-width="8" stroke-linecap="round"/>
          <path d="M4 50C4 24.5949 24.5949 4 50 4C75.4051 4 96 24.5949 96 50H4Z" fill="#EF4444"/>
          <circle cx="50" cy="50" r="16" fill="#111827" stroke="#EF4444" stroke-width="6"/>
          <circle cx="50" cy="50" r="8" fill="#FFFFFF"/>
        </svg>
        <div>
          <span class="brand-title">Pokédex Nacional</span>
          <span class="brand-badge">Pública</span>
        </div>
      </a>

      <!-- Sin enlaces internos ni monitoreo en la vista pública por seguridad -->
    </header>

    <!-- Controls & Filters Bar -->
    <section class="controls-bar">
      <div class="search-box">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar por nombre, tipo, habilidad o hábitat..." oninput="handleSearch()">
      </div>

      <div class="filter-group">
        <select id="generationFilter" class="select-filter" onchange="handleGenerationChange()">
          <option value="all">🌐 Todas las Generaciones (I a IX)</option>
          <option value="1">Gen I: Kanto (1-151)</option>
          <option value="2">Gen II: Johto (152-251)</option>
          <option value="3">Gen III: Hoenn (252-386)</option>
          <option value="4">Gen IV: Sinnoh (387-493)</option>
          <option value="5">Gen V: Teselia (494-649)</option>
          <option value="6">Gen VI: Kalos (650-721)</option>
          <option value="7">Gen VII: Alola (722-809)</option>
          <option value="8">Gen VIII: Galar (810-905)</option>
          <option value="9">Gen IX: Paldea (906-1025)</option>
        </select>
      </div>
    </section>

    <!-- Type Pills Filter Bar -->
    <div class="type-filter-bar" id="typePillsContainer">
      <button class="type-pill active" data-type="all" onclick="selectTypeFilter('all')">Todos</button>
      <button class="type-pill" data-type="Planta" onclick="selectTypeFilter('Planta')">🌿 Planta</button>
      <button class="type-pill" data-type="Fuego" onclick="selectTypeFilter('Fuego')">🔥 Fuego</button>
      <button class="type-pill" data-type="Agua" onclick="selectTypeFilter('Agua')">💧 Agua</button>
      <button class="type-pill" data-type="Eléctrico" onclick="selectTypeFilter('Eléctrico')">⚡ Eléctrico</button>
      <button class="type-pill" data-type="Psíquico" onclick="selectTypeFilter('Psíquico')">🔮 Psíquico</button>
      <button class="type-pill" data-type="Roca" onclick="selectTypeFilter('Roca')">🪨 Roca</button>
      <button class="type-pill" data-type="Tierra" onclick="selectTypeFilter('Tierra')">🏜️ Tierra</button>
      <button class="type-pill" data-type="Hielo" onclick="selectTypeFilter('Hielo')">❄️ Hielo</button>
      <button class="type-pill" data-type="Dragón" onclick="selectTypeFilter('Dragón')">🐉 Dragón</button>
      <button class="type-pill" data-type="Fantasma" onclick="selectTypeFilter('Fantasma')">👻 Fantasma</button>
      <button class="type-pill" data-type="Veneno" onclick="selectTypeFilter('Veneno')">☠️ Veneno</button>
      <button class="type-pill" data-type="Bicho" onclick="selectTypeFilter('Bicho')">🐛 Bicho</button>
      <button class="type-pill" data-type="Volador" onclick="selectTypeFilter('Volador')">🦅 Volador</button>
      <button class="type-pill" data-type="Lucha" onclick="selectTypeFilter('Lucha')">🥊 Lucha</button>
      <button class="type-pill" data-type="Acero" onclick="selectTypeFilter('Acero')">⚙️ Acero</button>
      <button class="type-pill" data-type="Siniestro" onclick="selectTypeFilter('Siniestro')">🌑 Siniestro</button>
      <button class="type-pill" data-type="Hada" onclick="selectTypeFilter('Hada')">✨ Hada</button>
      <button class="type-pill" data-type="Normal" onclick="selectTypeFilter('Normal')">⚪ Normal</button>
    </div>

    <!-- Stats Summary Matrix -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Total Pokémon Mostrados</span>
        <span class="stat-value" id="statTotal">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Fuerza Máxima</span>
        <span class="stat-value" id="statMaxForce">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Peso Promedio</span>
        <span class="stat-value" id="statAvgWeight">0 kg</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Tipos Registrados</span>
        <span class="stat-value" id="statTypesCount">0</span>
      </div>
    </div>

    <!-- Pokémon Grid Container -->
    <main class="pokemon-grid" id="pokemonGrid">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Cargando catálogo Pokédex desde el clúster...</p>
      </div>
    </main>

    <!-- Pagination Controls -->
    <div class="pagination-container" id="paginationBar" style="display: none;">
      <button class="btn btn-secondary" id="btnPrevPage" onclick="changePage(-1)">← Anterior</button>
      <span class="page-info" id="pageInfo">Página 1 de 1</span>
      <button class="btn btn-secondary" id="btnNextPage" onclick="changePage(1)">Siguiente →</button>
    </div>
  </div>

  <!-- Modal Ficha de Detalle de Pokémon -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-card detail-modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="detailTitle">Ficha Pokémon</h3>
        <button class="btn-icon" onclick="closeDetailModal()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="detailContent">
        <!-- Renderizado dinámico de la ficha -->
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- JavaScript -->
  <script src="js/pokedex.js?v=2.0"></script>
</body>
</html>
