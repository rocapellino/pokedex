name: pokedex

services:
  # ============================================================================
  # 1. Frontend Web (Nginx + Reverse Proxy) - DMZ Pública
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: pokemon-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"  # Único punto de entrada público expuesto al usuario/host
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============================================================================
  # 2. Backend API (Node.js + TypeScript Full-Stack) - Capa de Aplicación
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: pokemon-api
    restart: unless-stopped
    expose:
      - "${PORT:-3000}"  # Solo accesible internamente por 'web' en frontend-net
    environment:
      NODE_ENV: "production"
      PORT: "${PORT:-3000}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://${POSTGRES_USER:-pokedex_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pokedex_db}}"
      # El PostgreSQL local no ofrece TLS; con NODE_ENV=production el pool lo exigiría
      # y el API caería en silencio al almacén en memoria. Ver tests/unit/compose_postgres_tls.test.ts.
      DB_SSL: "${DB_SSL:-false}"
      REDIS_URL: "${REDIS_URL:-redis://:${REDIS_PASSWORD:?Error: Variable REDIS_PASSWORD requerida en .env}@redis:6379/0}"
      ADMIN_API_KEY: "${ADMIN_API_KEY:?Error: Variable ADMIN_API_KEY requerida en .env}"
      ADMIN_SESSION_SECRET: "${ADMIN_SESSION_SECRET:?Error: Variable ADMIN_SESSION_SECRET requerida en .env}"
      METRICS_BEARER_TOKEN: "${METRICS_BEARER_TOKEN:-}"
      AI_API_KEY: "${AI_API_KEY}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080,http://127.0.0.1:8080}"
    depends_on:
      # ADR-011: con NODE_ENV=production el API verifica el esquema y no lo migra.
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============================================================================
  # 2b. Migración de Esquema (Drizzle) - Ejecución Única antes del API
  # ============================================================================
  # Equivalente al Job de Kubernetes (infra/helm/pokedex/templates/migrate-job.yaml,
  # ADR-011): misma imagen que el API y conexión directa a PostgreSQL.
  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: pokemon-migrate
    restart: "no"
    command: ["node", "dist/migrate.js"]
    environment:
      NODE_ENV: "production"
      DIRECT_DATABASE_URL: "${DIRECT_DATABASE_URL:-postgresql://${POSTGRES_USER:-pokedex_app}:${POSTGRES_PASSWORD:?Error: Variable POSTGRES_PASSWORD requerida en .env}@postgres:5432/${POSTGRES_DB:-pokedex_db}}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net

  # ============================================================================
  # 3. Base de Datos Relacional (PostgreSQL 17) - Capa de Datos Aislada
  # ============================================================================
  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    container_name: pokemon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-pokedex_db}"
      POSTGRES_USER: "${POSTGRES_USER:-pokedex_app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: Variable POSTGRES_PASSWORD requerida en .env}"
    expose:
      - "5432"  # Aislado en backend-net: NO expuesto al host ni al frontend web
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pokedex_app} -d $${POSTGRES_DB:-pokedex_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 4. Base de Datos en Memoria / Caché (Valkey 8) - Capa de Datos Aislada
  # ============================================================================
  redis:
    image: valkey/valkey:8-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    container_name: pokemon-redis
    restart: unless-stopped
    command: >
      sh -c "exec valkey-server --requirepass \"$${REDIS_PASSWORD}\""
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Error: Variable REDIS_PASSWORD requerida en .env}"
    expose:
      - "6379"  # Aislado en backend-net: NO expuesto al host ni al frontend web
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$${REDIS_PASSWORD}\" ping || redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

# ==============================================================================
# Segmentación de Redes (DMZ Architecture) y Volúmenes Persistentes
# ==============================================================================
networks:
  frontend-net:
    name: pokedex-frontend-net
    driver: bridge
    internal: false  # Permite al contenedor web publicar el puerto hacia el host
  backend-net:
    name: pokedex-backend-net
    driver: bridge
    internal: true   # Aislamiento total: la red no tiene ruta de salida ni entrada a internet

volumes:
  postgres_data:
    name: pokedex_postgres_data
    driver: local
  redis_data:
    name: pokedex_redis_data
    driver: local
