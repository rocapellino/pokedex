# ==============================================================================
# Pokédex Platform CLI - Gobernanza de CI e Impacto de Cambios
# Submódulo de Taskfile v3 incluido por Taskfile.yaml
# ==============================================================================
version: '3'

tasks:
  ci:impact:
    desc: "Calcula el grafo de impacto de cambios y el DAG dinámico de validaciones de CI"
    cmds:
      - npm run ci:detect-impact -- {{.CLI_ARGS}}

  governance:audit-scripts:
    desc: "Audita la gobernanza de scripts de despliegue y valida la lista blanca de scripts autorizados (ADR-020)"
    cmds:
      - npm run governance:audit-scripts
