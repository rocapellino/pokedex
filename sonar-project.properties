# ==============================================================================
# SonarQube / SonarCloud - Análisis Estático de Calidad y Deuda Técnica
# https://docs.sonarsource.com/sonarcloud/advanced-setup/analysis-parameters/
# ==============================================================================

sonar.projectKey=rocapellino_pokedex
sonar.organization=rocapellino

# Fuentes analizadas (Workspaces del Monorepo)
sonar.sources=apps/backend/server.ts,apps/backend/src,apps/frontend/public

# Tests del proyecto
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.spec.ts

# Exclusiones de análisis estático
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,apps/frontend/public/favicon.*,**/*.map

# Cobertura de código (LCOV generado por suite nativa Node.js / tsx)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*

# Codificación
sonar.sourceEncoding=UTF-8
