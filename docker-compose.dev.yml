# ==============================================================================
# Docker Compose - Modo Desarrollo (Hot-Reload, Puertos de Depuración y Auditoría)
# ==============================================================================
services:
  web:
    volumes:
      - ./apps/frontend/dist:/usr/share/nginx/html:ro

  api:
    environment:
      ENVIRONMENT: "development"
      DEBUG: "true"
      NODE_ENV: "development"
    volumes:
      - ./apps/backend/server.ts:/app/apps/backend/server.ts
      - ./apps/backend/dist:/app/apps/backend/dist
      - ./apps/backend/src:/app/apps/backend/src
      - ./apps/frontend/dist:/app/apps/frontend/dist:ro
    ports:
      - "${API_DEV_PORT:-3001}:3000"  # Acceso directo para depuración (3001 por defecto para evitar colisión con Grafana en 3000)

  postgres:
    ports:
      - "5432:5432"  # Puerto abierto al host para herramientas SQL (DBeaver, pgAdmin)

  redis:
    ports:
      - "6379:6379"  # Puerto abierto al host para depuración de caché (RedisInsight)

  # ============================================================================
  # 5. Agente de Telemetría Grafana Alloy (Envío de Métricas a Grafana Cloud)
  # ============================================================================
  alloy:
    image: grafana/alloy:v1.7.1
    container_name: pokemon-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"  # UI y métricas de diagnóstico de Alloy (acotado a localhost)
    volumes:
      - ./infra/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      GRAFANA_CLOUD_PROMETHEUS_URL: "${GRAFANA_CLOUD_PROMETHEUS_URL:-}"
      GRAFANA_CLOUD_PROMETHEUS_USER: "${GRAFANA_CLOUD_PROMETHEUS_USER:-}"
      GRAFANA_CLOUD_LOKI_URL: "${GRAFANA_CLOUD_LOKI_URL:-}"
      GRAFANA_CLOUD_LOKI_USER: "${GRAFANA_CLOUD_LOKI_USER:-}"
      GRAFANA_CLOUD_TOKEN: "${GRAFANA_CLOUD_TOKEN:-}"
      POSTGRES_DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Error: Variable POSTGRES_PASSWORD requerida en .env}@postgres:5432/${POSTGRES_DB:-pokedex_db}?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Error: Variable REDIS_PASSWORD requerida en .env}"
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net

  # ============================================================================
  # 6. Exporter de Métricas de Contenedores Docker (cAdvisor)
  # Retenido exclusivamente en desarrollo local para alimentar métricas container_*
  # (CPU, Working Set RAM, límites de memoria) a Alloy y Grafana Cloud sin romper
  # dashboards ni la alerta ContainerHighMemoryUsage. En K8s, Kubelet lo provee de
  # forma nativa en :10250 sin contenedor satélite.
  # ============================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: pokemon-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - backend-net

  # ============================================================================
  # 7. Sincronización Off-Site a Google Drive con Rclone (Dev Local)
  # Perfil bajo demanda: docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile backup run --rm backup-gdrive
  # ============================================================================
  backup-gdrive:
    image: rclone/rclone:1.68.2
    container_name: pokemon-backup-gdrive
    profiles:
      - backup
    environment:
      - RCLONE_CONFIG_GDRIVE_TYPE=drive
      - RCLONE_CONFIG_GDRIVE_CLIENT_ID=${GDRIVE_CLIENT_ID:-}
      - RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=${GDRIVE_CLIENT_SECRET:-}
      - RCLONE_CONFIG_GDRIVE_TOKEN=${GDRIVE_TOKEN:-}
      - GDRIVE_FOLDER=${GDRIVE_FOLDER:-PokedexBackups/dev}
    volumes:
      - ./backups:/backups:ro
      - ~/.config/rclone:/config/rclone:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$RCLONE_CONFIG_GDRIVE_TOKEN" ] && [ ! -f /config/rclone/rclone.conf ]; then
          echo "❌ [DR Dev] Error: Credenciales de Google Drive ausentes."
          echo "ℹ️ Configura GDRIVE_TOKEN en .env o genera ~/.config/rclone/rclone.conf con 'rclone authorize drive'"
          exit 1
        fi
        echo "☁️ [DR Dev] Sincronizando copias cifradas hacia Google Drive (gdrive:$${GDRIVE_FOLDER})..."
        rclone sync /backups gdrive:$${GDRIVE_FOLDER} --include "pokedex_*.sql.gz.enc*" --include "*.sha256" --verbose
        echo "✅ [DR Dev] ¡Sincronización con Google Drive completada exitosamente!"


networks:
  backend-net:
    internal: false  # Habilitar forwarding de puertos en local para desarrollo
