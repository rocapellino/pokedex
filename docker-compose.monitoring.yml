name: pokedex-monitoring

services:
  # ============================================================================
  # 1. Prometheus (Servidor de Métricas y Series Temporales)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: pokemon-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - monitoring-net
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ============================================================================
  # 2. Grafana (Visualización de Paneles y Dashboards)
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: pokemon-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - monitoring-net

networks:
  monitoring-net:
    driver: bridge
  frontend-net:
    name: pokedex-frontend-net
    external: true

volumes:
  prometheus_data:
    name: pokedex_prometheus_data
    driver: local
  grafana_data:
    name: pokedex_grafana_data
    driver: local
