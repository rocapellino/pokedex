# ==============================================================================
# Workflow Orquestador Centralizado de CI/CD (Single Point of Decision)
# Orquesta el flujo completo de validación en base al Change Impact Analysis
# ==============================================================================
name: 🎯 Change Impact & Pipeline Orchestrator

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =======================================================
  # 1. CHANGE IMPACT ANALYSIS (Motor Único Centralizado)
  # =======================================================
  detect-impact:
    name: "🎯 Detect Change Impact"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_changes: ${{ steps.impact.outputs.has_changes }}
      is_unknown: ${{ steps.impact.outputs.is_unknown }}
      is_global: ${{ steps.impact.outputs.is_global }}
      docs: ${{ steps.impact.outputs.docs }}
      agent_governance: ${{ steps.impact.outputs.agent_governance }}
      backend: ${{ steps.impact.outputs.backend }}
      frontend: ${{ steps.impact.outputs.frontend }}
      tests: ${{ steps.impact.outputs.tests }}
      docker: ${{ steps.impact.outputs.docker }}
      kubernetes: ${{ steps.impact.outputs.kubernetes }}
      helm: ${{ steps.impact.outputs.helm }}
      opentofu: ${{ steps.impact.outputs.opentofu }}
      ansible: ${{ steps.impact.outputs.ansible }}
      linting: ${{ steps.impact.outputs.linting }}
      pr_governance: ${{ steps.impact.outputs.pr_governance }}
      security: ${{ steps.impact.outputs.security }}
      security_secrets: ${{ steps.impact.outputs.security_secrets }}
      security_sast: ${{ steps.impact.outputs.security_sast }}
      security_dependencies: ${{ steps.impact.outputs.security_dependencies }}
      security_container: ${{ steps.impact.outputs.security_container }}
      security_iac: ${{ steps.impact.outputs.security_iac }}
      security_supply_chain: ${{ steps.impact.outputs.security_supply_chain }}
    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 2. Configurar Node.js 22 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Instalar Dependencias
        run: npm ci --ignore-scripts

      - name: 4. Ejecutar Change Impact Analysis y Generar impact.json
        id: impact
        run: |
          npx tsx scripts/detect-change-impact.ts \
            --base "${{ github.event.pull_request.base.sha || 'origin/main' }}" \
            --github-output \
            --format json > impact.json
          echo "=== RESUMEN DE IMPACTO (impact.json) ==="
          cat impact.json
          echo ""
          echo "=== NIVEL ALWAYS (controles no negociables, se aplican en todo PR) ==="
          if [ -n "${GITHUB_OUTPUT:-}" ] && [ -f "${GITHUB_OUTPUT:-}" ]; then
            grep -E '^(pr_governance|security_secrets)=' "$GITHUB_OUTPUT" || true
          fi

      - name: 5. Persistir Artefacto Inmutable impact.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: change-impact-metadata
          path: impact.json
          retention-days: 7

  # =======================================================
  # 2. CI CORE (Aplicación, Quality Gates, SAST & Release)
  # =======================================================
  ci-core:
    name: "🚀 Core CI"
    needs: [detect-impact]
    if: |
      needs.detect-impact.outputs.backend == 'true' ||
      needs.detect-impact.outputs.frontend == 'true' ||
      needs.detect-impact.outputs.tests == 'true' ||
      needs.detect-impact.outputs.docker == 'true' ||
      needs.detect-impact.outputs.security_sast == 'true' ||
      needs.detect-impact.outputs.security_dependencies == 'true' ||
      needs.detect-impact.outputs.security_container == 'true' ||
      needs.detect-impact.outputs.docs == 'true' ||
      needs.detect-impact.outputs.agent_governance == 'true' ||
      needs.detect-impact.outputs.is_unknown == 'true' ||
      github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/ci.yaml
    with:
      backend: ${{ needs.detect-impact.outputs.backend == 'true' }}
      frontend: ${{ needs.detect-impact.outputs.frontend == 'true' }}
      tests: ${{ needs.detect-impact.outputs.tests == 'true' }}
      docker: ${{ needs.detect-impact.outputs.docker == 'true' }}
      security_sast: ${{ needs.detect-impact.outputs.security_sast == 'true' }}
      security_dependencies: ${{ needs.detect-impact.outputs.security_dependencies == 'true' }}
      security_container: ${{ needs.detect-impact.outputs.security_container == 'true' }}
      docs: ${{ needs.detect-impact.outputs.docs == 'true' }}
      agent_governance: ${{ needs.detect-impact.outputs.agent_governance == 'true' }}
      is_unknown: ${{ needs.detect-impact.outputs.is_unknown == 'true' }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # =======================================================
  # 3. INFRASTRUCTURE & IAC (Helm, Tofu, Ansible, Kind)
  # =======================================================
  infra:
    name: "⚙️ Infra CI"
    needs: [detect-impact]
    if: |
      needs.detect-impact.outputs.helm == 'true' ||
      needs.detect-impact.outputs.kubernetes == 'true' ||
      needs.detect-impact.outputs.opentofu == 'true' ||
      needs.detect-impact.outputs.ansible == 'true' ||
      needs.detect-impact.outputs.security_iac == 'true' ||
      needs.detect-impact.outputs.is_unknown == 'true' ||
      github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/infra.yaml
    with:
      helm: ${{ needs.detect-impact.outputs.helm == 'true' }}
      kubernetes: ${{ needs.detect-impact.outputs.kubernetes == 'true' }}
      opentofu: ${{ needs.detect-impact.outputs.opentofu == 'true' }}
      ansible: ${{ needs.detect-impact.outputs.ansible == 'true' }}
      security_iac: ${{ needs.detect-impact.outputs.security_iac == 'true' }}
      is_unknown: ${{ needs.detect-impact.outputs.is_unknown == 'true' }}

  # =======================================================
  # 4. SPECIALIZED CONDITIONAL CI (decisión centralizada)
  # =======================================================
  frontend-web:
    name: "🌐 Frontend Web CI"
    needs: [detect-impact]
    if: |
      needs.detect-impact.outputs.frontend == 'true' ||
      needs.detect-impact.outputs.is_unknown == 'true' ||
      github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/web.yaml

  megalinter:
    name: "⚡ MegaLinter"
    needs: [detect-impact]
    if: |
      needs.detect-impact.outputs.linting == 'true' ||
      needs.detect-impact.outputs.is_unknown == 'true' ||
      github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/mega-linter.yaml

  security-code-scanning:
    name: "🛡️ Security Code Scanning"
    needs: [detect-impact]
    if: |
      needs.detect-impact.outputs.security_sast == 'true' ||
      needs.detect-impact.outputs.security_iac == 'true' ||
      needs.detect-impact.outputs.linting == 'true' ||
      needs.detect-impact.outputs.is_unknown == 'true' ||
      github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/security-code-scanning.yaml
    with:
      security_sast: ${{ needs.detect-impact.outputs.security_sast == 'true' || needs.detect-impact.outputs.is_unknown == 'true' || github.event_name == 'push' }}
      security_iac: ${{ needs.detect-impact.outputs.security_iac == 'true' || needs.detect-impact.outputs.is_unknown == 'true' || github.event_name == 'push' }}
      linting: ${{ needs.detect-impact.outputs.linting == 'true' || needs.detect-impact.outputs.is_unknown == 'true' || github.event_name == 'push' }}

  # =======================================================
  # 5. PR GOVERNANCE (control always del contrato de impacto)
  # =======================================================
  # AUD-WF-GOV-001: valida el cuerpo del PR contra el template físico. Se omite
  # para autores Bot: los PRs de promote (github-actions) y Renovate generan su
  # propio cuerpo. Un job omitido no bloquea el quality-gate.
  pr-governance:
    name: "📝 PR Governance"
    needs: [detect-impact]
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.type != 'Bot' &&
      needs.detect-impact.outputs.pr_governance == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 2. Configurar Node.js 22 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Instalar Dependencias
        run: npm ci --ignore-scripts

      - name: 4. Validar el cuerpo del PR contra el template
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npm run pr:validate -- --remote "${PR_NUMBER}"

  # =======================================================
  # 6. QUALITY GATE (agregador fail-closed para branch protection)
  # =======================================================
  # Este job existe para que el ruleset de branch protection pueda declarar
  # UN solo required check en lugar de uno por job. Motivo:
  #
  # El orquestador decide que ejecutar segun el radio de impacto, por lo que la
  # mayoria de los jobs son condicionales. Si un job condicional se declara
  # required y no se ejecuta, el PR queda bloqueado esperando un check que
  # nunca se emitio. Agregar el gate como unico required evita ese deadlock y,
  # a la vez, hace que CUALQUIER job fallido bloquee el merge.
  #
  # `needs` cubre todos los pipelines y `if: always()` garantiza que el gate se
  # ejecute incluso si alguno de ellos fue omitido o fallo.
  quality-gate:
    name: "🚦 Quality Gate"
    needs: [detect-impact, ci-core, infra, frontend-web, megalinter, security-code-scanning, pr-governance]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 1. Evaluar el resultado agregado de los pipelines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          # Conclusions reportadas por GitHub para cada job del run actual.
          DETECT_IMPACT: ${{ needs.detect-impact.result }}
          CI_CORE: ${{ needs.ci-core.result }}
          INFRA: ${{ needs.infra.result }}
          FRONTEND_WEB: ${{ needs.frontend-web.result }}
          MEGALINTER: ${{ needs.megalinter.result }}
          SECURITY_CODE_SCANNING: ${{ needs.security-code-scanning.result }}
          PR_GOVERNANCE: ${{ needs.pr-governance.result }}
        run: |
          set -euo pipefail

          # Un job OMITIDO no es un fallo: significa que el radio de impacto del
          # cambio no lo requeria. Un job CANCELLED o FALLURE si bloquea el merge.
          FAILED=""
          for pair in \
            "detect-impact=${DETECT_IMPACT}" \
            "ci-core=${CI_CORE}" \
            "infra=${INFRA}" \
            "frontend-web=${FRONTEND_WEB}" \
            "megalinter=${MEGALINTER}" \
            "security-code-scanning=${SECURITY_CODE_SCANNING}" \
            "pr-governance=${PR_GOVERNANCE}"; do
            JOB="${pair%%=*}"
            RESULT="${pair#*=}"
            case "${RESULT}" in
              success|skipped) printf '  ok      %-24s %s\n' "${JOB}" "${RESULT}" ;;
              *) FAILED="${FAILED}${JOB}=${RESULT}"$'\n' ;;
            esac
          done


          # El reporte se escribe siempre para poder auditar la decision del gate.
          REPORT="${RUNNER_TEMP}/quality-gate.md"
          {
            echo "# Quality Gate Report"
            echo
            echo "- Run: \`${RUN_ID}\`"
            echo "- Evento: \`${GITHUB_EVENT_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo
            echo "## Resultado por pipeline"
            echo
            echo "| Pipeline | Resultado |"
            echo "| :--- | :--- |"
            for pair in \
              "detect-impact=${DETECT_IMPACT}" \
              "ci-core=${CI_CORE}" \
              "infra=${INFRA}" \
              "frontend-web=${FRONTEND_WEB}" \
              "megalinter=${MEGALINTER}" \
              "security-code-scanning=${SECURITY_CODE_SCANNING}" \
              "pr-governance=${PR_GOVERNANCE}"; do
              JOB="${pair%%=*}"
              RESULT="${pair#*=}"
              echo "| \`${JOB}\` | \`${RESULT}\` |"
            done
          } > "${REPORT}"

          cat "${REPORT}"

          if [ -n "${FAILED}" ]; then
            echo "❌ Quality Gate: uno o mas pipelines no cumplieron el contrato esperado:"
            printf "${FAILED}"
            exit 1
          fi

          echo "✅ Quality Gate: todos los pipelines ejecutados fueron exitosos o no aplican."

      - name: 2. Publicar Reporte
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-gate-report
          path: ${{ runner.temp }}/quality-gate.md
          retention-days: 7
          if-no-files-found: ignore
