# ==============================================================================
# Workflow: Sincronización Automática entre GitHub Security & Quality y Linear
# ==============================================================================
name: 📌 Sync GitHub Security & Quality to Linear

on:
  workflow_run:
    workflows: ["🛡️ Security & Quality Gates (Trivy)", "⚙️ Backend API CI", "🚀 CI/CD Pipeline - Quality Gates & Release"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 4 * * *" # Sincronización preventiva diaria a las 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ejecutar en modo de prueba (DRY_RUN: simula sin crear tickets reales en Linear)"
        type: boolean
        default: false
      team_key:
        description: "Clave del equipo en Linear (por defecto PEX)"
        type: string
        default: "PEX"
  repository_dispatch:
    types:
      - code_scanning_alert
      - dependabot_alert
      - secret_scanning_alert

permissions:
  contents: read
  security-events: read

jobs:
  sync-security-to-linear:
    name: 🎫 Sync Security Alerts to Linear Tickets
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 2. Configurar Node.js 22 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Instalar Dependencias del Monorepo
        run: npm ci --ignore-scripts

      - name: 4. Ejecutar Sincronización GitHub Security ➔ Linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LINEAR_TEAM_KEY: ${{ inputs.team_key || 'PEX' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: npx --no-install tsx scripts/github-security-linear-sync.ts
