name: 🧹 Git Tag Retention - Hierarchical SemVer Pruning

on:
  schedule:
    - cron: '0 5 * * 0' # Semanal los domingos a las 05:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo Dry-Run (solo simular, no eliminar)'
        type: boolean
        required: false
        default: true
      major_count:
        description: 'Número de líneas Major a conservar'
        type: number
        required: false
        default: 2
      minor_count:
        description: 'Número de líneas Minor por Major a conservar'
        type: number
        required: false
        default: 3
      patch_count:
        description: 'Número de patches por Minor a conservar (último patch)'
        type: number
        required: false
        default: 1
  workflow_run:
    # WF-002: el trigger resuelve por `name:` exacto del workflow de release,
    # no por ruta de archivo.
    workflows: ["🏷️ Automated Semantic Release & Tag"]
    types: [completed]
    branches: [main]

concurrency:
  group: tag-retention-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune-tags:
    name: "🧹 Purgar tags antiguos de release (Jerarquía SemVer: 2 Majors, 3 Minors, 1 Patch)"
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias del monorepo
        run: npm ci --ignore-scripts

      - name: Aplicar política jerárquica de retención de tags vía script tipado
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_MAJOR_COUNT: ${{ inputs.major_count }}
          INPUT_MINOR_COUNT: ${{ inputs.minor_count }}
          INPUT_PATCH_COUNT: ${{ inputs.patch_count }}
        run: |
          # Dry-run por defecto: seguro durante la puesta en marcha inicial
          DRY_RUN_FLAG="--dry-run"
          if [ "$INPUT_DRY_RUN" = "false" ]; then
            DRY_RUN_FLAG="--no-dry-run"
          fi
          MAJOR_COUNT="${INPUT_MAJOR_COUNT:-2}"
          MINOR_COUNT="${INPUT_MINOR_COUNT:-3}"
          PATCH_COUNT="${INPUT_PATCH_COUNT:-1}"
          echo "Ejecutando retención jerárquica de tags (majors=$MAJOR_COUNT, minors=$MINOR_COUNT, patches=$PATCH_COUNT, flag=$DRY_RUN_FLAG)..."
          node --experimental-strip-types scripts/tag-retention.ts --major="$MAJOR_COUNT" --minor="$MINOR_COUNT" --patch="$PATCH_COUNT" $DRY_RUN_FLAG
