# ==============================================================================
# Workflow de Pruebas de Carga y Performance Gate (Grafana k6)
# ==============================================================================
name: ⚡ Performance & Load Testing (k6)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL base del entorno objetivo"
        required: false
        default: "http://127.0.0.1:3000"
  schedule:
    - cron: "0 3 * * 1" # Ejecución semanal los lunes a las 03:00 UTC

jobs:
  k6-load-test:
    name: 🎯 k6 Performance Gate & SLO Validation
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 2. Configurar Node.js 22 LTS
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: "npm"

      - name: 3. Instalar Dependencias del Monorepo
        run: npm ci

      - name: 4. Compilar y Levantar Servidor Pokédex Node.js
        run: |
          npm run build
          node dist/server.cjs &
          sleep 4
          curl -f http://127.0.0.1:3000/healthz

      - name: 5. Ejecutar Pruebas de Carga con Grafana k6
        uses: grafana/k6-action@a54ec436a599ec51a629b359f1be038ae19ff92c # v0.4.0
        with:
          filename: tests/performance/k6_stress_test.js
          flags: --env TARGET_URL=${{ github.event.inputs.target_url || 'http://127.0.0.1:3000' }}
