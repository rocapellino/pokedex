# ==============================================================================
# Workflow Oficial de SAST e IaC Security para GitHub Code Scanning
# Herramientas: njsscan (Node.js/Express), Hadolint (Dockerfiles), Trivy IaC (OpenTofu)
# ==============================================================================
# NOTA: este workflow NO debe declarar `concurrency`. En un reusable workflow,
# `github.workflow` conserva el nombre del workflow INVOCADOR, por lo que todos
# los reusables calculaban el mismo grupo y se cancelaban entre si. La
# serializacion por PR ya la aplica `change-impact.yaml` a nivel de workflow.
name: 🛡️ Security & Code Scanning SAST (njsscan, Hadolint & Trivy IaC)

on:
  workflow_call:
    inputs:
      security_sast:
        description: "Ejecutar SAST de aplicación"
        type: boolean
        default: false
      security_iac:
        description: "Ejecutar análisis de seguridad IaC"
        type: boolean
        default: false
      linting:
        description: "Ejecutar Hadolint sobre Dockerfiles"
        type: boolean
        default: false
  schedule:
    - cron: '0 4 * * 1' # Escaneo preventivo semanal los lunes a las 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  njsscan:
    name: 🛡️ njsscan (Node.js & Express SAST)
    if: inputs.security_sast || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 2. Ejecutar análisis estático njsscan
        uses: ajinabraham/njsscan-action@231750a435d85095d33be7d192d52ec650625146 # v9
        with:
          args: 'apps/ --sarif --output njsscan.sarif'

      - name: 3. Subir reporte SARIF de njsscan a GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: njsscan.sarif
          category: njsscan

  hadolint:
    name: 🐳 Hadolint (Dockerfile Security Linter)
    if: inputs.linting || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 2. Ejecutar Hadolint en Dockerfiles
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
          format: sarif
          output-file: hadolint.sarif
          no-fail: true

      - name: 3. Subir reporte SARIF de Hadolint a GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  iac-scan:
    name: ☁️ Trivy IaC (OpenTofu & Terraform Security)
    if: inputs.security_iac || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 2. Escaneo de Seguridad IaC con Trivy (Reglas tfsec/defsec)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (master pinned)
        with:
          scan-type: 'config'
          scan-ref: 'infra/opentofu'
          format: 'sarif'
          output: 'trivy-iac.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: 3. Subir reporte SARIF de IaC a GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac
