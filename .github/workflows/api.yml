# ==============================================================================
# Workflow de CI para el Backend (Node.js 22 LTS + TypeScript 5.7)
# ==============================================================================
name: 🐍 Backend API CI

on:
  push:
    paths:
      - 'server.ts'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'server.ts'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/api.yml'

jobs:
  test-and-lint:
    name: 🧪 Lint, Security & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Instalar Dependencias
        run: npm ci

      - name: 4. Análisis Estático y Tipado con TypeScript
        run: npm run lint

      - name: 5. Compilación y Build de Producción (esbuild)
        run: npm run build

      - name: 6. Auditoría de Vulnerabilidades de Dependencias (SCA)
        run: npm audit --audit-level=high

