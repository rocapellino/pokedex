# ==============================================================================
# Workflow de CI para el Backend (Node.js 22 LTS + TypeScript 5.7)
# ==============================================================================
name: ⚙️ Backend API CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'server.ts'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/api.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'server.ts'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/api.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: 🧪 Lint, Security & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 2. Configurar Node.js 22 LTS
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Instalar Dependencias
        run: npm ci

      - name: 4. Análisis Estático y Tipado con TypeScript
        run: npm run lint

      - name: 5. Compilación y Build de Producción (esbuild)
        run: npm run build

      - name: 6. Ejecución de Tests Unitarios y de Seguridad
        run: npm test

      - name: 7. Auditoría de Vulnerabilidades de Dependencias (SCA)
        run: npm audit --audit-level=high
