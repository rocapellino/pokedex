# ==============================================================================
# Workflow de CI para el Backend (FastAPI + Python 3.11)
# ==============================================================================
name: 🐍 Backend API CI

on:
  push:
    paths:
      - 'apps/api/**'
      - 'src/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pytest.ini'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'src/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pytest.ini'
      - '.github/workflows/api.yml'

jobs:
  test-and-lint:
    name: 🧪 Lint, Security & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@v7

      - name: 2. Configurar Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 3. Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 4. Análisis Estático con Ruff
        run: |
          ruff check apps/api/src apps/api/tests

      - name: 5. Análisis de Seguridad SAST con Bandit
        run: |
          bandit -r apps/api/src src/ -ll -q

      - name: 6. Ejecutar Suite de Pruebas con Cobertura (Pytest-Cov)
        env:
          PYTHONPATH: .
        run: |
          pytest -v --cov=apps/api/src --cov-report=term-missing --cov-report=xml
