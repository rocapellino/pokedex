# ==============================================================================
# Workflow de CI para el Backend (FastAPI + Python 3.11)
# ==============================================================================
name: 🐍 Backend API CI

on:
  push:
    paths:
      - 'apps/api/**'
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/api.yml'

jobs:
  test-and-lint:
    name: 🧪 Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: 4. Análisis Estático con Ruff
        run: |
          ruff check apps/api/src apps/api/tests

      - name: 5. Ejecutar Suite de Pruebas con Pytest
        env:
          PYTHONPATH: .
        run: |
          pytest -v apps/api/tests/test_app.py
