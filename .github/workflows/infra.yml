# ==============================================================================
# Workflow de CI para Infraestructura (Kubernetes, OpenTofu y Helm)
# ==============================================================================
name: ⚙️ Infrastructure & IaC CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-iac:
    name: ☸️ K8s & OpenTofu Validation & Security
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 2. Configurar Helm CLI
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.0

      - name: 2b. Validar y Renderizar Helm Chart (Dev & Prod)
        run: |
          helm lint infra/helm/pokedex --set postgresql.auth.password=ci-validation-dummy-pass --set secrets.adminApiKey=ci-validation-dummy-key --set secrets.adminSessionSecret=ci-validation-dummy-session-secret --set redis.auth.password=ci-validation-dummy-pass
          helm template pokedex infra/helm/pokedex --set postgresql.auth.password=ci-validation-dummy-pass --set secrets.adminApiKey=ci-validation-dummy-key --set secrets.adminSessionSecret=ci-validation-dummy-session-secret --set redis.auth.password=ci-validation-dummy-pass > /tmp/rendered-dev.yaml
          helm template pokedex infra/helm/pokedex -f infra/helm/pokedex/values.prod.yaml > /tmp/rendered-prod.yaml
          echo "✅ Helm Chart validado y renderizado con éxito para dev y prod (prod desacoplado con existingSecret)."

      - name: 2c. Validar Integridad y Contratos de Seguridad en Manifiestos Renderizados
        run: |
          test -s /tmp/rendered-dev.yaml || { echo "❌ Error: rendered-dev.yaml está vacío"; exit 1; }
          test -s /tmp/rendered-prod.yaml || { echo "❌ Error: rendered-prod.yaml está vacío"; exit 1; }
          grep -q "allow-postgres-ingress" /tmp/rendered-prod.yaml || { echo "❌ Error: Falta NetworkPolicy de PostgreSQL en prod"; exit 1; }
          grep -q "allow-redis-ingress" /tmp/rendered-prod.yaml || { echo "❌ Error: Falta NetworkPolicy de Redis en prod"; exit 1; }
          echo "✅ Integridad y contratos Zero-Trust de Helm validados con éxito."

      - name: 3. Configurar OpenTofu CLI
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.8.8

      - name: 4. Ejecutar OpenTofu Format Check y Validate en Entornos (Proxmox y Cloud)
        run: |
          for dir in infra/opentofu/environments/proxmox infra/opentofu/environments/cloud; do
            echo "Verificando formato OpenTofu (fmt -check) en $dir..."
            tofu -chdir="$dir" fmt -check
            echo "Validando entorno OpenTofu en $dir..."
            tofu -chdir="$dir" init -backend=false
            tofu -chdir="$dir" validate
          done
          echo "✅ Todos los entornos híbridos de OpenTofu verificados y validados correctamente."

      - name: 5. Auditoría de Seguridad IaC con Checkov
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12.3122.0
        with:
          framework: terraform,kubernetes,helm
          directory: infra/
          soft_fail: false
          output_format: cli
