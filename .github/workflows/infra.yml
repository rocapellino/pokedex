# ==============================================================================
# Workflow de CI para Infraestructura (Kubernetes, Terraform y Ansible)
# ==============================================================================
name: ⚙️ Infrastructure & IaC CI

on:
  push:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'

jobs:
  validate-iac:
    name: ☸️ K8s & Terraform Validation & Security
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@v7

      - name: 2. Validar Manifiestos Kustomize de Kubernetes
        run: |
          kubectl kustomize infra/k8s/ > /dev/null
          echo "✅ Manifiestos de Kubernetes Kustomize válidos."

      - name: 3. Validar Sintaxis de Módulos Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.8.0

      - name: 4. Ejecutar Terraform Validate en Módulos Multi-Cloud
        run: |
          find infra/terraform/modules -name "*.tf" -exec dirname {} + | sort -u | while read -r dir; do
            echo "Validando módulo en $dir..."
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done
          echo "✅ Todos los módulos multi-cloud de Terraform validados correctamente."

      - name: 5. Auditoría de Seguridad IaC con Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform,kubernetes
          directory: infra/
          soft_fail: true
          output_format: cli
