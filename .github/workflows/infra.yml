# ==============================================================================
# Workflow de CI para Infraestructura (Kubernetes, Terraform y Ansible)
# ==============================================================================
name: ⚙️ Infrastructure & IaC CI

on:
  push:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'

jobs:
  validate-iac:
    name: ☸️ K8s & Terraform Validation & Security
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@v7

      - name: 2. Configurar Helm CLI
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: 2b. Validar y Renderizar Helm Chart (Dev & Prod)
        run: |
          helm lint infra/helm/pokedex
          helm template pokedex infra/helm/pokedex > /dev/null
          helm template pokedex infra/helm/pokedex -f infra/helm/pokedex/values.prod.yaml > /dev/null
          echo "✅ Helm Chart validado y renderizado con éxito para dev y prod."

      - name: 3. Validar Sintaxis de Módulos Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.8.0

      - name: 4. Ejecutar Terraform Validate en Módulos Multi-Cloud
        run: |
          find infra/terraform/modules -name "*.tf" -exec dirname {} + | sort -u | while read -r dir; do
            echo "Validando módulo en $dir..."
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done
          echo "✅ Todos los módulos multi-cloud de Terraform validados correctamente."

      - name: 5. Auditoría de Seguridad IaC con Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform,kubernetes
          directory: infra/
          soft_fail: true
          output_format: cli
