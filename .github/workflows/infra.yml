# ==============================================================================
# Workflow de CI para Infraestructura (Kubernetes, OpenTofu y Helm)
# ==============================================================================
name: ⚙️ Infrastructure & IaC CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-iac:
    name: ☸️ K8s & OpenTofu Validation & Security
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@v4

      - name: 2. Configurar Helm CLI
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: 2b. Validar y Renderizar Helm Chart (Dev & Prod)
        run: |
          helm lint infra/helm/pokedex
          helm template pokedex infra/helm/pokedex > /dev/null
          helm template pokedex infra/helm/pokedex -f infra/helm/pokedex/values.prod.yaml --set secrets.adminApiKey=ci-validation-dummy-key > /dev/null
          echo "✅ Helm Chart validado y renderizado con éxito para dev y prod."

      - name: 3. Configurar OpenTofu CLI
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.8

      - name: 4. Ejecutar OpenTofu Validate en Entornos (Proxmox y Cloud)
        run: |
          for dir in infra/opentofu/environments/proxmox infra/opentofu/environments/cloud; do
            echo "Validando entorno OpenTofu en $dir..."
            tofu -chdir="$dir" init -backend=false
            tofu -chdir="$dir" validate
          done
          echo "✅ Todos los entornos híbridos de OpenTofu validados correctamente."

      - name: 5. Auditoría de Seguridad IaC con Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform,kubernetes
          directory: infra/
          soft_fail: true
          output_format: cli
