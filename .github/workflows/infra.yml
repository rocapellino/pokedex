# ==============================================================================
# Workflow de CI para Infraestructura (Kubernetes, OpenTofu y Helm)
# ==============================================================================
name: ⚙️ Infrastructure & IaC CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-iac:
    name: ☸️ K8s & OpenTofu Validation & Security
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 2. Configurar Helm CLI
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.0

      - name: 2b. Validar y Renderizar Helm Chart (Dev, Prod, Cilium y Egress Gateway)
        run: |
          helm lint infra/helm/pokedex --set postgresql.auth.password=ci-validation-dummy-pass --set secrets.adminApiKey=ci-validation-dummy-key --set secrets.adminSessionSecret=ci-validation-dummy-session-secret --set redis.auth.password=ci-validation-dummy-pass --set secrets.backupEncryptionKey=ci-validation-dummy-key
          helm template pokedex infra/helm/pokedex --set postgresql.auth.password=ci-validation-dummy-pass --set secrets.adminApiKey=ci-validation-dummy-key --set secrets.adminSessionSecret=ci-validation-dummy-session-secret --set redis.auth.password=ci-validation-dummy-pass --set secrets.backupEncryptionKey=ci-validation-dummy-key > /tmp/rendered-dev.yaml
          helm template pokedex infra/helm/pokedex -f infra/helm/pokedex/values.prod.yaml > /tmp/rendered-prod.yaml
          helm template pokedex infra/helm/pokedex -f infra/helm/pokedex/values.prod.yaml --set ciliumNetworkPolicy.enabled=true > /tmp/rendered-cilium.yaml
          helm template pokedex infra/helm/pokedex -f infra/helm/pokedex/values.prod.yaml --set egressGateway.enabled=true --set networkPolicies.egress.useEgressGateway=true > /tmp/rendered-egress-gateway.yaml
          echo "✅ Helm Chart validado y renderizado con éxito para dev, prod, Cilium L7 y Egress Gateway."

      - name: 2c. Validar Integridad y Contratos de Seguridad en Manifiestos Renderizados
        run: |
          test -s /tmp/rendered-dev.yaml || { echo "❌ Error: rendered-dev.yaml está vacío"; exit 1; }
          test -s /tmp/rendered-prod.yaml || { echo "❌ Error: rendered-prod.yaml está vacío"; exit 1; }
          test -s /tmp/rendered-cilium.yaml || { echo "❌ Error: rendered-cilium.yaml está vacío"; exit 1; }
          test -s /tmp/rendered-egress-gateway.yaml || { echo "❌ Error: rendered-egress-gateway.yaml está vacío"; exit 1; }
          grep -q "allow-postgres-ingress" /tmp/rendered-prod.yaml || { echo "❌ Error: Falta NetworkPolicy de PostgreSQL en prod"; exit 1; }
          grep -q "allow-redis-ingress" /tmp/rendered-prod.yaml || { echo "❌ Error: Falta NetworkPolicy de Redis en prod"; exit 1; }
          grep -q "kind: CiliumNetworkPolicy" /tmp/rendered-cilium.yaml || { echo "❌ Error: Falta recurso CiliumNetworkPolicy"; exit 1; }
          grep -q "generativelanguage.googleapis.com" /tmp/rendered-cilium.yaml || { echo "❌ Error: Falta FQDN Gemini en CiliumNetworkPolicy"; exit 1; }
          grep -q "app.kubernetes.io/component: egress-gateway" /tmp/rendered-egress-gateway.yaml || { echo "❌ Error: Falta componente egress-gateway"; exit 1; }
          grep -q "pokedex-egress-gateway" /tmp/rendered-egress-gateway.yaml || { echo "❌ Error: Falta Service/Deployment de Egress Gateway"; exit 1; }
          
          # Prohibir estrictamente el tag :latest en producción
          if grep -E 'image:.*:latest' /tmp/rendered-prod.yaml; then
            echo "❌ Error de seguridad: Se detectó el tag prohibido ':latest' en manifiestos de producción."
            exit 1
          fi
          echo "✅ Integridad, contratos Zero-Trust, aislamiento L7 Egress y política anti-latest validados con éxito."

      - name: 2d. Instalar y Ejecutar Kubeconform (Validación estricta de esquemas OpenAPI K8s)
        run: |
          KUBECONFORM_VERSION="v0.6.7"
          curl -sL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C /tmp kubeconform
          /tmp/kubeconform -v
          /tmp/kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0 /tmp/rendered-dev.yaml /tmp/rendered-prod.yaml
          echo "✅ Validación de esquemas OpenAPI de Kubernetes con Kubeconform completada con éxito."

      - name: 2e. Instalar y Ejecutar Kube-Linter (Auditoría de Buenas Prácticas K8s)
        run: |
          KUBELINTER_VERSION="v0.7.2"
          curl -sL "https://github.com/stackrox/kube-linter/releases/download/${KUBELINTER_VERSION}/kube-linter-linux.tar.gz" | tar -xz -C /tmp kube-linter
          /tmp/kube-linter version
          /tmp/kube-linter lint /tmp/rendered-dev.yaml /tmp/rendered-prod.yaml --config .kube-linter.yaml
          echo "✅ Kube-Linter validó todas las directivas de seguridad y buenas prácticas en K8s."

      - name: 2f. Instalar y Ejecutar Kyverno CLI (Tests de Políticas de Admisión)
        run: |
          KYVERNO_VERSION="v1.12.5"
          curl -sL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" | tar -xz -C /tmp kyverno
          /tmp/kyverno version
          /tmp/kyverno test infra/k8s/kyverno-test/
          echo "✅ Pruebas de políticas de admisión Kyverno ejecutadas y aprobadas exitosamente."

      - name: 3. Configurar OpenTofu CLI
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.8.8

      - name: 4. Ejecutar OpenTofu Format Check y Validate en Entornos (Proxmox y AWS)
        run: |
          for dir in infra/opentofu/environments/proxmox infra/opentofu/environments/aws; do
            echo "Verificando formato OpenTofu (fmt -check) en $dir..."
            tofu -chdir="$dir" fmt -check
            echo "Validando entorno OpenTofu en $dir..."
            tofu -chdir="$dir" init -backend=false
            tofu -chdir="$dir" validate
          done
          echo "✅ Todos los entornos híbridos de OpenTofu verificados y validados correctamente."

      - name: 5. Auditoría de Seguridad IaC con Checkov
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12.3122.0
        with:
          framework: terraform,kubernetes,helm
          directory: infra/
          config_file: .checkov.yaml
          skip_path: infra/k8s/kyverno-test
          soft_fail: false
          output_format: cli

  kind-integration:
    name: "☸️ Kind Canonical K8s Integration"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 2. Crear Clúster Kind Efímero
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          config: infra/k8s/kind-cluster.yaml
          cluster_name: pokedex-local

      - name: 3. Compilar imágenes locales y cargar a Kind
        run: |
          docker build -t pokedex-api:local -f Dockerfile .
          docker build -t pokedex-web:local -f apps/frontend/Dockerfile apps/frontend
          kind load docker-image pokedex-api:local --name pokedex-local
          kind load docker-image pokedex-web:local --name pokedex-local

      - name: 4. Configurar Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.15.0'

      - name: 5. Desplegar Helm Chart en Kind
        run: |
          helm upgrade --install pokedex infra/helm/pokedex \
            --namespace pokemon-app --create-namespace \
            -f infra/helm/pokedex/values.yaml \
            --set api.image.repository=pokedex-api \
            --set api.image.tag=local \
            --set api.image.pullPolicy=Never \
            --set web.image.repository=pokedex-web \
            --set web.image.tag=local \
            --set web.image.pullPolicy=Never \
            --set postgres.persistence.enabled=false \
            --set redis.persistence.enabled=false \
            --wait --timeout 240s

      - name: 6. Validar Estado de Kubernetes y Probar Endpoints
        run: |
          echo "=== PODS EN CLUSTER ==="
          kubectl get pods,svc,netpol -n pokemon-app -o wide
          kubectl wait --namespace pokemon-app --for=condition=ready pod -l app=pokemon-api --timeout=60s
          kubectl wait --namespace pokemon-app --for=condition=ready pod -l app=pokemon-web --timeout=60s
          
          echo "=== TEST DIRECTO VIA PORT-FORWARD ==="
          kubectl port-forward -n pokemon-app svc/pokemon-api-svc 3000:3000 &
          sleep 4
          curl -f http://127.0.0.1:3000/healthz || { echo "❌ Endpoint /healthz falló"; exit 1; }
          curl -f http://127.0.0.1:3000/version || { echo "❌ Endpoint /version falló"; exit 1; }
          echo "✅ Integración canónica de Kubernetes verificada exitosamente en Kind."

