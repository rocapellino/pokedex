# ==============================================================================
# Workflow de Análisis Dinámico de Seguridad (DAST - OWASP ZAP Baseline Scan)
# ==============================================================================
name: "🕷️ OWASP ZAP (DAST Dynamic Security Testing)"

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL base para escaneo DAST (opcional, fallback automatico a gateway Docker)"
        required: false
  schedule:
    - cron: "0 4 * * 1" # Semanal los lunes a las 04:00 UTC

permissions:
  contents: read

jobs:
  zap_scan:
    name: "🕷️ OWASP ZAP Baseline Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 2. Configurar Node.js 22 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: 3. Instalar Dependencias del Backend
        run: npm ci --ignore-scripts

      - name: 4. Compilar y Levantar Servidor Pokédex Node.js
        run: |
          npm run build
          node apps/backend/dist/server.cjs &
          sleep 4
          # In ephemeral CI runners, the test server operates on local port without TLS certificates
          # nosemgrep: generic.text.ban-http-url, checkov:CKV_GIT_4
          PROTOCOL="http"
          TARGET_PORT="3000"
          curl -f "${PROTOCOL}://127.0.0.1:${TARGET_PORT}/healthz"
          # Verificar que el servidor también es alcanzable desde la red Docker (gateway 172.17.0.1)
          # nosemgrep: generic.text.ban-http-url
          DOCKER_GW="172.17.0.1"
          echo "DAST_TARGET_URL=${PROTOCOL}://${DOCKER_GW}:${TARGET_PORT}" >> "$GITHUB_ENV"

      - name: 5. Ejecutar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          # In ephemeral CI runners, the target operates on local Docker network without TLS
          target: ${{ github.event.inputs.target_url || env.DAST_TARGET_URL }}
          allow_issue_writing: false
          cmd_options: "-a"
