# ==============================================================================
# Workflow de Versionado Semántico y Creación Automática de Releases / Tags
# ==============================================================================
name: 🏷️ Automated Semantic Release & Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-tag-and-release:
    name: 🚀 Bump Version & Create GitHub Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip-release') && !contains(github.event.head_commit.message, 'chore(release)') && !contains(github.event.head_commit.message, 'chore(gitops)')"

    steps:
      - name: 1. Descargar Código Fuente con Historial Completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 2. Determinar Versión Semántica y Generar Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: "v"
          release_branches: "main"

      - name: 3. Crear Release en GitHub con Changelog Automático
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: steps.tag_version.outputs.new_tag
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Actualizar targetRevision en Manifiestos de ArgoCD
        if: steps.tag_version.outputs.new_tag
        run: |
          node --experimental-strip-types scripts/update-gitops-pin.ts --tag="${{ steps.tag_version.outputs.new_tag }}"

      - name: 5. Crear Pull Request de Promoción de Pinning en GitOps
        if: steps.tag_version.outputs.new_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          BRANCH="gitops/pin-${NEW_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add gitops/apps/
          git commit -m "chore(gitops): bump argocd targetRevision to ${NEW_TAG} [skip-release]"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore(gitops): bump argocd targetRevision to ${NEW_TAG}" \
            --body "### 🚀 Automated GitOps Pinning Promotion

Este Pull Request actualiza de forma controlada el \`targetRevision\` de las aplicaciones de ArgoCD al tag de release **${NEW_TAG}**.

#### Aplicaciones actualizadas:
- \`gitops/apps/root-application.yaml\`
- \`gitops/apps/app-proxmox.yaml\`
- \`gitops/apps/app-cloud.yaml\`

#### Flujo de Gobernanza:
1. Release tag **${NEW_TAG}** generado en CI.
2. Manifiestos de GitOps actualizados con pinning inmutable.
3. Requiere revisión y merge manual antes de que ArgoCD sincronice el clúster.

> Nota: Este commit incluye \`[skip-release]\` para evitar bucles recursivos de release." \
            --base main \
            --head "$BRANCH"
