# ==============================================================================
# Workflow: Sincronización Automática entre GitHub Security & Quality y Linear
# ==============================================================================
name: 📌 Sync GitHub Security & Quality to Linear

on:
  # WF-002: esta lista referenciaba workflow_run contra NOMBRES de workflow.
  # GitHub resuelve el trigger por `name:` exacto, no por ruta de archivo, así que
  # una referencia desactualizada no da error: simplemente nunca dispara.
  #
  # Estado previo: dos de las cuatro entradas NO existían
  # ("🛡️ Security & Quality Gates (Trivy)" y "⚙️ Backend API CI") y por tanto el
  # trigger NUNCA se activó (0 ejecuciones workflow_run en el historial).
  #
  # Criterio de inclusión: workflows cuya finalización conviene resincronizar
  # alertas de seguridad. Se incluyen (a) los productores de SARIF hacia Code
  # Scanning, (b) CodeQL, y (c) el pipeline principal como latido post-merge.
  #
  # Verificado con `tests/security/github_security_linear_sync.test.ts`, que valida
  # cada nombre contra el `name:` real de los workflows del repositorio.
  workflow_run:
    workflows:
      # Productores de SARIF (publican alertas en GitHub Code Scanning).
      - "🛡️ Security & Code Scanning SAST (njsscan, Hadolint & Trivy IaC)"
      - "🔐 Security Scan (Gitleaks)"
      # CodeQL: workflow gestionado por GitHub, no reside en el repositorio.
      - "CodeQL"
      # Latido post-merge del pipeline principal (WF-004).
      # Este productor antes era `🚀 CI/CD Pipeline`, que es un reusable
      # (`workflow_call`): nunca genera una ejecucion propia, por lo que la
      # entrada era inerte y el latido post-merge no ocurria. El productor real
      # del pipeline principal es el orquestador de impacto.
      - "🎯 Change Impact & Pipeline Orchestrator"
    types: [completed]
    branches: [main]
  # Cubre el resto de fuentes (Dependabot, Secret Scanning) y actúa como red de
  # seguridad si un workflow_run falla o no se dispara.
  schedule:
    - cron: "0 4 * * *" # Sincronización preventiva diaria a las 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ejecutar en modo de prueba (DRY_RUN: simula sin crear tickets reales en Linear)"
        type: boolean
        default: false
      team_key:
        description: "Clave del equipo en Linear (por defecto PEX)"
        type: string
        default: "PEX"
  # Punto de extensión para emisores EXTERNOS. Ningún workflow del repositorio
  # emite hoy estos eventos (verificado), por lo que este trigger no ha disparado;
  # se conserva deliberadamente como superficie de integración para webhooks.
  repository_dispatch:
    types:
      - code_scanning_alert
      - dependabot_alert
      - secret_scanning_alert

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: read

jobs:
  sync-security-to-linear:
    name: 🎫 Sync Security Alerts to Linear Tickets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: read
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 2. Configurar Node.js 22 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Instalar Dependencias del Monorepo
        run: npm ci --ignore-scripts

      - name: 4. Ejecutar Sincronización GitHub Security ➔ Linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LINEAR_TEAM_KEY: ${{ inputs.team_key || 'PEX' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: npx --no-install tsx scripts/github-security-linear-sync.ts
