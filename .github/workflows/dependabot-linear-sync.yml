# ==============================================================================
# Workflow: Crear Ticket Dinámico e Incremental en Linear ante PRs de Dependabot
# ==============================================================================
name: 📌 Sync Dependabot PRs to Linear

on:
  pull_request_target:
    types: [opened, closed]

permissions:
  contents: read

jobs:
  sync-linear-ticket:
    name: 🎫 Sync Dependabot PR with Linear
    if: >
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.id == 49699333 || github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'renovate[bot]')
    runs-on: ubuntu-latest

    steps:
      - name: 1. Sincronizar Ciclo de Vida del PR en Linear vía GraphQL API
        id: linear_sync
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          IS_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          if [ -z "$LINEAR_API_KEY" ]; then
            echo "⚠️ Secret LINEAR_API_KEY no encontrado. Omitiendo sincronización con Linear."
            exit 0
          fi

          # 1. Obtener dinámicamente el equipo de Linear y sus estados
          TEAM_RESPONSE=$(curl --proto '=https' -fsSL -X POST https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d '{"query": "{ teams { nodes { id key name states { nodes { id name type } } } } }"}')

          # Seleccionar el equipo con key 'PEX' o el primer equipo disponible
          TEAM_ID=$(echo "$TEAM_RESPONSE" | jq -r '(.data.teams.nodes[] | select(.key == "PEX") | .id) // .data.teams.nodes[0].id // empty')
          TEAM_KEY=$(echo "$TEAM_RESPONSE" | jq -r '(.data.teams.nodes[] | select(.key == "PEX") | .key) // .data.teams.nodes[0].key // empty')

          if [ -z "$TEAM_ID" ]; then
            echo "❌ No se encontró ningún equipo válido en Linear (buscando PEX)."
            echo "Respuesta de Linear: $TEAM_RESPONSE"
            exit 1
          fi

          echo "Equipo seleccionado en Linear: $TEAM_KEY ($TEAM_ID)"

          # 2. Manejo de Evento: PR Cerrado / Fusionado
          if [ "$EVENT_ACTION" = "closed" ]; then
            echo "Cerrando o cancelando ticket en Linear para PR #$PR_NUMBER (Merged: $IS_MERGED)..."
            
            SEARCH_PAYLOAD=$(jq -n \
              --arg term "PR #$PR_NUMBER" \
              --arg teamId "$TEAM_ID" \
              '{
                query: "query FindIssue($teamId: ID!, $term: String!) { issues(filter: { team: { id: { eq: $teamId } }, title: { containsIgnoreCase: $term } }) { nodes { id identifier title state { id name type } } } }",
                variables: { teamId: $teamId, term: $term }
              }')

            SEARCH_RESPONSE=$(curl --proto '=https' -fsSL -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d "$SEARCH_PAYLOAD")

            EXISTING_ISSUE_ID=$(echo "$SEARCH_RESPONSE" | jq -r '.data.issues.nodes[0].id // empty')
            EXISTING_IDENTIFIER=$(echo "$SEARCH_RESPONSE" | jq -r '.data.issues.nodes[0].identifier // empty')

            if [ -n "$EXISTING_ISSUE_ID" ]; then
              TARGET_STATE_TYPE="completed"
              if [ "$IS_MERGED" != "true" ]; then
                TARGET_STATE_TYPE="canceled"
              fi

              TARGET_STATE_ID=$(echo "$TEAM_RESPONSE" | jq -r --arg teamId "$TEAM_ID" --arg stateType "$TARGET_STATE_TYPE" '
                .data.teams.nodes[] | select(.id == $teamId) | .states.nodes[] | select(.type == $stateType) | .id
              ' | head -n 1)

              if [ -z "$TARGET_STATE_ID" ]; then
                TARGET_STATE_ID=$(echo "$TEAM_RESPONSE" | jq -r --arg teamId "$TEAM_ID" '
                  .data.teams.nodes[] | select(.id == $teamId) | .states.nodes[] | select(.type == "completed") | .id
                ' | head -n 1)
              fi

              UPDATE_PAYLOAD=$(jq -n \
                --arg issueId "$EXISTING_ISSUE_ID" \
                --arg stateId "$TARGET_STATE_ID" \
                '{
                  query: "mutation UpdateIssue($issueId: String!, $stateId: String!) { issueUpdate(id: $issueId, input: { stateId: $stateId }) { success issue { id identifier state { name } } } }",
                  variables: { issueId: $issueId, stateId: $stateId }
                }')

              curl --proto '=https' -fsSL -X POST https://api.linear.app/graphql \
                -H "Content-Type: application/json" \
                -H "Authorization: $LINEAR_API_KEY" \
                -d "$UPDATE_PAYLOAD" > /dev/null

              echo "✅ Ticket $EXISTING_IDENTIFIER actualizado a estado $TARGET_STATE_TYPE."
            else
              echo "ℹ️ No se encontró ticket en Linear correspondiente al PR #$PR_NUMBER."
            fi
            exit 0
          fi

          # 3. Manejo de Evento: PR Abierto -> Crear Ticket Incremental
          ISSUE_TITLE="Dependabot: $PR_TITLE (PR #$PR_NUMBER)"
          ISSUE_DESC=$(printf "Dependabot ha detectado actualizaciones de dependencias.\n\n🔗 **Pull Request en GitHub:** %s\n\n> *Nota:* Valida que los checks de CI pasen en verde antes de mergear." "$PR_URL")

          MUTATION_PAYLOAD=$(jq -n \
            --arg teamId "$TEAM_ID" \
            --arg title "$ISSUE_TITLE" \
            --arg desc "$ISSUE_DESC" \
            '{
              query: "mutation CreateIssue($teamId: String!, $title: String!, $desc: String!) { issueCreate(input: { teamId: $teamId, title: $title, description: $desc }) { success issue { id identifier title url } } }",
              variables: { teamId: $teamId, title: $title, desc: $desc }
            }')

          ISSUE_RESPONSE=$(curl --proto '=https' -fsSL -X POST https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d "$MUTATION_PAYLOAD")

          LINEAR_IDENTIFIER=$(echo "$ISSUE_RESPONSE" | jq -r '.data.issueCreate.issue.identifier // empty')
          LINEAR_URL=$(echo "$ISSUE_RESPONSE" | jq -r '.data.issueCreate.issue.url // empty')

          if [ -z "$LINEAR_IDENTIFIER" ] || [ -z "$LINEAR_URL" ]; then
            echo "❌ Error creando el ticket en Linear. Respuesta: $ISSUE_RESPONSE"
            exit 1
          fi

          echo "✅ Ticket incremental generado automáticamente por Linear: $LINEAR_IDENTIFIER"
          echo "🔗 URL del Ticket: $LINEAR_URL"
          echo "linear_identifier=$LINEAR_IDENTIFIER" >> "$GITHUB_OUTPUT"
          echo "linear_url=$LINEAR_URL" >> "$GITHUB_OUTPUT"
