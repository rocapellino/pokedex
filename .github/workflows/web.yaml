# ==============================================================================
# Workflow de CI para el Frontend (Nginx + JS Vanilla + HTML5 + CSS3)
# ==============================================================================
# NOTA: este workflow NO debe declarar `concurrency`. En un reusable workflow,
# `github.workflow` conserva el nombre del workflow INVOCADOR, por lo que todos
# los reusables calculaban el mismo grupo y se cancelaban entre si. La
# serializacion por PR ya la aplica `change-impact.yaml` a nivel de workflow.
name: 🌐 Frontend Web CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-web:
    name: 🎨 Lint, E2E, A11y & Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 2. Configurar Node.js 22 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Instalar Dependencias
        run: npm ci --ignore-scripts

      - name: 4. Compilar Aplicación (Backend + Frontend Vite)
        run: npm run build

      - name: 5. Verificación Estática y Typecheck con TypeScript
        run: |
          npm run lint --workspace=@pokedex/frontend
          echo "✅ Verificación de tipos TypeScript completada sin errores."

      - name: 6. Validar Configuración de Nginx
        # DOC-003/CI-004: la versión se extrae del Dockerfile del frontend, que es
        # la única SSOT de la imagen productiva. Repetir el número aquí تسمح que
        # CI validara la configuración contra una versión distinta de la que se
        # despliega. Se mantiene además el digest pinning del Dockerfile.
        run: |
          set -euo pipefail
          DOCKERFILE=apps/frontend/Dockerfile

          NGINX_IMAGE="$(grep -oE '^FROM nginx:[^@[:space:]]+@sha256:[a-f0-9]{64}' "${DOCKERFILE}" | head -n1 | sed 's/^FROM //')"
          if [ -z "${NGINX_IMAGE}" ]; then
            echo "❌ No se pudo resolver la imagen de Nginx desde ${DOCKERFILE}"
            echo "   Se espera una linea 'FROM nginx:<version>@sha256:<digest> AS runner'."
            exit 1
          fi
          echo "🔎 Validando la configuracion de Nginx contra la imagen productiva: ${NGINX_IMAGE}"

          # Produccion renderiza nginx.conf.template sustituyendo estas variables
          # (ver apps/frontend/Dockerfile). El renderizado se hace aqui, en el
          # runner, en lugar de dentro del contenedor: envsubst viene de gettext,
          # que el Dockerfile instala durante el build y por tanto NO forma parte
          # de la imagen oficial. Instalarlo en runtime exigiria red en el runner.
          export BACKOFFICE_ALLOWED_IP_1="10.42.0.1/32"
          export BACKOFFICE_ALLOWED_IP_2="192.168.1.50/32"
          export METRICS_ALLOWED_CIDR="10.42.0.0/24"

          RENDERED="${RUNNER_TEMP}/default.conf"
          node scripts/generate-nginx-conf.mjs --render "${RENDERED}"

          # El contenedor solo valida la sintaxis de la configuracion ya renderizada.
          # `--add-host=api:127.0.0.1` es necesario: el template declara
          # `proxy_pass http://api:...`, y `nginx -t` resuelve los hosts de upstream
          # en tiempo de validacion. Sin el, falla con "host not found in upstream".
          docker run --rm \
            --add-host=api:127.0.0.1 \
            -v "${RENDERED}:/etc/nginx/conf.d/default.conf:ro" \
            -v "${{ github.workspace }}/apps/frontend/dist:/usr/share/nginx/html:ro" \
            "${NGINX_IMAGE}" \
            nginx -t
          echo "✅ Configuración de Nginx válida contra la imagen productiva."

      - name: 7. Instalar Navegadores de Playwright
        run: npm run playwright:install

      - name: 8. Ejecutar Pruebas E2E y de Accesibilidad (Playwright + Axe-core)
        run: npm run test:e2e

      - name: 9. Auditoría de Core Web Vitals con Lighthouse CI
        run: npm run perf:lighthouse
