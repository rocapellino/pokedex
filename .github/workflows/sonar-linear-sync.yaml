# ==============================================================================
# Workflow: Sincronización Automática entre SonarCloud y Linear
# ==============================================================================
name: 📌 Sync SonarCloud Quality & Issues to Linear

on:
  workflow_run:
    # WF-002: el trigger resuelve por `name:` exacto del workflow, no por ruta de
    # archivo. Una referencia desactualizada no produce error: nunca dispara.
    #
    # WF-004 (correccion de causa raiz): el productor anterior era
    # `🚀 CI/CD Pipeline` (`.github/workflows/ci.yaml`), pero ese archivo es un
    # REUSABLE (`workflow_call`) y por definicion NO genera una ejecucion propia:
    # su run se atribuye al workflow invocador. Evidencia medida en la API de
    # GitHub: `ci.yaml` acumula 0 ejecuciones frente a 132 de
    # `change-impact.yaml`. Con ese productor, este workflow NUNCA se disparo y
    # la sincronizacion SonarCloud -> Linear quedo permanentemente muerta.
    #
    # El productor real del pipeline principal es el orquestador de impacto.
    workflows: ["🎯 Change Impact & Pipeline Orchestrator"]
    types: [completed]
    branches: [main]
  # Red de seguridad (WF-004): la sincronizacion no puede depender de un unico
  # trigger. Este era el unico workflow con `workflow_run` y SIN `schedule`, por
  # lo que era el mas expuesto a quedar inerte sin que nada lo delatara.
  schedule:
    - cron: '30 5 * * *' # Diario a las 05:30 UTC, desfasado del heartbeat de GitHub Security
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ejecutar en modo de prueba (DRY_RUN: no crea tickets reales en Linear)"
        type: boolean
        default: false
      team_key:
        description: "Clave del equipo en Linear (por defecto PEX)"
        type: string
        default: "PEX"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-to-linear:
    name: 🎫 Sync Sonar Quality to Linear Tickets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # El `schedule` (red de seguridad WF-004) debe poder ejecutar el job: con la condicion
    # anterior (solo workflow_dispatch o workflow_run) el cron diario salia siempre `skipped`.
    # workflow_run solo sincroniza si el orquestador termino bien.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 2. Configurar Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: 3. Instalar Dependencias del Proyecto
        run: npm ci --ignore-scripts

      - name: 4. Ejecutar Sincronización SonarCloud ➔ Linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: "rocapellino_pokedex"
          LINEAR_TEAM_KEY: ${{ inputs.team_key || 'PEX' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: npx --no-install tsx scripts/sonar-linear-sync.ts

      - name: 5. Limpieza de Tickets Obsoletos / Duplicados en Linear
        if: always()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_KEY: ${{ inputs.team_key || 'PEX' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: npx --no-install tsx scripts/cleanup-linear-tickets.ts

      - name: 6. Listar Tickets Abiertos de Linear (Verificación Post-Limpieza)
        if: always()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_KEY: ${{ inputs.team_key || 'PEX' }}
        run: npx --no-install tsx scripts/list-linear-issues.ts
