# ==============================================================================
# Pipeline de CI/CD - Quality Gates, Build, Security Scan y Publicación OCI
# Hardened con SHA pinning y principio de mínimo privilegio en GITHUB_TOKEN
# Invocado como Reusable Workflow por change-impact.yaml
# ==============================================================================
name: 🚀 CI/CD Pipeline

on:
  workflow_call:
    inputs:
      backend:
        description: "Ejecutar Quality Gates de Backend"
        type: boolean
        default: false
      frontend:
        description: "Ejecutar Quality Gates de Frontend"
        type: boolean
        default: false
      tests:
        description: "Ejecutar suite de tests y fuzzing"
        type: boolean
        default: false
      docker:
        description: "Compilar y preparar imagen Docker"
        type: boolean
        default: false
      security_sast:
        description: "Ejecutar análisis estático Semgrep"
        type: boolean
        default: false
      security_dependencies:
        description: "Ejecutar Dependency Review y SCA"
        type: boolean
        default: false
      security_container:
        description: "Ejecutar escaneo Trivy de contenedor"
        type: boolean
        default: false
      docs:
        description: "Ejecutar Documentation Quality Gate"
        type: boolean
        default: false
      agent_governance:
        description: "Ejecutar contratos de gobernanza AAS"
        type: boolean
        default: false
      is_unknown:
        description: "Modo Fail-Closed: ejecutar Full CI"
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        description: "Token de análisis del proyecto en SonarQube Cloud"
        required: true
  workflow_dispatch:

# Permiso mínimo global por defecto (solo lectura)
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Las imágenes de aplicación se publican como <registry>/<owner>/pokedex-{api,web}
  # (matriz de build-docker, trivy-scan y publish), los mismos repositorios que
  # despliega GitOps. Ver tests/contracts/delivery/image_publication_contract.test.ts.
  CHART_PATH: infra/helm/pokedex

jobs:
  aas-governance:
    name: "🤖 Gobernanza AAS"
    if: |
      inputs.agent_governance ||
      inputs.is_unknown ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 2. Configurar Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: 3. Instalar Dependencias
        run: npm ci --ignore-scripts

      - name: 4. Validar Gobierno y Manifest AAS
        run: npm run aas:verify

      - name: 5. Ejecutar Contratos AAS
        run: npm exec --no -- tsx --test tests/contracts/governance/aas_governance.test.ts

  # =======================================================
  # 1. QUALITY GATES (Ejecución en paralelo condicional)
  # =======================================================
  code-quality:
    name: "🔍 Auditoría de Calidad y Complejidad"
    if: |
      inputs.backend ||
      inputs.frontend ||
      inputs.tests ||
      inputs.is_unknown ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # PostgreSQL y Redis reales para tests/integration/db/ (activadas por las variables POKEDEX_TEST_*).
    # Mismas imágenes, fijadas por digest, que docker-compose.yaml; lo comprueba
    # tests/ci/db_integration_services.test.ts. Las credenciales son de un servicio efímero del runner.
    env:
      POKEDEX_TEST_DATABASE_URL: postgresql://postgres:pokedex_test@127.0.0.1:5432/postgres
      POKEDEX_TEST_REDIS_URL: redis://127.0.0.1:6379
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_PASSWORD: pokedex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 2. Configurar Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: 3. Instalar Dependencias
        run: npm ci --ignore-scripts

      - name: 4. Análisis de Tipos y Calidad con TypeScript
        run: npm run lint

      - name: 4b. Auditoría de Configuration Hygiene
        run: npm run lint:ignore:strict

      - name: 4c. YAML Extension Gate
        run: npm run lint:yaml:strict

      - name: 4d. YAML Reference Integrity Gate
        run: npm run lint:docs:refs

      - name: 4e. Test Surface Governance Gate
        run: npm run test:surface:check

      - name: 5. Compilación y Build con esbuild
        run: npm run build

      - name: 6. Ejecutar Tests de Unidad, Pentest y Seguridad
        run: npm test

      - name: 7. Ejecutar Suite Dinámica de API Fuzzing (DAST)
        run: npm run test:fuzz

      - name: 8. Auditoría de Vulnerabilidades de Dependencias (SCA)
        run: npm audit --audit-level=high --omit=dev

  sonarcloud:
    name: "📊 SonarQube Cloud"
    if: |
      inputs.backend ||
      inputs.frontend ||
      inputs.tests ||
      inputs.security_sast ||
      inputs.is_unknown ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # PostgreSQL y Redis reales para tests/integration/db/ (ver el job code-quality).
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      POKEDEX_TEST_DATABASE_URL: postgresql://postgres:pokedex_test@127.0.0.1:5432/postgres
      POKEDEX_TEST_REDIS_URL: redis://127.0.0.1:6379
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_PASSWORD: pokedex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: 1. Descargar Código Fuente con Historial Completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 2. Configurar Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: 3. Instalar Dependencias
        run: npm ci --ignore-scripts

      - name: 4. Generar Cobertura LCOV
        run: npm run test:coverage

      - name: 5. Validar Credencial de SonarQube Cloud
        run: test -n "$SONAR_TOKEN" || { echo "❌ SONAR_TOKEN no está configurado"; exit 1; }

      - name: 6. Resolver Versión SemVer del Proyecto
        id: project-version
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          node -e "if (!/^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$/.test(process.argv[1])) process.exit(1)" "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 7. Analizar Calidad, Cobertura y Deuda Técnica
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.project-version.outputs.version }}
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  semgrep:
    name: "🔍 Semgrep (SAST)"
    if: |
      inputs.security_sast ||
      inputs.is_unknown ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: returntocorp/semgrep@sha256:d8338657666af859e8562f367a9b9af24659c005f5a8677e6fca116b402d1a3d
    steps:
      - name: Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Escanear código fuente
        run: semgrep scan --config auto --error . --exclude node_modules --exclude dist --exclude coverage --exclude infra

  dependency-review:
    name: "🛡️ Dependency Review (SCA Gate en PR)"
    # actions/dependency-review-action requiere un contexto de Pull Request
    # (base_ref/head_ref). Fuera de pull_request/pull_request_target/merge_group
    # aborta con exit 1: "Both a base ref and head ref must be provided".
    # En push/workflow_dispatch la cobertura SCA la aporta `npm audit --omit=dev`
    # dentro del job "🔍 Auditoría de Calidad y Complejidad".
    if: |
      (inputs.security_dependencies ||
       inputs.is_unknown) &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'pull_request_target' ||
       github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Escanear dependencias con Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  docs-gate:
    name: "📚 Documentation Quality Gate"
    if: |
      inputs.docs ||
      inputs.is_unknown ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 2. Configurar Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: 3. Instalar Dependencias
        run: npm ci --ignore-scripts

      - name: 4. Validar Markdown Quality Gate
        # CI-006: se valida el árbol documental completo en lugar de una lista fija de
        # rutas. Una lista fija podía incluir documentos ya podados y dejar el gate
        # validando silenciosamente menos archivos.
        # CI-008: el árbol incluye AGENTS.md y .agents/, que `ci-impact.yaml` clasifica
        # como documentación y que antes ningún job lintaba.
        # `scripts/lint-markdown.ts` ahora falla si se le pasa una ruta inexistente.
        run: npm run lint:md -- README.md SECURITY.md AGENTS.md docs/ .agents/

      - name: 5. Validar Gobernanza Documental
        # CI-008: `docs:validate` (enlaces relativos, esquemas de archivo local e
        # indexación en docs/README.md) solo corría dentro de `npm test`, que un PR
        # puramente documental omite. Aquí se ejecuta siempre que cambia documentación.
        run: npm run docs:validate

  # =======================================================
  # 2. BUILD DOCKER (Solo si se requiere y Quality Gates pasan)
  # =======================================================
  build-docker:
    name: "🐳 Compilar Imagen Docker"
    needs: [code-quality, semgrep]
    if: |
      (inputs.docker ||
       inputs.security_container ||
       inputs.is_unknown ||
       github.event_name == 'push') &&
      (needs.code-quality.result == 'success' || needs.code-quality.result == 'skipped') &&
      (needs.semgrep.result == 'success' || needs.semgrep.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            image: pokedex-api
            dockerfile: ./apps/backend/Dockerfile
            description: Pokédex Backend Native Node.js & TypeScript Service
          - component: web
            image: pokedex-web
            dockerfile: ./apps/frontend/Dockerfile
            description: Pokédex Frontend Vite MPA servido por Nginx
    env:
      # jobs.<id>.env no admite el contexto env: el registro coincide con env.REGISTRY.
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extraer metadata y etiquetas
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REF }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=https://github.com/rocapellino/pokedex
            org.opencontainers.image.url=https://github.com/rocapellino/pokedex
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=Rodrigo Capellino
            org.opencontainers.image.licenses=MIT

      - name: Resolver metadatos de versión de la imagen
        id: version-metadata
        run: |
          # APP_VERSION proviene de la SSOT (package.json) y GIT_SHA del commit
          # exacto. Son metadatos conceptualmente distintos y deben viajar
          # separados como build-args para que /version los exponga así.
          APP_VERSION="$(node -p "require('./package.json').version")"
          GIT_SHA="${{ github.sha }}"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "GIT_SHA=${GIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "::notice title=VER-002::APP_VERSION=${APP_VERSION} | GIT_SHA=${GIT_SHA}"

      - name: Compilar y exportar imagen local
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version-metadata.outputs.APP_VERSION }}
            GIT_SHA=${{ steps.version-metadata.outputs.GIT_SHA }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Guardar imagen Docker en archivo tar
        run: |
          # Se guarda el repositorio completo: incluye el tag del SHA (que usan
          # trivy-scan y publish) y los tags de rama/semver.
          docker save "${IMAGE_REF}" -o /tmp/image.tar

      - name: Subir artefacto de imagen para escaneo
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image-${{ matrix.component }}
          path: /tmp/image.tar
          retention-days: 1

  # =======================================================
  # 3. TRIVY (Escaneo de Vulnerabilidades)
  # =======================================================
  trivy-scan:
    name: "🔒 Trivy (SCA & Vulnerabilidades de Contenedor)"
    needs: build-docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            image: pokedex-api
          - component: web
            image: pokedex-web
    env:
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - name: Descargar artefacto de la imagen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image-${{ matrix.component }}
          path: /tmp

      - name: Cargar imagen al Docker daemon
        run: |
          docker load -i /tmp/image.tar

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # v0.36.0 (master pinned)
        with:
          image-ref: ${{ env.IMAGE_REF }}:${{ github.sha }}
          format: 'table'
          exit-code: '1' # Falla si detecta vulnerabilidades CRITICAL o HIGH
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generar SBOM (Software Bill of Materials) con Trivy
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # v0.36.0 (master pinned)
        with:
          image-ref: ${{ env.IMAGE_REF }}:${{ github.sha }}
          format: 'cyclonedx'
          output: 'pokedex-sbom.json'

      - name: Subir artefacto SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx-${{ matrix.component }}
          path: pokedex-sbom.json
          retention-days: 14

      - name: Validar integridad y obligatoriedad del SBOM CycloneDX
        run: |
          test -s pokedex-sbom.json || { echo "❌ Error: pokedex-sbom.json está vacío"; exit 1; }
          grep -q '"bomFormat": *"CycloneDX"' pokedex-sbom.json || { echo "❌ Error: Formato CycloneDX no detectado en SBOM"; exit 1; }
          echo "✅ SBOM CycloneDX validado como artefacto obligatorio y conforme."

  # =======================================================
  # 4. PUBLISH (Solo en rama main tras pasar Trivy)
  # =======================================================
  publish:
    name: "📦 Publicar Imagen y Helm Chart a GHCR"
    needs: [build-docker, trivy-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            image: pokedex-api
          - component: web
            image: pokedex-web
    env:
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar imagen y hacer Push a GHCR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image-${{ matrix.component }}
          path: /tmp

      - name: Push de imagen Docker a GHCR
        run: |
          docker load -i /tmp/image.tar
          # Tags explícitos: el SHA completo lo resuelve la fase promote de
          # release-tag.yaml para fijar el digest en GitOps; `main` es informativo.
          docker push "${IMAGE_REF}:${{ github.sha }}"
          docker push "${IMAGE_REF}:main"

      - name: Extraer digest de imagen publicada
        id: image-digest
        run: |
          # Extraer digest OCI remoto directo desde GHCR usando docker buildx imagetools
          DIGEST=$(docker buildx imagetools inspect "${IMAGE_REF}:${{ github.sha }}" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"')
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            DIGEST=$(docker inspect --format='{{range .RepoDigests}}{{.}}{{"\n"}}{{end}}' "${IMAGE_REF}:${{ github.sha }}" | grep '@sha256:' | head -n 1 | awk -F'@' '{print $2}')
          fi
          test -n "$DIGEST" || { echo "❌ Error: No se pudo determinar el digest OCI remoto de la imagen"; exit 1; }
          # Validación formal estricta del digest OCI (cadena completa sha256:<64 hex>; a diferencia
          # de `grep`, `[[ =~ ]]` rechaza valores multilínea aunque alguna línea sea válida)
          if ! [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "❌ Error crítico: Digest OCI de la imagen inválido ('$DIGEST'). Abortando."
            exit 1
          fi
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "✅ Digest OCI inmutable verificado: $DIGEST"

      - name: Configurar Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci --ignore-scripts

      - name: Configurar Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.17.0'

      - name: Validar consistencia criptográfica de Digest en Manifiestos Renderizados (Helm Template Estricto)
        run: |
          node --experimental-strip-types scripts/verify-image-digest-parity.ts --strict

      - name: Validar, empaquetar y publicar Helm Chart como OCI
        id: helm-push
        # El chart es único: se publica y firma una sola vez, en la pata api de la matriz.
        if: matrix.component == 'api'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          # 1. Validar sintaxis y templates del Chart
          helm lint ${{ env.CHART_PATH }}

          # 2. Empaquetar chart en /tmp
          helm package ${{ env.CHART_PATH }} --destination /tmp

          # 3. Autenticación con OCI registry en GHCR y push
          echo "$GITHUB_TOKEN" | helm registry login ${{ env.REGISTRY }} --username "$GH_ACTOR" --password-stdin
          CHART_OUTPUT=$(helm push /tmp/*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts 2>&1)
          echo "$CHART_OUTPUT"
          CHART_DIGEST=$(echo "$CHART_OUTPUT" | grep -i 'Digest:' | awk '{print $2}' | tr -d '\r\n')
          # Validación formal estricta del digest OCI (formato sha256:<64 hex>)
          if ! echo "$CHART_DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo "❌ Error crítico: Digest OCI del Helm Chart ausente o inválido ('$CHART_DIGEST'). Abortando."
            exit 1
          fi
          echo "chart_digest=$CHART_DIGEST" >> $GITHUB_OUTPUT
          echo "✅ Digest OCI de Helm Chart validado formalmente: $CHART_DIGEST"

      - name: Instalar Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Iniciar sesión en Cosign para GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | cosign login ${{ env.REGISTRY }} --username "$GH_ACTOR" --password-stdin

      - name: Firmar imagen Docker con Cosign por Digest Inmutable (Keyless Sigstore OIDC)
        env:
          IMAGE_DIGEST: ${{ steps.image-digest.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_REF}@${IMAGE_DIGEST}"

      - name: Firmar Helm Chart OCI con Cosign (Keyless Sigstore OIDC)
        if: matrix.component == 'api'
        env:
          CHART_DIGEST: ${{ steps.helm-push.outputs.chart_digest }}
        run: |
          test -n "$CHART_DIGEST" || {
            echo "❌ Error crítico: chart_digest no disponible para firma inmutable"
            exit 1
          }
          echo "Firmando Helm Chart exclusivamente por digest OCI inmutable: ${CHART_DIGEST}"
          cosign sign --yes "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/charts/pokedex@${CHART_DIGEST}"

      - name: Descargar artefacto SBOM para adjuntar y atestar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-cyclonedx-${{ matrix.component }}
          path: /tmp

      - name: Adjuntar SBOM a la imagen en GHCR con Cosign
        env:
          IMAGE_DIGEST: ${{ steps.image-digest.outputs.digest }}
        run: |
          cosign attach sbom --sbom /tmp/pokedex-sbom.json --type cyclonedx "${IMAGE_REF}@${IMAGE_DIGEST}"

      - name: Atestar criptográficamente SBOM con Cosign (in-toto attestation)
        env:
          IMAGE_DIGEST: ${{ steps.image-digest.outputs.digest }}
        run: |
          cosign attest --yes --predicate /tmp/pokedex-sbom.json --type cyclonedx "${IMAGE_REF}@${IMAGE_DIGEST}"

      - name: Generar y Firmar SLSA Provenance (GitHub Attestations)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REF }}
          subject-digest: ${{ steps.image-digest.outputs.digest }}
          push-to-registry: true

      - name: Verificar Criptográficamente Firma y Atestación con Cosign
        env:
          IMAGE_DIGEST: ${{ steps.image-digest.outputs.digest }}
        run: |
          echo "Verificando firma criptográfica de imagen Docker..."
          cosign verify "${IMAGE_REF}@${IMAGE_DIGEST}" \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
          echo "Verificando atestación criptográfica de SBOM CycloneDX..."
          cosign verify-attestation --type cyclonedx "${IMAGE_REF}@${IMAGE_DIGEST}" \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
          echo "✅ Firma de imagen y Atestación de SBOM verificadas criptográficamente con éxito."

      - name: Verificar Criptográficamente la Firma del Helm Chart OCI
        if: matrix.component == 'api'
        env:
          CHART_DIGEST: ${{ steps.helm-push.outputs.chart_digest }}
        run: |
          cosign verify "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/charts/pokedex@${CHART_DIGEST}" \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
          echo "✅ Firma de Helm Chart verificada criptográficamente con éxito."

      # La retención de GHCR la gobierna exclusivamente ghcr-retention.yaml
      # (scripts/ghcr-retention.ts), que protege los digests fijados en GitOps y los
      # artefactos de Cosign. La acción inline anterior (keep-n-tagged: 3) podía
      # purgar imágenes todavía desplegadas en producción.
