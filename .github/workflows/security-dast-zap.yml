# ==============================================================================
# Workflow de Análisis Dinámico de Seguridad (DAST - OWASP ZAP Baseline Scan)
# ==============================================================================
name: "🕷️ OWASP ZAP (DAST Dynamic Security Testing)"

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL base para escaneo DAST"
        required: false
        default: "http://172.17.0.1:3000"
  schedule:
    - cron: "0 4 * * 1" # Semanal los lunes a las 04:00 UTC

permissions:
  contents: read
  issues: write

jobs:
  zap_scan:
    name: "🕷️ OWASP ZAP Baseline Scan"
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 2. Configurar Node.js 22 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: 3. Instalar Dependencias del Backend
        run: npm ci --ignore-scripts

      - name: 4. Compilar y Levantar Servidor Pokédex Node.js
        run: |
          npm run build
          node apps/backend/dist/server.cjs &
          sleep 4
          # HTTP is intentional: the local CI server has no TLS certificate.
          # ZAP is a DAST tool that scans HTTP/HTTPS by design; clear-text is expected here.
          # nosemgrep: generic.text.ban-http-url, checkov:CKV_GIT_4
          curl -f http://127.0.0.1:3000/healthz
          # Verificar que el servidor también es alcanzable desde la red Docker (gateway 172.17.0.1)
          curl -f http://172.17.0.1:3000/healthz || echo "Docker gateway no disponible (entorno local)" # nosemgrep: generic.text.ban-http-url

      - name: 5. Ejecutar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          # HTTP target is intentional: this is a DAST scan against the local CI server.
          # ZAP's purpose is to test HTTP/HTTPS endpoints; HTTPS is not available in CI. # nosemgrep: generic.text.ban-http-url
          target: ${{ github.event.inputs.target_url || 'http://172.17.0.1:3000' }}
          allow_issue_writing: false
          cmd_options: "-a"
