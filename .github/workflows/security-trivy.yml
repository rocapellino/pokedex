# ==============================================================================
# Workflow de Seguridad SCA y Análisis de Vulnerabilidades con Trivy
# ==============================================================================
name: 🛡️ Security Vulnerability Scan (Trivy)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Dockerfile'
      - 'apps/**/Dockerfile'
      - 'apps/frontend/**'
      - 'package*.json'
      - '.github/workflows/security-trivy.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'Dockerfile'
      - 'apps/**/Dockerfile'
      - 'apps/frontend/**'
      - 'package*.json'
      - '.github/workflows/security-trivy.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # Escaneo semanal los lunes a las 04:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trivy-scan:
    name: 🔍 Trivy Vulnerability & Config Scan
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 2. Escaneo del Repositorio y Dependencias (SCA / FS)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # v0.36.0 (master pinned)
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: 3. Construir Imagen Backend para Escaneo
        run: |
          docker build -t pokedex-server:test -f Dockerfile .

      - name: 4. Escaneo de Imagen Docker Backend
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # v0.36.0 (master pinned)
        with:
          image-ref: 'pokedex-server:test'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: 5. Construir Imagen Frontend Web para Escaneo
        run: |
          docker build -t pokedex-web:test -f apps/frontend/Dockerfile .

      - name: 6. Escaneo de Imagen Docker Frontend Web
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # v0.36.0 (master pinned)
        with:
          image-ref: 'pokedex-web:test'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  infra-images-scan:
    name: ☸️ Weekly Infrastructure Base Images Scan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ['postgres:16-alpine', 'redis:7-alpine', 'edoburu/pgbouncer:1.22.0']
    steps:
      - name: Escanear imagen base de infraestructura
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # v0.36.0 (master pinned)
        with:
          image-ref: ${{ matrix.image }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
