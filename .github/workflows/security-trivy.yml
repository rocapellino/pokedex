# ==============================================================================
# Workflow de Seguridad SCA y Análisis de Vulnerabilidades con Trivy
# ==============================================================================
name: 🛡️ Security Vulnerability Scan (Trivy)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Dockerfile'
      - 'apps/**/Dockerfile'
      - 'package*.json'
      - '.github/workflows/security-trivy.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'Dockerfile'
      - 'apps/**/Dockerfile'
      - 'package*.json'
      - '.github/workflows/security-trivy.yml'
  schedule:
    - cron: '0 4 * * 1' # Escaneo semanal los lunes a las 04:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-scan:
    name: 🔍 Trivy Vulnerability & Config Scan
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@v4

      - name: 2. Escaneo del Repositorio y Dependencias (SCA / FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: 3. Construir Imagen Backend para Escaneo
        run: |
          docker build -t pokedex-server:test -f Dockerfile .

      - name: 4. Escaneo de Imagen Docker Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'pokedex-server:test'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

