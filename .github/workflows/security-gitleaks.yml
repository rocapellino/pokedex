name: 🔐 Security Scan (Gitleaks)

on:
  push:
    branches: [ main, master, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  gitleaks:
    name: 🛡️ Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 2. Install Gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.24.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo mv "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: 3. Run Gitleaks Detector
        run: |
          gitleaks detect --source=. --config=.gitleaks.toml --verbose --redact
