# ==============================================================================
# Workflow Oficial de Detección de Secretos con Gitleaks (Required Status Check)
# ==============================================================================
name: 🔐 Security Scan (Gitleaks)

# NOTA DE GOBERNANZA (CI-001):
# Este check es un Required Status Check en `.github/rulesets/main-protection.json`
# (context: "🛡️ Gitleaks Secret Detection"). GitHub NO reporta el check cuando un
# workflow se omite por `paths`/`paths-ignore`, dejando el PR en estado "Expected"
# y bloqueando el merge de forma indefinida.
#
# Por diseño NO se declara `paths` ni `paths-ignore`: el escaneo de secretos es un
# control "always" (ver `.github/ci-impact.yaml` -> `always: [{ id: secrets }]`) y
# debe ejecutarse en la totalidad de los Pull Requests, incluidos los documentales.
# La optimización del tiempo de ejecución se resuelve en el job, nunca en el trigger.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  gitleaks:
    name: 🛡️ Gitleaks Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 2. Install Gitleaks CLI (con Verificación Criptográfica SHA256)
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.+)$
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl --proto '=https' -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo mv "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: 3. Run Gitleaks Detector
        run: |
          gitleaks detect --source=. --config=.gitleaks.toml --verbose --redact --report-format=sarif --report-path=gitleaks.sarif

      - name: 4. Subir Reporte Gitleaks a GitHub Code Scanning (SARIF)
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
