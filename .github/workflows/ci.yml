# ==============================================================================
# Pipeline de CI/CD - Quality Gates, Build, Security Scan y Publicación OCI
# Hardened con SHA pinning y principio de mínimo privilegio en GITHUB_TOKEN
# ==============================================================================
name: 🚀 CI/CD Pipeline - Quality Gates & Release

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# Permiso mínimo global por defecto (solo lectura)
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART_PATH: infra/helm/pokedex

jobs:
  # =======================================================
  # 1. QUALITY GATES (Ejecución en paralelo)
  # =======================================================
  code-quality:
    name: "🔍 Auditoría de Calidad y Complejidad"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 2. Configurar Node.js 22 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Instalar Dependencias del Monorepo
        run: npm ci --ignore-scripts

      - name: 4. Análisis de Tipos y Calidad con TypeScript
        run: npm run lint

      - name: 5. Compilación y Build con esbuild
        run: npm run build

      - name: 6. Ejecutar Tests de Unidad, Pentest y Seguridad
        run: npm test

      - name: 7. Ejecutar Suite Dinámica de API Fuzzing (DAST)
        run: npm run test:fuzz

  semgrep:
    name: "🔍 Semgrep (SAST)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: returntocorp/semgrep@sha256:d8338657666af859e8562f367a9b9af24659c005f5a8677e6fca116b402d1a3d
    steps:
      - name: Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Escanear código fuente
        run: semgrep scan --config auto --error . --exclude node_modules --exclude dist --exclude coverage --exclude scripts

  checkov:
    name: "🏗️ Checkov (Seguridad IaC / Helm)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ejecutar Checkov sobre Infraestructura, OpenTofu y Helm
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12.3122.0
        with:
          framework: terraform,kubernetes,helm
          directory: infra/
          output_format: cli
          soft_fail: false

  dependency-review:
    name: "🛡️ Dependency Review (SCA Gate en PR)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Escanear dependencias con Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high


  # =======================================================
  # 2. BUILD DOCKER (Solo si los Quality Gates pasan)
  # =======================================================
  build-docker:
    name: "🐳 Compilar Imagen Docker"
    needs: [code-quality, semgrep, checkov]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Extraer metadata y etiquetas
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Compilar y exportar imagen local
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Guardar imagen Docker en archivo tar
        run: |
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} -o /tmp/image.tar

      - name: Subir artefacto de imagen para escaneo
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # =======================================================
  # 3. TRIVY (Escaneo de Vulnerabilidades)
  # =======================================================
  trivy-scan:
    name: "🔒 Trivy (SCA & Vulnerabilidades de Contenedor)"
    needs: build-docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar artefacto de la imagen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image
          path: /tmp

      - name: Cargar imagen al Docker daemon
        run: |
          docker load -i /tmp/image.tar

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # v0.36.0 (master pinned)
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-docker.outputs.image_tag }}
          format: 'table'
          exit-code: '1' # Falla si detecta vulnerabilidades CRITICAL o HIGH
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generar SBOM (Software Bill of Materials) con Trivy
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # v0.36.0 (master pinned)
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-docker.outputs.image_tag }}
          format: 'cyclonedx'
          output: 'pokedex-sbom.json'

      - name: Subir artefacto SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: pokedex-sbom.json
          retention-days: 14

  # =======================================================
  # 4. PUBLISH (Solo en rama main tras pasar Trivy)
  # =======================================================
  publish:
    name: "📦 Publicar Imagen y Helm Chart a GHCR"
    needs: [build-docker, trivy-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar imagen y hacer Push a GHCR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image
          path: /tmp

      - name: Push de imagen Docker a GHCR
        run: |
          docker load -i /tmp/image.tar
          docker push --all-tags ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Configurar Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.15.0'

      - name: Validar, empaquetar y publicar Helm Chart como OCI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Validar sintaxis y templates del Chart
          helm lint ${{ env.CHART_PATH }}
          
          # 2. Empaquetar chart en /tmp
          helm package ${{ env.CHART_PATH }} --destination /tmp
          
          # 3. Autenticación con OCI registry en GHCR y push
          echo "$GITHUB_TOKEN" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin
          helm push /tmp/*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

      - name: Instalar Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Iniciar sesión en Cosign para GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | cosign login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Firmar imagen Docker con Cosign (Keyless Sigstore OIDC)
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-docker.outputs.image_tag }}

      - name: Firmar Helm Chart OCI con Cosign (Keyless Sigstore OIDC)
        run: |
          CHART_VERSION=$(grep '^version:' ${{ env.CHART_PATH }}/Chart.yaml | awk '{print $2}')
          cosign sign --yes ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/pokedex:${CHART_VERSION}

      - name: Descargar artefacto SBOM para adjuntar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-cyclonedx
          path: /tmp

      - name: Adjuntar SBOM a la imagen en GHCR con Cosign
        run: |
          cosign attach sbom --sbom /tmp/pokedex-sbom.json --type cyclonedx ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-docker.outputs.image_tag }}
