# ==============================================================================
# Workflow Principal de CI / CD Integrador del Monorepo
# ==============================================================================
name: 🚀 Monorepo Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: 🔍 Auditoría de Calidad y Complejidad
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Instalar Dependencias del Monorepo
        run: npm ci

      - name: 4. Análisis de Tipos y Calidad con TypeScript
        run: npm run lint

      - name: 5. Compilación y Build con esbuild
        run: npm run build

      - name: 6. Configurar Python para Auditoría
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 7. Ejecutar Auditoría de Duplicación e Integridad
        run: python scripts/audit_code_quality.py

  sast-semgrep:
    name: 🛡️ SAST Multi-Lenguaje (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@v4

      - name: 2. Escaneo SAST con Semgrep OSS
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/python
            p/javascript
            p/dockerfile
          auditOn: push
        continue-on-error: true

  docker-build-test:
    name: 🐳 Docker Multi-Stage Build & SBOM
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@v4

      - name: 2. Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Compilar Imagen Pokédex Full-Stack (Node.js & TS)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: pokedex-server:test

      - name: 4. Compilar Imagen de Web (Nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          load: true
          tags: pokedex-web:test

      - name: 5. Generar SBOM con Anchore Syft (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: pokedex-server:test
          format: spdx-json
          output-file: pokedex-server-sbom.spdx.json

