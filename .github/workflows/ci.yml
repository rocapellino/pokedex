# ==============================================================================
# Workflow Principal de CI / CD Integrador del Monorepo
# ==============================================================================
name: 🚀 Monorepo Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality:
    name: 🔍 Auditoría de Calidad y Complejidad
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@v7

      - name: 2. Configurar Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 3. Instalar Dependencias de Calidad
        run: |
          pip install -r requirements.txt
          pip install ruff radon xenon

      - name: 4. Ejecutar Script de Auditoría
        run: |
          python scripts/audit_code_quality.py

  sast-semgrep:
    name: 🛡️ SAST Multi-Lenguaje (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@v7

      - name: 2. Escaneo SAST con Semgrep OSS
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/python
            p/javascript
            p/dockerfile
          auditOn: push
        continue-on-error: true

  docker-build-test:
    name: 🐳 Docker Multi-Stage Build & SBOM
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@v7

      - name: 2. Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 3. Compilar Imagen de API (FastAPI)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/api/Dockerfile
          load: true
          tags: pokedex-api:test

      - name: 4. Compilar Imagen de Web (Nginx)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web/Dockerfile
          load: true
          tags: pokedex-web:test

      - name: 5. Generar SBOM con Anchore Syft (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: pokedex-api:test
          format: spdx-json
          output-file: pokedex-api-sbom.spdx.json
