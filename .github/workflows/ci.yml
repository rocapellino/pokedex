# ==============================================================================
# Pipeline de CI/CD - Quality Gates, Build, Security Scan y Publicación OCI
# ==============================================================================
name: 🚀 CI/CD Pipeline - Quality Gates & Release

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART_PATH: infra/helm/pokedex

jobs:
  # =======================================================
  # 1. QUALITY GATES (Ejecución en paralelo)
  # =======================================================
  gitleaks:
    name: "🛡️ Gitleaks (Detección de Secretos)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: "🔍 Semgrep (SAST)"
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Escanear código fuente
        run: semgrep scan --config auto --error src/

  checkov:
    name: "🏗️ Checkov (Seguridad IaC / Helm)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar Checkov sobre OpenTofu, Terraform y Helm
        uses: bridgecrewio/checkov-action@v12
        with:
          framework: terraform,helm
          directory: infra/
          output_format: cli
          soft_fail: false

  # =======================================================
  # 2. BUILD DOCKER (Solo si los Quality Gates pasan)
  # =======================================================
  build-docker:
    name: "🐳 Compilar Imagen Docker"
    needs: [gitleaks, semgrep, checkov]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extraer metadata y etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Compilar y exportar imagen local
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Guardar imagen Docker en archivo tar
        run: |
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} -o /tmp/image.tar

      - name: Subir artefacto de imagen para escaneo
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # =======================================================
  # 3. TRIVY (Escaneo de Vulnerabilidades)
  # =======================================================
  trivy-scan:
    name: "🔒 Trivy (SCA & Vulnerabilidades de Contenedor)"
    needs: build-docker
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefacto de la imagen
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Cargar imagen al Docker daemon
        run: |
          docker load -i /tmp/image.tar

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-docker.outputs.image_tag }}
          format: 'table'
          exit-code: '1' # Falla si detecta vulnerabilidades CRITICAL o HIGH
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # =======================================================
  # 4. PUBLISH (Solo en rama main tras pasar Trivy)
  # =======================================================
  publish:
    name: "📦 Publicar Imagen y Helm Chart a GHCR"
    needs: [build-docker, trivy-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar imagen y hacer Push a GHCR
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Push de imagen Docker a GHCR
        run: |
          docker load -i /tmp/image.tar
          docker push --all-tags ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Configurar Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.0'

      - name: Empaquetar y publicar Helm Chart como OCI
        run: |
          # Empaquetar chart en /tmp
          helm package ${{ env.CHART_PATH }} --destination /tmp
          
          # Autenticación con OCI registry en GHCR y push
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin
          helm push /tmp/*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
