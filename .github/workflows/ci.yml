# ==============================================================================
# Pipeline de CI/CD - Quality Gates, Build, Security Scan y Publicación OCI
# Hardened con SHA pinning y principio de mínimo privilegio en GITHUB_TOKEN
# ==============================================================================
name: 🚀 CI/CD Pipeline - Quality Gates & Release

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# Permiso mínimo global por defecto (solo lectura)
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART_PATH: infra/helm/pokedex

jobs:
  # =======================================================
  # 1. QUALITY GATES (Ejecución en paralelo)
  # =======================================================
  code-quality:
    name: "🔍 Auditoría de Calidad y Complejidad"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 2. Configurar Node.js 22 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Instalar Dependencias del Monorepo
        run: npm ci --ignore-scripts

      - name: 4. Análisis de Tipos y Calidad con TypeScript
        run: npm run lint

      - name: 5. Compilación y Build con esbuild
        run: npm run build

      - name: 6. Ejecutar Tests de Unidad, Pentest y Seguridad
        run: npm test

      - name: 7. Ejecutar Suite Dinámica de API Fuzzing (DAST)
        run: npm run test:fuzz

      - name: 8. Auditoría de Vulnerabilidades de Dependencias (SCA)
        run: npm audit --audit-level=high --omit=dev

  semgrep:
    name: "🔍 Semgrep (SAST)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: returntocorp/semgrep@sha256:d8338657666af859e8562f367a9b9af24659c005f5a8677e6fca116b402d1a3d
    steps:
      - name: Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Escanear código fuente
        run: semgrep scan --config auto --error . --exclude node_modules --exclude dist --exclude coverage --exclude infra

  dependency-review:
    name: "🛡️ Dependency Review (SCA Gate en PR)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Escanear dependencias con Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high


  # =======================================================
  # 2. BUILD DOCKER (Solo si los Quality Gates pasan)
  # =======================================================
  build-docker:
    name: "🐳 Compilar Imagen Docker"
    needs: [code-quality, semgrep]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extraer metadata y etiquetas
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=pokedex-api
            org.opencontainers.image.description=Pokédex Backend Native Node.js & TypeScript Service
            org.opencontainers.image.source=https://github.com/rocapellino/pokedex
            org.opencontainers.image.url=https://github.com/rocapellino/pokedex
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=Rodrigo Capellino
            org.opencontainers.image.licenses=MIT

      - name: Compilar y exportar imagen local
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Guardar imagen Docker en archivo tar
        run: |
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} -o /tmp/image.tar

      - name: Subir artefacto de imagen para escaneo
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # =======================================================
  # 3. TRIVY (Escaneo de Vulnerabilidades)
  # =======================================================
  trivy-scan:
    name: "🔒 Trivy (SCA & Vulnerabilidades de Contenedor)"
    needs: build-docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar artefacto de la imagen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image
          path: /tmp

      - name: Cargar imagen al Docker daemon
        run: |
          docker load -i /tmp/image.tar

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # v0.36.0 (master pinned)
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-docker.outputs.image_tag }}
          format: 'table'
          exit-code: '1' # Falla si detecta vulnerabilidades CRITICAL o HIGH
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generar SBOM (Software Bill of Materials) con Trivy
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # v0.36.0 (master pinned)
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-docker.outputs.image_tag }}
          format: 'cyclonedx'
          output: 'pokedex-sbom.json'

      - name: Subir artefacto SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: pokedex-sbom.json
          retention-days: 14

      - name: Validar integridad y obligatoriedad del SBOM CycloneDX
        run: |
          test -s pokedex-sbom.json || { echo "❌ Error: pokedex-sbom.json está vacío"; exit 1; }
          grep -q '"bomFormat": *"CycloneDX"' pokedex-sbom.json || { echo "❌ Error: Formato CycloneDX no detectado en SBOM"; exit 1; }
          echo "✅ SBOM CycloneDX validado como artefacto obligatorio y conforme."

  # =======================================================
  # 4. PUBLISH (Solo en rama main tras pasar Trivy)
  # =======================================================
  publish:
    name: "📦 Publicar Imagen y Helm Chart a GHCR"
    needs: [build-docker, trivy-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar imagen y hacer Push a GHCR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image
          path: /tmp

      - name: Push de imagen Docker a GHCR
        run: |
          docker load -i /tmp/image.tar
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-docker.outputs.image_tag }}

      - name: Extraer digest de imagen publicada
        id: image-digest
        run: |
          # Extraer digest OCI remoto directo desde GHCR usando docker buildx imagetools
          DIGEST=$(docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-docker.outputs.image_tag }} --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"')
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            DIGEST=$(docker inspect --format='{{range .RepoDigests}}{{.}}{{"\n"}}{{end}}' ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-docker.outputs.image_tag }} | grep '@sha256:' | head -n 1 | awk -F'@' '{print $2}')
          fi
          test -n "$DIGEST" || { echo "❌ Error: No se pudo determinar el digest OCI remoto de la imagen"; exit 1; }
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "✅ Digest OCI inmutable verificado: $DIGEST"

      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias del monorepo
        run: npm ci --ignore-scripts

      - name: Configurar Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.17.0'

      - name: Validar consistencia criptográfica de Digest en Manifiestos Renderizados (Helm Template Estricto)
        env:
          PUBLISHED_DIGEST: ${{ steps.image-digest.outputs.digest }}
        run: |
          node --experimental-strip-types scripts/verify-image-digest-parity.ts --published-digest "$PUBLISHED_DIGEST" --strict

      - name: Validar, empaquetar y publicar Helm Chart como OCI
        id: helm-push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Validar sintaxis y templates del Chart
          helm lint ${{ env.CHART_PATH }}
          
          # 2. Empaquetar chart en /tmp
          helm package ${{ env.CHART_PATH }} --destination /tmp
          
          # 3. Autenticación con OCI registry en GHCR y push
          echo "$GITHUB_TOKEN" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin
          CHART_OUTPUT=$(helm push /tmp/*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts 2>&1)
          echo "$CHART_OUTPUT"
          CHART_DIGEST=$(echo "$CHART_OUTPUT" | grep -i 'Digest:' | awk '{print $2}' | tr -d '\r\n')
          # Validación formal estricta del digest OCI (formato sha256:<64 hex>)
          if ! echo "$CHART_DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo "❌ Error crítico: Digest OCI del Helm Chart ausente o inválido ('$CHART_DIGEST'). Abortando."
            exit 1
          fi
          echo "chart_digest=$CHART_DIGEST" >> $GITHUB_OUTPUT
          echo "✅ Digest OCI de Helm Chart validado formalmente: $CHART_DIGEST"

      - name: Instalar Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Iniciar sesión en Cosign para GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | cosign login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Firmar imagen Docker con Cosign por Digest Inmutable (Keyless Sigstore OIDC)
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image-digest.outputs.digest }}

      - name: Firmar Helm Chart OCI con Cosign (Keyless Sigstore OIDC)
        run: |
          test -n "${{ steps.helm-push.outputs.chart_digest }}" || {
            echo "❌ Error crítico: chart_digest no disponible para firma inmutable"
            exit 1
          }
          echo "Firmando Helm Chart exclusivamente por digest OCI inmutable: ${{ steps.helm-push.outputs.chart_digest }}"
          cosign sign --yes ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/pokedex@${{ steps.helm-push.outputs.chart_digest }}

      - name: Descargar artefacto SBOM para adjuntar y atestar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-cyclonedx
          path: /tmp

      - name: Adjuntar SBOM a la imagen en GHCR con Cosign
        run: |
          cosign attach sbom --sbom /tmp/pokedex-sbom.json --type cyclonedx ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image-digest.outputs.digest }}

      - name: Atestar criptográficamente SBOM con Cosign (in-toto attestation)
        run: |
          cosign attest --yes --predicate /tmp/pokedex-sbom.json --type cyclonedx ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image-digest.outputs.digest }}

      - name: Generar y Firmar SLSA Provenance (GitHub Attestations)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image-digest.outputs.digest }}
          push-to-registry: true

      - name: Verificar Criptográficamente Firma y Atestación con Cosign
        run: |
          echo "Verificando firma criptográfica de imagen Docker..."
          cosign verify ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image-digest.outputs.digest }} \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
          echo "Verificando atestación criptográfica de SBOM CycloneDX..."
          cosign verify-attestation --type cyclonedx ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image-digest.outputs.digest }} \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
          echo "Verificando firma criptográfica de Helm Chart OCI..."
          cosign verify ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/pokedex@${{ steps.helm-push.outputs.chart_digest }} \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
          echo "✅ Firma de imagen, Atestación de SBOM y Firma de Helm Chart verificadas criptográficamente con éxito."

      - name: 🧹 Aplicar política de retención en GHCR (Mantener últimos 3 activos)
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          keep-n-tagged: 3
          delete-untagged: true
          dry-run: false
          token: ${{ secrets.GITHUB_TOKEN }}


