# ==============================================================================
# MegaLinter CI Workflow - Pokédex Monorepo
# Hardened con imagen liviana Cupcake y análisis diferencial en PRs
# https://megalinter.io/latest/
# ==============================================================================
# NOTA: este workflow NO debe declarar `concurrency`. En un reusable workflow,
# `github.workflow` conserva el nombre del workflow INVOCADOR, por lo que todos
# los reusables calculaban el mismo grupo y se cancelaban entre si. La
# serializacion por PR ya la aplica `change-impact.yaml` a nivel de workflow.
name: ⚡ MegaLinter - Quality & Syntax Linters

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  megalinter:
    name: "⚡ MegaLinter (Hadolint, Shellcheck, Actionlint, Yamllint)"
    # CI-002: MegaLinter no es un Quality Gate por si mismo; el unico Quality Gate
    # del repositorio es el job `🚦 Quality Gate` del orquestador.
    #
    # Motivo de `continue-on-error: true` en ESTE job: cada linter que MegaLinter
    # ejecuta tiene ya un control equivalente y mas especifico en otro pipeline:
    #
    #   Hadolint   -> Core CI / 🔍 Auditoría de Calidad y Complejidad (npm run lint)
    #   Shellcheck -> idem
    #   Actionlint -> validacion de workflows por el orquestador
    #   Yamllint   -> lint:yaml:strict (gate de extension YAML) y, para Kubernetes,
    #                Kubeconform, Kyverno CLI y Checkov en Infra CI
    #
    # El flag evita que este job se reporte en rojo por un linter duplicado
    # cuando el control equivalente ya habia fallado antes: la senal de error
    # useful llega por el control real, no por aqui.
    #
    # ATENCION (aplicado al ruleset `main-protection`): el job `🚦 Quality Gate`
    # incluye `megalinter` en su `needs`, de modo que un fallo de MegaLinter SI
    # bloquea el merge a traves del gate, pese al `continue-on-error` de aqui.
    # Esto es intencional: se eligio un unico Quality Gate que agrega todos los
    # pipelines, en lugar de varios checks required en paralelo que compitan entre si.
    # Megalinter aporta cobertura transversal unica (Hadolint, Shellcheck,
    # Actionlint y Yamllint sobre todo el arbol) que los gates equivalentes no
    # cubren con la misma amplitud.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 2. Ejecutar MegaLinter (Flavor CI Light)
        uses: oxsecurity/megalinter/flavors/ci_light@9949bad031045f366be2467e00e8371a7328a2e2 # v10.1.0
        env:
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEGALINTER_CONFIG: .mega-linter.yml

      - name: 3. Subir Reportes de Auditoría de MegaLinter
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: megalinter-reports
          path: |
            megalinter-reports
            mega-linter.log
          retention-days: 7
