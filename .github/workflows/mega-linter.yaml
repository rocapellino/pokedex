# ==============================================================================
# MegaLinter CI Workflow - Pokédex Monorepo
# Hardened con imagen liviana Cupcake y análisis diferencial en PRs
# https://megalinter.io/latest/
# ==============================================================================
# NOTA: este workflow NO debe declarar `concurrency`. En un reusable workflow,
# `github.workflow` conserva el nombre del workflow INVOCADOR, por lo que todos
# los reusables calculaban el mismo grupo y se cancelaban entre si. La
# serializacion por PR ya la aplica `change-impact.yml` a nivel de workflow.
name: ⚡ MegaLinter - Quality & Syntax Linters

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  megalinter:
    name: "⚡ MegaLinter (Hadolint, Shellcheck, Actionlint, Yamllint)"
    # CI-002: MegaLinter es un control ADVISORY, no un Quality Gate.
    #
    # Decision deliberada: cada linter que MegaLinter ejecuta aqui tiene ya un
    # gate bloqueante equivalente y mas estricto en otra parte del pipeline:
    #
    #   Hadolint  -> Core CI / 🔍 Auditoría de Calidad y Complejidad (npm run lint)
    #   Shellcheck-> mismo gate + el paso de MegaLinter
    #   Actionlint-> Workflows validados por el orquestador y MegaLinter
    #   Yamllint  -> lint:yaml:strict (gate de extension YAML) + Kubernetes
    #                schemas via Kubeconform, Kyverno CLI y Checkov en Infra CI
    #
    # Por eso `continue-on-error` se mantiene: evita que un linter duplicado
    # bloquee el merge cuando el control equivalente ya fallo antes. MegaLinter
    # aporta cobertura transversal y reporte, no capacidad de bloqueo.
    #
    # El Quality Gate unico y bloqueante es el job `🚦 Quality Gate` del
    # orquestador, que agrego el resultado de todos los pipelines.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 2. Ejecutar MegaLinter (Flavor CI Light)
        uses: oxsecurity/megalinter/flavors/ci_light@9949bad031045f366be2467e00e8371a7328a2e2 # v10.1.0
        env:
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEGALINTER_CONFIG: .mega-linter.yml

      - name: 3. Subir Reportes de Auditoría de MegaLinter
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: megalinter-reports
          path: |
            megalinter-reports
            mega-linter.log
          retention-days: 7
