# =============================================================================
# Workflow de Versionado Semántico y Creación Automática de Releases / Tags
# =============================================================================
# Orden canónico (REL-001): el tag se crea SOBRE el commit que introduce la
# versión en main, nunca antes:
#   main -> próxima versión -> PR de promoción -> merge -> tag vX.Y.Z -> Release
# El workflow opera en dos fases mutuamente excluyentes:
#   - "promote": calcula la versión siguiente y abre el PR atómico (sin tag).
#   - "tag": al mergear el PR de promoción, verifica la coherencia 1:1 y crea
#     el Git Tag firmado + GitHub Release sobre ese mismo commit.
# =============================================================================
name: 🏷️ Automated Semantic Release & Tag

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      gitsign_refresh:
        description: "Modo mantenimiento: imprime el bloque env: con los digests correctos de Gitsign. NO firma tags ni abre PRs (SEC-001)"
        type: boolean
        default: false
      gitsign_version:
        description: "Versión a resolver en modo refresco. Opcional; si se omite usa la fijada en el workflow"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: write

# Serializa las corridas sobre main para evitar carreras entre la fase de
# promoción y la creación del tag (REL-001).
concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-tag-and-release:
    name: 🚀 Bump Version & Create GitHub Release
    runs-on: ubuntu-latest
    # El merge del PR de promoción (mensaje "chore(release): promote ...")
    # SIEMPRE debe correr: es la fase "tag" que fija el anclaje version -> commit.
    # Los demás pushes a main corren la fase "promote", salvo marcas de
    # exclusión ([skip-release], chore(gitops)).
    if: >-
      github.ref == 'refs/heads/main' && (
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'chore(release): promote') ||
      (!contains(github.event.head_commit.message, 'skip-release') &&
      !contains(github.event.head_commit.message, 'chore(gitops)')))

    steps:
      - name: 1. Descargar Código Fuente con Historial Completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 2. Determinar Fase del Release (promote | tag)
        id: state
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(npm pkg get version | tr -d '"\n')"
          CURRENT_TAG="v${CURRENT_VERSION}"

          TAG_EXISTS=false
          if git rev-parse -q --verify "refs/tags/${CURRENT_TAG}" >/dev/null 2>&1; then
            TAG_EXISTS=true
          fi

          IS_PROMOTE_MERGE=false
          if [[ "${HEAD_MESSAGE}" == *"chore(release): promote"* ]]; then
            IS_PROMOTE_MERGE=true
          fi

          # REL-001: la fase "tag" se activa cuando main ya contiene la versión
          # (merge del PR de promoción) o cuando el tag aún no se creó (self-heal).
          PHASE="promote"
          if [ "${IS_PROMOTE_MERGE}" = "true" ] || [ "${TAG_EXISTS}" = "false" ]; then
            PHASE="tag"
          fi

          {
            echo "phase=${PHASE}"
            echo "current_tag=${CURRENT_TAG}"
            echo "tag_exists=${TAG_EXISTS}"
            echo "is_promote_merge=${IS_PROMOTE_MERGE}"
          } >> "${GITHUB_OUTPUT}"
          echo "🔎 Fase=${PHASE} | Tag canónico=${CURRENT_TAG} (existe=${TAG_EXISTS}) | Merge de promoción=${IS_PROMOTE_MERGE}"

      - name: 3. Calcular Próxima Versión y Changelog (dry-run)
        # REL-003: el dry-run SOLO tiene sentido en la fase "promote", donde aún no
        # existe una versión determinada y hay que calcular cuál será la siguiente.
        # En la fase "tag" la versión ya está fijada en main (`current_tag`) y el
        # dry-run calcularía la SIGUIENTE versión sobre el rango de commits del
        # último tag, lo que produce metadata de release inconsistente: el tag
        # publicado y el changelog describirían versiones distintas.
        id: tag_version
        if: steps.state.outputs.phase == 'promote'
        # v7 es la primera versión sobre el runtime `node24`. GitHub retiró Node 20
        # de los runners el 2026-09-23 y eliminó el opt-out
        # ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION; la v6.2 (node20) solo funciona
        # porque el runner la fuerza a Node 24 con un warning. El pin se mantiene por
        # SHA y el contrato consumido por el paso 8 (`new_tag`) es estable entre
        # v6 y v7, por lo que la actualización no altera la lógica de promoción.
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: "v"
          release_branches: "main"
          dry_run: true

      - name: 4. Instalar Cosign (verificador de confianza para el binario Gitsign)
        # SEC-001: el binario de Gitsign se descarga de un tercero, por lo que debe
        # verificarse antes de ejecutarse. Cosign es el verificador de referencia
        # de Sigstore y ya es parte de la cadena de confianza de este repositorio
        # (mismo pin por SHA que usa `ci.yaml` para firmar la imagen OCI).
        if: steps.state.outputs.phase == 'tag' && !inputs.gitsign_refresh
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 5. Verificar e Instalar Gitsign (Keyless Sigstore)
        # SEC-001: la descarga directa del ejecutable se verifica en dos niveles
        # independientes ANTES de instalar y ejecutar nada:
        #   1. Autenticidad: firma keyless de Sigstore (certificado Fulcio + Rekor)
        #      contra el bundle publicado, validando la identidad exacta del
        #      workflow de release de sigstore/gitsign.
        #   2. Integridad: digest SHA-256 fijado en este repositorio y contrastado
        #      contra el manifiesto `checksums.txt` publicado por Sigstore.
        # El binario nunca se instala ni se ejecuta si cualquiera de los dos falla.
        # El paso corre en la fase "tag" (verificación + instalación) y también
        # en modo mantenimiento (gitsign_refresh), que es independiente de la
        # fase: de otro modo el refresco sería inalcanzable cuando el tag de la
        # versión actual ya existe (PHASE=promote).
        if: steps.state.outputs.phase == 'tag' || inputs.gitsign_refresh == true
        env:
          GITSIGN_VERSION: "0.17.1"
          # Anclas de confianza fijadas en el repositorio. Deben refrescarse
          # manualmente junto con GITSIGN_VERSION en cada actualización.
          # El self-check (paso 0) valida esta coherencia en runtime y puede
          # regenerar el bloque con el input `gitsign_refresh` de workflow_dispatch.
          GITSIGN_SHA256: "69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae"
          GITSIGN_BUNDLE_SHA256: "6daa8356035524a1da8cca425f2b4e29bb8ca8d74d9a304bcd73a631ab165657"
          GITSIGN_CHECKSUMS_SHA256: "90678e6266a0ccf64da33dea621ac7678be5bc384ee989aa8a29d58ece7a27ce"
          GITSIGN_REFRESH: ${{ inputs.gitsign_refresh && 'true' || 'false' }}
          # Permite previsualizar los digests de otra versión sin tocar el repo.
          GITSIGN_TARGET_VERSION: ${{ inputs.gitsign_version }}
          # Sin este token la consulta a la API iría sin autenticar y quedaría
          # sujeta al rate limit de IPs compartidas de los runners, lo que
          # bloquearía el release por un motivo ajeno a la seguridad.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # En modo refresco se puede apuntar a otra versión sin tocar el repo.
          TARGET_VERSION="${GITSIGN_TARGET_VERSION:-${GITSIGN_VERSION}}"
          if ! [[ "${TARGET_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ SEC-001: versión inválida '${TARGET_VERSION}' (se espera X.Y.Z)" >&2
            exit 1
          fi
          BIN_NAME="gitsign_${TARGET_VERSION}_linux_amd64"
          # 0. Self-check de coherencia versión <-> digests (SEC-001).
          #    Consulta la API de GitHub y compara los digests publicados para
          #    GITSIGN_VERSION con los fijados en este workflow. Detecta el error
          #    de mantenimiento más probable (subir la versión sin refrescar los
          #    digests) con un mensaje accionable, ANTES de descargar nada.
          #
          #    Con GITSIGN_REFRESH=true imprime el bloque `env:` correcto y sale,
          #    permitiendo regenerar los digests sin transcripción manual.
          release_assets_json() {
            local -a auth_header=()
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              auth_header=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
            fi
            curl --proto '=https' --tlsv1.2 -sSfL \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'User-Agent: pokedex-release-tag' \
              "${auth_header[@]}" \
              "https://api.github.com/repos/sigstore/gitsign/releases/tags/v${TARGET_VERSION}"
          }
          if ! ASSETS_JSON="$(release_assets_json)"; then
            echo "❌ SEC-001: no se pudo consultar el release v${TARGET_VERSION} en la API de GitHub." >&2
            echo "   Causa probable: rate limit o release inexistente." >&2
            echo "   Es un fallo de disponibilidad, NO una discrepancia de digests." >&2
            exit 1
          fi

          remote_digest() {
            echo "${ASSETS_JSON}" \
              | jq -r --arg n "$1" '.assets[]? | select(.name == $n) | (.digest // "") | sub("^sha256:"; "")' \
              | head -n1
          }
          REMOTE_BIN="$(remote_digest "${BIN_NAME}")"
          REMOTE_BUNDLE="$(remote_digest "${BIN_NAME}.bundle")"
          REMOTE_CHECKSUMS="$(remote_digest "checksums.txt")"

          if [ "${GITSIGN_REFRESH:-false}" = "true" ]; then
            echo "# Digests publicados por GitHub para Gitsign v${TARGET_VERSION}"
            echo "          GITSIGN_VERSION: \"${TARGET_VERSION}\""
            echo "          GITSIGN_SHA256: \"${REMOTE_BIN}\""
            echo "          GITSIGN_BUNDLE_SHA256: \"${REMOTE_BUNDLE}\""
            echo "          GITSIGN_CHECKSUMS_SHA256: \"${REMOTE_CHECKSUMS}\""
            echo "# Modo mantenimiento: no se firmó ningún tag ni se abrió ningún PR."
            exit 0
          fi

          MISMATCH=0
          for pair in \
            "GITSIGN_SHA256:${GITSIGN_SHA256}:${REMOTE_BIN}" \
            "GITSIGN_BUNDLE_SHA256:${GITSIGN_BUNDLE_SHA256}:${REMOTE_BUNDLE}" \
            "GITSIGN_CHECKSUMS_SHA256:${GITSIGN_CHECKSUMS_SHA256}:${REMOTE_CHECKSUMS}"; do
            VAR="${pair%%:*}"; REST="${pair#*:}"; FIXED="${REST%%:*}"; REMOTE="${REST#*:}"
            if [ -z "${REMOTE}" ]; then
              echo "❌ SEC-001: el release v${TARGET_VERSION} no publica el asset de ${VAR}" >&2
              MISMATCH=1
            elif [ "${FIXED}" != "${REMOTE}" ]; then
              echo "❌ SEC-001: ${VAR} fijado (${FIXED}) != publicado por Sigstore (${REMOTE})" >&2
              MISMATCH=1
            fi
          done
          if [ "${MISMATCH}" != "0" ]; then
            echo "   Los digests fijados deben corresponder a Gitsign v${TARGET_VERSION}." >&2
            echo "   Para regenerarlos, reejecutá este workflow con gitsign_refresh=true" >&2
            echo "   y pegá el bloque impreso en el env: de este paso." >&2
            exit 1
          fi
          echo "✅ Coherencia versión ↔ digests verificada para Gitsign v${TARGET_VERSION}"

          BASE_URL="https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}"
          STAGE="${RUNNER_TEMP}/gitsign-verify"
          mkdir -p "${STAGE}"

          # 1. Descarga por HTTPS con TLS >= 1.2 y redirecciones estrictas.
          curl --proto '=https' --tlsv1.2 -sSfL "${BASE_URL}/${BIN_NAME}"       -o "${STAGE}/gitsign"
          curl --proto '=https' --tlsv1.2 -sSfL "${BASE_URL}/${BIN_NAME}.bundle" -o "${STAGE}/gitsign.bundle"
          curl --proto '=https' --tlsv1.2 -sSfL "${BASE_URL}/checksums.txt"      -o "${STAGE}/checksums.txt"

          # 2. Integridad contra los digests fijados en el repositorio.
          assert_sha256() {
            local file="$1" expected="$2" actual
            actual="$(sha256sum "${file}" | awk '{print $1}')"
            if [ "${actual}" != "${expected}" ]; then
              echo "❌ SEC-001: digest inesperado en $(basename "${file}")" >&2
              echo "   esperado=${expected}" >&2
              echo "   obtenido=${actual}" >&2
              return 1
            fi
            echo "✅ Integridad verificada: $(basename "${file}") sha256=${actual}"
          }
          assert_sha256 "${STAGE}/gitsign"       "${GITSIGN_SHA256}"
          assert_sha256 "${STAGE}/gitsign.bundle" "${GITSIGN_BUNDLE_SHA256}"
          assert_sha256 "${STAGE}/checksums.txt"  "${GITSIGN_CHECKSUMS_SHA256}"

          # 3. Autenticidad: firma keyless de Sigstore. Sin `|| true`: si la
          #    verificación falla, el paso aborta y Gitsign no llega a instalarse.
          cosign verify-blob \
            --bundle "${STAGE}/gitsign.bundle" \
            --certificate-identity "https://github.com/sigstore/gitsign/.github/workflows/release.yml@refs/tags/v${GITSIGN_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${STAGE}/gitsign"
          echo "✅ Autenticidad verificada: firma keyless de Sigstore (Fulcio + Rekor)"

          # 4. Contraste independiente con el manifiesto de checksums de Sigstore.
          #    $2 == BIN_NAME evita colisiones con .deb/.rpm/.apk/.bundle del mismo release.
          MANIFEST_DIGEST="$(awk -v f="${BIN_NAME}" '$2 == f {print $1}' "${STAGE}/checksums.txt")"
          if [ "${MANIFEST_DIGEST}" != "${GITSIGN_SHA256}" ]; then
            echo "❌ SEC-001: el manifiesto checksums.txt no coincide con el digest fijado" >&2
            echo "   manifiesto=${MANIFEST_DIGEST}" >&2
            echo "   fijado=${GITSIGN_SHA256}" >&2
            exit 1
          fi
          echo "✅ Contraste con checksums.txt de Sigstore correcto"

          # 5. Solo tras verificar, se instala y se ejecuta.
          sudo install -m 0755 "${STAGE}/gitsign" /usr/local/bin/gitsign
          gitsign version

      - name: 6. Verificar Coherencia 1:1 y Firmar Git Tag sobre el Commit de Promoción
        # REL-001: el tag se ancla al commit de main que YA contiene la versión
        # (package.json == Chart.yaml == targetRevision GitOps), nunca antes.
        # `!inputs.gitsign_refresh` es obligatorio: en modo mantenimiento el paso
        # anterior imprime los digests y termina, pero sin este guard los pasos
        # siguientes firmarían un tag real y abrirían un PR de promoción.
        if: steps.state.outputs.phase == 'tag' && !inputs.gitsign_refresh
        env:
          NEW_TAG: ${{ steps.state.outputs.current_tag }}
        run: |
          set -euo pipefail
          VERSION="${NEW_TAG#v}"

          PKG_VERSION="$(npm pkg get version | tr -d '"\n')"
          LOCK_VERSION="$(node -e 'const l=require("./package-lock.json");process.stdout.write(l.packages[""].version)')"
          CHART_VERSION="$(grep -E '^version:' infra/helm/pokedex/Chart.yaml | head -n1 | awk '{print $2}' | tr -d '"')"
          CHART_APP_VERSION="$(grep -E '^appVersion:' infra/helm/pokedex/Chart.yaml | head -n1 | awk -F'"' '{print $2}')"
          GITOPS_TAG="$(grep -E 'targetRevision:' gitops/apps/root-application.yaml | head -n1 | awk '{print $2}')"

          if [ "$PKG_VERSION" != "$VERSION" ] || [ "$LOCK_VERSION" != "$VERSION" ] || \
             [ "$CHART_VERSION" != "$VERSION" ] || [ "$CHART_APP_VERSION" != "$VERSION" ] || \
             [ "$GITOPS_TAG" != "$NEW_TAG" ]; then
            echo "❌ VER-001/REL-001: la metadata de versión no es coherente 1:1 con ${NEW_TAG}."
            echo "   package.json=${PKG_VERSION} package-lock=${LOCK_VERSION} Chart.version=${CHART_VERSION} Chart.appVersion=${CHART_APP_VERSION} GitOps=${GITOPS_TAG}"
            exit 1
          fi
          node --experimental-strip-types scripts/update-gitops-pin.ts --check
          echo "✅ Coherencia 1:1 verificada para ${NEW_TAG}; anclando tag a ${GITHUB_SHA}."

          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local gpg.format x509
          git config --local gpg.x509.program gitsign

          if git rev-parse -q --verify "refs/tags/${NEW_TAG}" >/dev/null 2>&1; then
            EXISTING_SHA="$(git rev-list -n1 "${NEW_TAG}")"
            if [ "${EXISTING_SHA}" != "${GITHUB_SHA}" ]; then
              echo "❌ REL-001: el tag ${NEW_TAG} ya existe apuntando a ${EXISTING_SHA},"
              echo "   pero el commit de promoción es ${GITHUB_SHA}. Trazabilidad rota."
              exit 1
            fi
            echo "ℹ️ El tag ${NEW_TAG} ya ancla el commit de promoción; se omite la creación."
            exit 0
          fi

          git tag -s -m "Release ${NEW_TAG}" "${NEW_TAG}" "${GITHUB_SHA}"
          gitsign verify-tag \
            --certificate-identity-regexp="^https://github\.com/${{ github.repository }}/" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${NEW_TAG}"
          git push origin "${NEW_TAG}"

      - name: 7. Crear Release en GitHub con Changelog Automático
        # REL-003: el changelog lo genera GitHub con `generate_release_notes` a
        # partir de `tag_name` (current_tag), por lo que siempre corresponde
        # exactamente a la versión publicada. Se eliminó el uso de
        # `steps.tag_version.outputs.changelog` porque ese output se calcula sobre
        # el rango del ÚLTIMO tag, no sobre el tag que se está publicando.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: steps.state.outputs.phase == 'tag' && !inputs.gitsign_refresh
        with:
          tag_name: ${{ steps.state.outputs.current_tag }}
          name: Release ${{ steps.state.outputs.current_tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 8. Crear Pull Request Atómico de Release y GitOps
        # main está protegida por el ruleset `main-protection`, por lo que la
        # metadata de versión y el pinning GitOps se promueven como una sola unidad.
        # El tag y el GitHub Release se crean EN LA SIGUIENTE corrida (fase "tag"),
        # cuando este PR ya fue mergado a main (REL-001).
        if: >-
          steps.state.outputs.phase == 'promote' &&
          !inputs.gitsign_refresh &&
          steps.tag_version.outputs.new_tag
        env:
          GH_TOKEN: ${{ secrets.RULESET_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          VERSION="${NEW_TAG#v}"
          BRANCH="release/promote-${NEW_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH" "${GITHUB_SHA}"
          # npm version actualiza package.json y package-lock.json (versión raíz)
          # de forma atómica; npm pkg set solo tocaría package.json (VER-001).
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i "s/^version: .*/version: ${VERSION}/" infra/helm/pokedex/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" infra/helm/pokedex/Chart.yaml
          node --experimental-strip-types scripts/update-gitops-pin.ts --tag="${NEW_TAG}"
          git add package.json package-lock.json infra/helm/pokedex/Chart.yaml gitops/apps/
          if git diff --cached --quiet; then
            echo "✅ Release y GitOps ya están sincronizados con ${NEW_TAG}."
            exit 0
          fi
          git commit -m "chore(release): promote ${NEW_TAG} [skip-release]"
          git push -u --force-with-lease origin "$BRANCH"
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')
          if [ -n "$EXISTING" ]; then
            echo "ℹ️ Pull Request de promoción ya abierto y actualizado: #${EXISTING}"
            sleep 5
            RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&head_branch=${BRANCH}&status=action_required" --jq '.workflow_runs[].id' 2>/dev/null || true)
            for RUN_ID in $RUNS; do
              echo "⚡ Auto-aprobando workflow run ${RUN_ID} para iniciar checks automáticamente..."
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/approve" || true
            done
            exit 0
          fi
          BODY=$(cat <<EOF
          ### 🚀 Automated Atomic Release Promotion

          El tag firmado y el GitHub Release de **${NEW_TAG}** se crearán SOBRE el commit de merge de este Pull Request (tras verificar la coherencia 1:1 de la metadata). Este PR promueve como una sola unidad la metadata de versión y el \`targetRevision\` de ArgoCD.

          #### Archivos sincronizados:
          - \`package.json\` (\`version\`)
          - \`package-lock.json\` (versión raíz)
          - \`infra/helm/pokedex/Chart.yaml\` (\`version\` y \`appVersion\`)
          - \`gitops/apps/root-application.yaml\`
          - \`gitops/apps/app-proxmox-preprod.yaml\`
          - \`gitops/apps/app-proxmox.yaml\`
          - \`gitops/apps/app-cloud.yaml\`

          #### Flujo de Gobernanza:
          1. Metadata de release y manifiestos GitOps actualizados atómicamente en este PR.
          2. Tras el merge, la fase \`tag\` de \`release-tag.yaml\` verifica la coherencia 1:1 y crea el Git Tag **${NEW_TAG}** firmado con Sigstore Gitsign sobre ESTE commit, junto con el GitHub Release.
          3. ArgoCD solo verá \`targetRevision: ${NEW_TAG}\` resuelto al commit que contiene la versión.

          > Nota: \`[skip-release]\` evita calcular una nueva versión al mergear este PR; el tag de **${NEW_TAG}** lo dispara la fase \`tag\` del propio workflow.
          EOF
          )
          gh pr create \
            --title "chore(release): promote ${NEW_TAG} [skip-release]" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH"

          # [REL-AUTO-APPROVE] Iniciar automáticamente los checks del PR de promoción
          # para que se ejecuten sin requerir aprobación manual previa.
          echo "🔍 Verificando si los workflows de CI requieren aprobación..."
          sleep 5
          RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&head_branch=${BRANCH}&status=action_required" --jq '.workflow_runs[].id' 2>/dev/null || true)
          for RUN_ID in $RUNS; do
            echo "⚡ Auto-aprobando workflow run ${RUN_ID} para iniciar checks..."
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/approve" || true
          done
