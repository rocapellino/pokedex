name: 🧹 GHCR Retention - Prune Older Packages

on:
  schedule:
    - cron: '0 4 * * 0' # Semanal los domingos a las 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo Dry-Run (solo simular, no eliminar)'
        type: boolean
        required: false
        default: false
      keep_versions:
        description: 'Número de versiones activas a conservar'
        type: number
        required: false
        default: 3
  workflow_run:
    # WF-002: el trigger resuelve por `name:` exacto del workflow, no por ruta de
    # archivo. Una referencia desactualizada no produce error: nunca dispara.
    #
    # WF-004 (correccion de causa raiz): el productor anterior era
    # `🚀 CI/CD Pipeline` (`.github/workflows/ci.yaml`), que es un REUSABLE
    # (`workflow_call`) y por definicion NO genera una ejecucion propia: su run
    # se atribuye al workflow invocador. Evidencia medida en la API de GitHub:
    # `ci.yaml` acumula 0 ejecuciones frente a 132 de `change-impact.yaml`. Con
    # ese productor, la purga post-CI NUNCA se disparo y la retencion solo
    # ocurria por el cron semanal, con el retraso que eso implica.
    #
    # El productor real del pipeline principal es el orquestador de impacto.
    workflows: ["🎯 Change Impact & Pipeline Orchestrator"]
    types: [completed]
    branches: [main]

permissions:
  packages: write
  contents: read

jobs:
  prune-ghcr:
    name: "🧹 Purgar imágenes antiguas en GHCR (Retención: 3)"
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias del monorepo
        run: npm ci --ignore-scripts

      - name: Aplicar política de retención en GHCR vía script tipado
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_KEEP_VERSIONS: ${{ inputs.keep_versions }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          KEEP_COUNT="${INPUT_KEEP_VERSIONS:-3}"
          echo "Ejecutando retención en GHCR (keep=$KEEP_COUNT, dry-run=$DRY_RUN_FLAG)..."
          node --experimental-strip-types scripts/ghcr-retention.ts --keep="$KEEP_COUNT" $DRY_RUN_FLAG

      # WF-003: se retira el paso `dataaxiom/ghcr-cleanup-action` de este workflow.
      #
      # Motivo: el script tipado de arriba ya aplica la retención (keep=3), de modo
      # que la acción de terceros repetía la misma poda con los mismos parámetros
      # dentro del mismo job.
      #
      # NO es una redundancia exacta, y conviene dejarlo explícito: la acción de
      # terceros es tag-aware (`keep-n-tagged` + `delete-untagged`), mientras que
      # `calculateVersionsToPrune` ordena por fecha sin inspeccionar los tags. La
      # limpieza de versiones untagged NO se pierde porque `ci.yaml` la ejecuta en
      # CADA publicación a main (`delete-untagged: true`, Nivel 1 de la política).
      #
      # Si en el futuro `ci.yaml` dejara de purgar untagged, este workflow ya no
      # sería un sustituto: habría que restituir el paso, no confiar en el script.
      #
      # La arquitectura de tres niveles y los triggers (schedule, workflow_run,
      # workflow_dispatch) NO cambian. Ver docs/operations/GHCR_RETENTION_POLICY.md
