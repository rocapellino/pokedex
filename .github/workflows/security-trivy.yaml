# ==============================================================================
# Workflow de Seguridad SCA y Análisis de Vulnerabilidades con Trivy
# ==============================================================================
name: 🛡️ Security Vulnerability Scan (Trivy)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # Escaneo semanal los lunes a las 04:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-scan:
    name: 🔍 Scheduled Trivy Repository Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 2. Escaneo del Repositorio y Dependencias (SCA / FS)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (master pinned)
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  infra-images-scan:
    name: ☸️ Weekly Infrastructure Base Images Scan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Cada imagen se escanea siempre: con el `fail-fast` por defecto, el fallo de una
      # cancelaba el resto y esa semana quedaban sin escanear (5-oct-2026: redis falló y
      # se cancelaron las dos de postgres y pgbouncer).
      fail-fast: false
      # NOTA (WF-001): estas referencias DEBEN coincidir con las imágenes que el
      # Chart despliega realmente, incluidas en infra/helm/pokedex/values.yaml.
      #
      # Antes de esta corrección el matrix escaneaba `edoburu/pgbouncer:1.22.0`,
      # que (a) no es la imagen desplegada — el repo usa la oficial
      # `pgbouncer/pgbouncer` — y (b) además retiraba ese tag del registro, por
      # lo que el job fallaba con MANIFEST_UNKNOWN sin escanear nada útil.
      # Se escaneaba, por tanto, una imagen distinta a la de producción.
      #
      # El digest es inmutable y por eso se fija: una etiqueta móvil podría
      # dejar de corresponden con lo desplegado entre el scan y el deploy.
      # `tests/security/iac_baseline_security.test.ts` verifica que estas
      # referencias sigan sincronizadas con values.yaml.
      matrix:
        image:
          - 'postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b'
          - 'postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27' # backup.image (17-bookworm)
          - 'valkey/valkey:8-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a'
          - 'pgbouncer/pgbouncer:1.25.2@sha256:c0c55b277858ca308eb5df7baf8b83fbaea60b2c666604f29d8fe25e9decac68'
    steps:
      - name: Escanear imagen base de infraestructura
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (master pinned)
        with:
          image-ref: ${{ matrix.image }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          # Mismo criterio que el escaneo de imágenes de la aplicación (ci.yaml): solo cuentan
          # las vulnerabilidades con corrección disponible, que son las accionables. Sin esto
          # el job reportaba cientos de hallazgos sin parche (97 en postgres-bookworm).
          ignore-unfixed: true
