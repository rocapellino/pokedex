# ==============================================================================
# .github/ci-impact.yaml
# ==============================================================================
# Contrato Declarativo de Análisis de Impacto de Cambios (Change Impact Analysis)
# Orquestado por repo-lifecycle y repo-impact.
#
# Define el mapeo determinista entre rutas de archivos modificados y los pipelines
# o Quality Gates requeridos, evitando ejecuciones redundantes en CI y habilitando
# un DAG dinámico.
# ==============================================================================

version: "1.0.0"
governance:
  framework: "repo-lifecycle"
  component: "change-impact-analysis"

# Controles mínimos no negociables que siempre se ejecutan en cualquier Pull Request
always:
  - id: "pr-governance"
    description: "Validación de estructura del PR, templates y políticas de calidad"
  - id: "secrets"
    description: "Escaneo estricto de credenciales y secretos en el git diff"

# Rutas transversales globales: cualquier alteración dispara validación integral
global:
  paths:
    - "package.json"
    - "package-lock.json"
    - "turbo.json"
    - "tsconfig.json"
    - ".pre-commit-config.yaml"
    - ".github/workflows/**"
    - "scripts/detect-change-impact.ts"
    - "scripts/declarations.d.ts"
  triggers:
    backend: true
    frontend: true
    tests: true
    docker: true
    kubernetes: true
    helm: true
    opentofu: true
    ansible: true
    documentation: true
    agent_governance: true
    security:
      secrets: true
      sast: true
      dependencies: true
      container: true
      iac: true
      supply_chain: true

# Reglas de impacto condicional por dominio
rules:
  agent_governance:
    description: "Gobernanza del catálogo externo AAS y sus contratos locales"
    paths:
      - ".agents/aas/**"
      - "scripts/aas-governance.ts"
      - "tests/aas_governance.test.ts"
    triggers:
      agent_governance: true
      linting: true
      documentation: true
      security:
        secrets: true
        sast: false
        dependencies: false
        container: false
        iac: false
        supply_chain: false

  documentation:
    description: "Modificaciones puramente documentales y políticas de gobernanza"
    paths:
      - "README.md"
      - "SECURITY.md"
      - "docs/**"
      - ".agents/**"
      - ".markdownlint.json"
      - ".markdownlintignore"
      - "LICENSE"
      - "scripts/lint-markdown.ts"
    triggers:
      documentation: true
      backend: false
      frontend: false
      tests: false
      docker: false
      kubernetes: false
      helm: false
      opentofu: false
      ansible: false
      security:
        secrets: false
        sast: false
        dependencies: false
        container: false
        iac: false
        supply_chain: false

  backend:
    description: "API Express, lógica de negocio, migraciones DB y esquemas"
    paths:
      - "apps/backend/**"
    triggers:
      backend: true
      tests: true
      docker: true
      security:
        secrets: true
        sast: true
        dependencies: true
        container: true
        iac: false
        supply_chain: true

  frontend:
    description: "Cliente web SPA, componentes UI y assets estáticos"
    paths:
      - "apps/frontend/**"
    triggers:
      frontend: true
      tests: true
      docker: true
      security:
        secrets: true
        sast: true
        dependencies: true
        container: true
        iac: false
        supply_chain: true

  kubernetes:
    description: "Manifiestos K8s, GitOps ArgoCD y scripts de plataforma/clúster"
    paths:
      - "infra/k8s/**"
      - "gitops/**"
      - "scripts/k8s-rollout-restart.ts"
      - "scripts/verify-secret-rotation.ts"
      - "scripts/update-gitops-pin.ts"
      - "scripts/verify-image-digest-parity.ts"
      - "scripts/probe-egress-security.ts"
      - "scripts/dr-drill.ts"
      - "scripts/dev-backup-gdrive.ts"
      - "scripts/dr_verify_restore.sh"
    triggers:
      kubernetes: true
      tests: true
      security:
        secrets: true
        sast: false
        dependencies: false
        container: false
        iac: true
        supply_chain: true

  helm:
    description: "Templates, values y empaquetado del Helm Chart oficial"
    paths:
      - "infra/helm/**"
    triggers:
      helm: true
      kubernetes: true
      security:
        secrets: true
        sast: false
        dependencies: false
        container: false
        iac: true
        supply_chain: true

  opentofu:
    description: "Infraestructura como Código (Proxmox VE, AWS EKS, módulos)"
    paths:
      - "infra/opentofu/**"
    triggers:
      opentofu: true
      security:
        secrets: true
        sast: false
        dependencies: false
        container: false
        iac: true
        supply_chain: false

  ansible:
    description: "Playbooks, roles e inventarios de hardening de sistemas base"
    paths:
      - "infra/ansible/**"
    triggers:
      ansible: true
      security:
        secrets: true
        sast: false
        dependencies: false
        container: false
        iac: true
        supply_chain: false

  docker:
    description: "Definiciones de contenedores, retención OCI y orquestación multi-servicio"
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - "infra/docker/**"
      - "scripts/ghcr-retention.ts"
    triggers:
      docker: true
      tests: true
      security:
        secrets: true
        sast: false
        dependencies: false
        container: true
        iac: true
        supply_chain: true

  linting:
    description: "Cambios que activan linters de sintaxis, higiene y configuración"
    # NOTA (CI-007): `.github/workflows/**` NO se lista aquí. Ya figura en
    # `global.paths`, y el motor retorna temprano en el Caso 2 antes de evaluar
    # `rules`, por lo que declararlo aquí lo convertía en código muerto.
    # Los workflows se validan vía el nivel Global (que ya dispara Full CI).
    paths:
      - 'Dockerfile'
      - 'apps/**/Dockerfile'
      - 'infra/**/*.yaml'
      - 'infra/**/*.yml'
      - 'scripts/**/*.sh'
      - 'dr_verify_restore.sh'
      - 'scripts/check-ignore-hygiene.ts'
      - 'scripts/check-yaml-extension.ts'
      - 'scripts/governance-audit-scripts.ts'
    triggers:
      linting: true
      tests: true
      security:
        secrets: true
        sast: false
        dependencies: false
        container: false
        iac: false
        supply_chain: false

  sync_tooling:
    description: "Scripts de sincronización y telemetría externa (Linear, SonarQube)"
    paths:
      - "scripts/github-security-linear-sync.ts"
      - "scripts/sonar-linear-sync.ts"
    triggers:
      tests: true
      security:
        secrets: true
        sast: false
        dependencies: false
        container: false
        iac: false
        supply_chain: false

  tests:
    description: "Suites de pruebas automatizadas del monorepo"
    paths:
      - "tests/**"
    triggers:
      tests: true
      security:
        secrets: true
        sast: false
        dependencies: false
        container: false
        iac: false
        supply_chain: false

  tests_unit:
    description: "Pruebas unitarias, contratos y fuzzing de backend"
    paths:
      - "tests/unit/**"
      - "tests/api-limits.test.ts"
      - "tests/concurrency.test.ts"
      - "tests/contracts.test.ts"
      - "tests/fuzzing.test.ts"
      - "tests/storage.test.ts"
      - "tests/version.test.ts"
    triggers:
      backend: true

  tests_frontend:
    description: "Pruebas de componentes frontend y suites E2E de navegador"
    paths:
      - "tests/frontend/**"
      - "tests/e2e/**"
    triggers:
      frontend: true

  tests_security:
    description: "Pruebas de políticas de seguridad, pentest y hardening"
    paths:
      - "tests/security/**"
      - "tests/security.test.ts"
      - "tests/pentest.test.ts"
    triggers:
      security:
        iac: true

  tests_gitops:
    description: "Pruebas de paridad e integración GitOps"
    paths:
      - "tests/gitops/**"
    triggers:
      kubernetes: true
      security:
        supply_chain: true

  tests_performance:
    description: "Pruebas de carga, estrés y umbrales de rendimiento k6"
    paths:
      - "tests/performance/**"
    triggers:
      backend: true

# Política Fail-Closed ante rutas desconocidas o incapacidad de determinar impacto
unknown:
  policy: "fail-closed"
  description: "Si el impacto es desconocido o incierto, se ejecuta Full CI"
  triggers:
    backend: true
    frontend: true
    tests: true
    docker: true
    kubernetes: true
    helm: true
    opentofu: true
    ansible: true
    documentation: true
    agent_governance: true
    security:
      secrets: true
      sast: true
      dependencies: true
      container: true
      iac: true
      supply_chain: true
