services:
  # ============================================================================
  # 1. Frontend Web (Nginx + Reverse Proxy) - DMZ Pública
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: pokemon-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"  # Único punto de entrada público expuesto al usuario/host
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============================================================================
  # 2. Backend API (Flask + Gunicorn WSGI) - Capa de Aplicación
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pokemon-api
    restart: unless-stopped
    expose:
      - "${PORT:-5000}"  # Solo accesible internamente por 'web' en frontend-net
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "${PORT:-5000}"
      FLASK_ENV: "${FLASK_ENV:-production}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:postgres_secure_password_k8s@postgres:5432/pokedex_db}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # 3. Base de Datos Relacional (PostgreSQL 16) - Capa de Datos Aislada
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: pokemon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-pokedex_db}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres_secure_password_k8s}"
    expose:
      - "5432"  # Aislado en backend-net: NO expuesto al host ni al frontend web
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pokedex_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 4. Base de Datos en Memoria / Caché (Redis 7) - Capa de Datos Aislada
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: pokemon-redis
    restart: unless-stopped
    expose:
      - "6379"  # Aislado en backend-net: NO expuesto al host ni al frontend web
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============================================================================
  # 5. Object Storage (MinIO S3 Compatible) - Capa de Almacenamiento Interno
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: pokemon-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin_secure_password}"
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ==============================================================================
# Segmentación de Redes (DMZ Architecture) y Volúmenes Persistentes
# ==============================================================================
networks:
  frontend-net:
    driver: bridge
    internal: false  # Permite al contenedor web publicar el puerto hacia el host
  backend-net:
    driver: bridge
    internal: true   # Aislamiento total: la red no tiene ruta de salida ni entrada a internet

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
