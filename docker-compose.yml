name: pokedex

services:
  # ============================================================================
  # 1. Frontend Web (Nginx + Reverse Proxy) - DMZ Pública
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: pokemon-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"  # Único punto de entrada público expuesto al usuario/host
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============================================================================
  # 2. Backend API (Node.js + TypeScript Full-Stack) - Capa de Aplicación
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pokemon-api
    restart: unless-stopped
    expose:
      - "${PORT:-3000}"  # Solo accesible internamente por 'web' en frontend-net
    environment:
      NODE_ENV: "production"
      PORT: "${PORT:-3000}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pokedex_db}}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      ADMIN_API_KEY: "${ADMIN_API_KEY}"
      AI_API_KEY: "${AI_API_KEY}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080,http://127.0.0.1:8080}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============================================================================
  # 3. Base de Datos Relacional (PostgreSQL 16) - Capa de Datos Aislada
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: pokemon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-pokedex_db}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: Variable POSTGRES_PASSWORD requerida en .env}"
    expose:
      - "5432"  # Aislado en backend-net: NO expuesto al host ni al frontend web
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-net
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-pokedex_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 4. Base de Datos en Memoria / Caché (Redis 7) - Capa de Datos Aislada
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: pokemon-redis
    restart: unless-stopped
    expose:
      - "6379"  # Aislado en backend-net: NO expuesto al host ni al frontend web
    volumes:
      - redis_data:/data
    networks:
      - backend-net
      - monitoring-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

# ==============================================================================
# Segmentación de Redes (DMZ Architecture) y Volúmenes Persistentes
# ==============================================================================
networks:
  frontend-net:
    name: pokedex-frontend-net
    driver: bridge
    internal: false  # Permite al contenedor web publicar el puerto hacia el host
  backend-net:
    name: pokedex-backend-net
    driver: bridge
    internal: true   # Aislamiento total: la red no tiene ruta de salida ni entrada a internet
  monitoring-net:
    name: monitoring-net
    external: true



volumes:
  postgres_data:
    name: pokedex_postgres_data
    driver: local
  redis_data:
    name: pokedex_redis_data
    driver: local

