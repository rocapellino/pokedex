# ==============================================================================
# .mcp/clients.yaml
# ==============================================================================
# Clientes Soportados y Capacidades de Integración MCP en rocapellino/pokedex
#
# Declara los clientes validados por el equipo, las rutas canónicas donde
# esperan su configuración (ignoradas por Git) y los formatos específicos.
# ==============================================================================

version: "1.0.0"

clients:
  cursor:
    name: "Cursor"
    description: "Editor Cursor IDE con soporte nativo de servidores MCP stdio y SSE"
    supported_transports:
      - "stdio"
      - "sse"
    config_path: ".cursor/mcp.json"
    format: "cursor-mcp-json"
    env_variable_expansion: true
    verified: true
    limitations: "Delega la ejecución en los comandos nativos de la máquina host. No sobrescribe configuraciones personales preexistentes sin confirmación."

  vscode:
    name: "Visual Studio Code"
    description: "VS Code con GitHub Copilot y extensiones MCP oficiales"
    supported_transports:
      - "stdio"
      - "sse"
    config_path: ".vscode/mcp.json"
    format: "vscode-mcp-json"
    env_variable_expansion: true
    verified: true
    limitations: ".vscode/ permanece estrictamente ignorado por .gitignore para impedir la exposición accidental de credenciales o configuraciones locales."

  claude:
    name: "Claude Code"
    description: "Cliente CLI y agente oficial de Claude Code (Anthropic)"
    supported_transports:
      - "stdio"
      - "sse"
    config_path: ".mcp.json"
    format: "claude-mcp-json"
    env_variable_expansion: true
    verified: true
    limitations: "Configuración de proyecto compartida en la raíz del repositorio (.mcp.json) según el estándar oficial de Claude Code. Ignorada por Git para prevenir fugas de credenciales."

  antigravity:
    name: "Google Antigravity"
    description: "Agente autónomo y entorno de desarrollo Antigravity (Google DeepMind / Gemini Code Assist)"
    supported_transports:
      - "stdio"
      - "sse"
    config_path: ".agents/mcp_config.json"
    format: "antigravity-mcp-json"
    env_variable_expansion: false
    verified: true
    limitations: "Configuración nativa de workspace en .agents/mcp_config.json. Requiere 'serverUrl' en lugar de 'url' para servidores remotos SSE/HTTP."

  generic:
    name: "Generic / Portable"
    description: "Configuración normalizada y exportable compatible con la especificación de referencia MCP"
    supported_transports:
      - "stdio"
      - "sse"
    config_path: ".mcp/generated/mcp-config.json"
    format: "standard-mcp-json"
    env_variable_expansion: false
    verified: true
    limitations: "Formato portable para tooling agnóstico o pipelines de validación CI."
