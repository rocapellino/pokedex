# ==============================================================================
# Pokédex Taskfile v3
# ==============================================================================
# Fachada de orquestación: la raíz solo declara variables compartidas, los
# submódulos especializados y los entrypoints de ciclo de vida del desarrollador.
# Con `flatten: true` los nombres de tarea se conservan sin prefijo de namespace.
# ==============================================================================
version: '3'

vars:
  HELM_TEST_SECRETS: '--set postgresql.auth.password=secret,secrets.adminApiKey=secret,secrets.adminSessionSecret=secret,secrets.backupEncryptionKey=secret,redis.auth.password=secret'
  HELM_IMAGE: 'alpine/helm:3.22.1@sha256:8191701ad1f82ee3695c87211fcbfe6d7b1bb7df92ac1c8de9ccdb0995a6a2c1'

# ------------------------------------------------------------------------------
# Submódulos Especializados (Modularización Taskfile v3)
# ------------------------------------------------------------------------------
includes:
  # Plataforma e infraestructura
  dev:
    taskfile: ./taskfiles/dev.yaml
    flatten: true
  k8s:
    taskfile: ./taskfiles/k8s.yaml
    flatten: true
  infra:
    taskfile: ./taskfiles/infra.yaml
    flatten: true
  security:
    taskfile: ./taskfiles/security.yaml
    flatten: true
  # Ingeniería, calidad y gobernanza
  testing:
    taskfile: ./taskfiles/testing.yaml
    flatten: true
  quality:
    taskfile: ./taskfiles/quality.yaml
    flatten: true
  ci:
    taskfile: ./taskfiles/ci.yaml
    flatten: true
  mcp:
    taskfile: ./taskfiles/mcp.yaml
    flatten: true


tasks:
  default:
    desc: "Interfaz oficialmente soportada: Muestra el catálogo de tareas disponibles (task --list)"
    cmds:
      - task --list

  install:
    desc: "Instala dependencias del monorepo de forma limpia y reproducible con npm ci"
    cmds:
      - npm ci

  dev:
    desc: "Inicia el servidor Pokédex Full-Stack en modo desarrollo con recarga automática"
    cmds:
      - npm run dev

  build:
    desc: "Compila y empaqueta el servidor TypeScript con esbuild y el frontend con Vite"
    sources:
      - apps/backend/src/**/*
      - apps/backend/server.ts
      - apps/backend/package.json
      - apps/frontend/src/**/*
      - apps/frontend/index.html
      - apps/frontend/backoffice.html
      - apps/frontend/vite.config.ts
      - apps/frontend/package.json
      - packages/contracts/src/**/*
      - packages/contracts/package.json
      - tsconfig.json
    generates:
      - apps/backend/dist/server.cjs
      - apps/frontend/dist/index.html
      - apps/frontend/dist/backoffice.html
    cmds:
      - npm run build

  build:backend:
    desc: "Compila y empaqueta el servidor TypeScript con esbuild"
    sources:
      - apps/backend/src/**/*
      - apps/backend/server.ts
      - apps/backend/package.json
      - packages/contracts/src/**/*
      - packages/contracts/package.json
      - tsconfig.json
    generates:
      - apps/backend/dist/server.cjs
    cmds:
      - npm run build:backend

  build:frontend:
    desc: "Compila y empaqueta el frontend con Vite"
    sources:
      - apps/frontend/src/**/*
      - apps/frontend/index.html
      - apps/frontend/backoffice.html
      - apps/frontend/vite.config.ts
      - apps/frontend/package.json
      - packages/contracts/src/**/*
      - packages/contracts/package.json
      - tsconfig.json
    generates:
      - apps/frontend/dist/index.html
      - apps/frontend/dist/backoffice.html
    cmds:
      - npm run build:frontend

  start:
    desc: "Ejecuta el bundle de producción compilado (npm start)"
    cmds:
      - npm start

  validate:
    desc: "Ejecuta todas las validaciones obligatorias del proyecto (lint, typecheck, build, test, fuzzing)"
    cmds:
      - npm run validate
